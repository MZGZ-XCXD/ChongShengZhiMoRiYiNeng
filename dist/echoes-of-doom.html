<script>
/* ===== js/ui/assets.js ===== */
/* 立绘与背景图：查清单 → 有图用 <img>，没图画「档案占位框」。
   清单由 tools/gen-asset-manifest.js 扫 assets/ 生成，图片路径写死在
   js/config/assets.js 里（单文件版构建靠这个把图内联成 data URI）。 */
(function () {
    const G = window.UI;

    function manifest() { return window.ASSET_MANIFEST || { portraits: {}, scenes: {}, dooms: {} }; }

    function portrait(id) {
        const m = manifest().portraits || {};
        return m[id] || null;
    }
    function scene(id) {
        const m = manifest().scenes || {};
        return m[id] || null;
    }
    function doom(id) {
        const m = manifest().dooms || {};
        return m[id] || null;
    }
    function count() {
        const m = manifest();
        return {
            portraits: Object.keys(m.portraits || {}).length,
            scenes: Object.keys(m.scenes || {}).length,
            dooms: Object.keys(m.dooms || {}).length,
        };
    }

    /* 同一个 id 每次都得到同样的色调：没有真图的时候也不会看起来乱 */
    function hash(str) {
        let h = 2166136261;
        for (let i = 0; i < String(str).length; i++) {
            h ^= String(str).charCodeAt(i);
            h = Math.imul(h, 16777619);
        }
        return Math.abs(h);
    }
    function hue(id) { return hash(id) % 360; }

    /* 立绘占位：一张「档案照」——人形剪影 + 编号，明确是空位而不是画坏了 */
    function portraitPlaceholder(cfg, opts) {
        opts = opts || {};
        const h = hue(cfg.id);
        const big = opts.size === 'large';
        const w = big ? 300 : 96, hh = big ? 380 : 120;
        const num = String(hash(cfg.id)).slice(0, 4);
        return '<svg class="ph ph-portrait" viewBox="0 0 ' + w + ' ' + hh + '" preserveAspectRatio="xMidYMid slice">' +
            '<defs><linearGradient id="pg' + cfg.id + '" x1="0" y1="0" x2="0" y2="1">' +
                '<stop offset="0%" stop-color="hsl(' + h + ',14%,20%)"/>' +
                '<stop offset="100%" stop-color="hsl(' + ((h + 40) % 360) + ',16%,9%)"/>' +
            '</linearGradient></defs>' +
            '<rect width="' + w + '" height="' + hh + '" fill="url(#pg' + cfg.id + ')"/>' +
            '<g fill="hsl(' + h + ',18%,34%)">' +
                '<circle cx="' + (w / 2) + '" cy="' + (hh * 0.36) + '" r="' + (w * 0.16) + '"/>' +
                '<path d="M ' + (w * 0.20) + ' ' + hh + ' q ' + (w * 0.30) + ' -' + (hh * 0.34) + ' ' + (w * 0.60) + ' 0 z"/>' +
            '</g>' +
            (big ? '<text x="' + (w / 2) + '" y="' + (hh - 34) + '" text-anchor="middle" fill="rgba(255,255,255,.5)"' +
                ' font-size="15" font-family="monospace">立绘未归档 · NO.' + num + '</text>' : '') +
            '</svg>';
    }

    /* 地点背景占位：一条街的剪影 + 地点名，同样是「照片还没归档」 */
    function scenePlaceholder(loc) {
        const h = hue(loc.id);
        return '<svg class="ph ph-scene" viewBox="0 0 320 180" preserveAspectRatio="xMidYMid slice">' +
            '<defs><linearGradient id="sg' + loc.id + '" x1="0" y1="0" x2="0" y2="1">' +
                '<stop offset="0%" stop-color="hsl(' + h + ',12%,16%)"/>' +
                '<stop offset="100%" stop-color="hsl(' + ((h + 30) % 360) + ',14%,7%)"/>' +
            '</linearGradient></defs>' +
            '<rect width="320" height="180" fill="url(#sg' + loc.id + ')"/>' +
            '<g fill="hsl(' + h + ',10%,22%)">' +
                '<rect x="10" y="86" width="52" height="94"/><rect x="70" y="62" width="40" height="118"/>' +
                '<rect x="118" y="104" width="58" height="76"/><rect x="184" y="76" width="46" height="104"/>' +
                '<rect x="238" y="94" width="66" height="86"/>' +
            '</g>' +
            '<rect y="150" width="320" height="30" fill="hsl(' + h + ',8%,13%)"/>' +
            '</svg>';
    }

    /* 有图就出图，没图就出占位 */
    function portraitHtml(cfg, cls, size) {
        const src = portrait(cfg.id);
        if (src) return '<img class="' + cls + '" src="' + src + '" alt="' + G.esc(cfg.name) + '" loading="lazy" draggable="false">';
        return '<div class="' + cls + ' is-ph" title="把立绘放到 assets/portraits/' + cfg.id + '.png 就会出现在这里">' +
            portraitPlaceholder(cfg, { size: size }) + '</div>';
    }
    function sceneHtml(loc, cls) {
        const src = scene(loc.id);
        if (src) return '<img class="' + cls + '" src="' + src + '" alt="' + G.esc(loc.name) + '" loading="lazy" draggable="false">';
        return '<div class="' + cls + ' is-ph" title="把背景图放到 assets/scenes/' + loc.id + '.jpg 就会出现在这里">' +
            scenePlaceholder(loc) + '</div>';
    }

    window.Assets = { manifest, portrait, scene, doom, count, portraitHtml, sceneHtml, hue };
})();

</script>
<script>
/* ===== js/ui/panels.js ===== */
/* 顶栏与侧栏：资源、空间、防线预警、事件入口、日志、状态 */
(function () {
    const G = window.UI;

    function renderHeader() {
        const s = GameState;
        const p = PhaseManager.current(s);
        const doom = DOOMS_CONFIG[s.doom] || {};
        const remain = Math.max(0, PHASES_CONFIG[1].start - s.hours);
        const html =
            '<div class="brand">' +
                '<span class="brand-mark">💠</span>' +
                '<h1>末日回声</h1>' +
                '<span class="brand-sub">Echoes of Doom</span>' +
            '</div>' +
            '<div class="topbar-stats">' +
                '<div class="top-stat" data-tip="phase"><span class="top-label">阶段</span>' +
                    '<span>' + p.icon + ' ' + p.name + '</span></div>' +
                '<div class="top-stat" data-tip="clock"><span class="top-label">生存</span>' +
                    '<span>' + Utils.fmtClock(s.hours) + '</span></div>' +
                '<div class="top-stat" data-tip="doom"><span class="top-label">末日</span>' +
                    '<span style="color:' + (doom.color || 'inherit') + '">' +
                    (doom.icon || '') + ' ' + (doom.name || '未知') + '</span></div>' +
                (p.id === 'pre'
                    ? '<div class="top-stat hot" data-tip="countdown"><span class="top-label">爆发倒计时</span>' +
                      '<span>' + Utils.fmtCountdown(remain) + '</span>' +
                      '<span class="top-sub">约 ' + Math.floor(remain / ACTION_COSTS.scavenge) + ' 次出门</span></div>'
                    : '') +
                '<div class="top-stat" data-tip="morale"><span class="top-label">士气</span><span>' +
                    Math.round(s.morale) + '%</span></div>' +
            '</div>' +
            '<div class="topbar-actions">' +
                '<button class="icon-btn' + (s.paused ? ' on' : '') + '" data-act="pause" title="暂停 / 继续">' +
                    (s.paused ? '▶' : '⏸') + '</button>' +
                (p.id === 'pre'
                    ? '<button class="icon-btn" disabled data-tip="speed">⏳</button>'
                    : '<button class="icon-btn" data-act="speed" data-tip="speed">×' + (s.speed || 1) + '</button>') +
                '<button class="icon-btn" data-act="theme" title="切换明暗主题">' +
                    (s.settings.theme === 'dark' ? '🌙' : '☀️') + '</button>' +
                '<button class="icon-btn" data-act="tab|settings" title="设置 / 存档 / 更新日志">⚙</button>' +
            '</div>';
        G.setHTML(document.getElementById('topbar-inner'), html);
    }

    function renderResources() {
        const s = GameState;
        let rows = '';
        for (const k of RESOURCES_ORDER) {
            const r = s.resources[k];
            if (!r) continue;
            if (!(r.visible || r.amount > 0)) continue;
            const rate = ProductionEngine.rateOf(s, k);
            const net = (rate.prod || 0) - (rate.use || 0);
            const cfg = RESOURCES_CONFIG[k];
            rows += '<div class="res-row" data-tip="res|' + G.esc(k) + '">' +
                '<span class="nm">' + cfg.icon + ' ' + k + '</span>' +
                '<span class="amt">' + Utils.fmtInt(r.amount) + '</span>' +
                '<span class="rate ' + G.rateClass(net) + '">' +
                    (Math.abs(net) < 1e-9 ? '—' : Utils.fmtRate(net, 1) + '/时') + '</span>' +
                '</div>';
        }
        const used = ResourcesManager.spaceUsed(s);
        const cap = ResourcesManager.spaceCap(s);
        const full = cap ? used / cap : 0;
        const html =
            '<div class="panel-head"><span class="panel-title">物资</span>' +
            '<span class="panel-extra" data-tip="crystal">💎 ' + Utils.fmtInt(s.space.crystals) + '</span></div>' +
            (rows || '<div class="empty">空间里空空的。</div>') +
            '<div class="space-box" data-tip="space">' +
                '<div class="space-line"><span>异能空间</span><span>' +
                    Utils.fmtInt(used) + ' / ' + Utils.fmtInt(cap) + ' 格</span></div>' +
                G.bar(full, full > 0.92 ? 'bad' : '') +
                '<div class="space-sub">Lv' + s.space.level + '　' +
                    (full > 0.92 ? '快装不下了' : '还有空位') + '</div>' +
            '</div>' +
            '<div class="panel-actions"><button class="btn ghost small" data-act="modal|clean">整理空间</button></div>';
        G.setHTML(document.getElementById('panel-resources'), html);
    }

    function renderAlert() {
        const s = GameState;
        let html = '';
        const info = DefenseEngine.info(s);
        if (info.active) {
            html += '<div class="panel-head"><span class="panel-title">防线</span></div>' +
                '<div class="alert-box' + (info.inWarning ? ' danger' : '') + '" data-tip="raid">' +
                '<div class="alert-title">🚨 ' + info.doomName + '</div>' +
                '<div class="alert-line">还有 <b>' + Utils.fmtCountdown(info.etaHours) + '</b></div>' +
                '<div class="alert-line">强度 <b>' + info.strength + '</b>　防御 <b>' + info.defense + '</b>　' +
                    '<span class="verdict v-' + (info.verdict === '稳' ? 'good' : (info.verdict === '危险' ? 'bad' : 'warn')) + '">' +
                    info.verdict + '</span></div>' +
                '</div>';
        } else {
            html += '<div class="panel-head"><span class="panel-title">防线</span></div>' +
                '<div class="alert-box calm" data-tip="countdown">' +
                '<div class="alert-title">🌤️ 爆发倒计时 ' + Utils.fmtCountdown(Math.max(0, 72 - s.hours)) + '</div>' +
                '<div class="alert-line">在世界安静下来之前，能搬多少搬多少。</div></div>';
        }
        if (s.shortages && s.shortages.length) {
            html += '<div class="alert-box danger"><div class="alert-title">⚠️ 物资见底</div>' +
                '<div class="alert-line">' + s.shortages.join('、') + ' 断了，士气在掉。</div></div>';
        }
        G.setHTML(document.getElementById('panel-alert'), html);
    }

    function renderEvent() {
        const s = GameState;
        const box = document.getElementById('panel-event');
        if (!s.pending || s.pending.type !== 'event') {
            box.style.display = 'none';
            G.setHTML(box, '');
            return;
        }
        const ev = EVENTS_CONFIG.find(x => x.id === s.pending.id);
        if (!ev) return;
        G.setHTML(box, '<div class="panel-head"><span class="panel-title">' + ev.icon + ' ' + G.esc(ev.name) + '</span></div>' +
            '<div class="event-card"><p>' + G.esc(ev.text) + '</p>' +
            '<button class="btn primary" data-act="openpending">做决定</button></div>');
        box.style.display = '';
    }

    function renderLog() {
        const s = GameState;
        const items = s.logs.slice(0, 12).map(l =>
            '<div class="log-item"><span class="log-time">' + Utils.fmtHours(l.t) + '</span>' + G.esc(l.text) + '</div>').join('');
        G.setHTML(document.getElementById('panel-log'),
            '<div class="panel-head"><span class="panel-title">日志</span></div>' +
            '<div class="log-list">' + (items || '<div class="empty">还没有发生什么。</div>') + '</div>');
    }

    function renderStats() {
        const s = GameState;
        const base = BuildEngine.baseOf(s);
        const counts = BuildEngine.counts(s);
        const rows = [
            ['据点', base.icon + ' ' + base.name],
            ['战力', String(PlayerManager.combatPower(s))],
            ['防御', String(PlayerManager.defense(s))],
            ['同伴', PlayerManager.companionCount(s) + ' / ' + PlayerManager.residentCap(s)],
            ['设施', counts.built + ' 类'],
            ['搜刮', s.stats.scavenges + ' 次'],
            ['成就', AchievementEngine.count(s) + ' / ' + ACHIEVEMENTS_CONFIG.length],
            ['重生', s.rebirth.count + ' 次'],
            ['现金', Utils.fmtInt(ResourcesManager.amount('现金'))],
            ['仇家', '<span data-tip="heat" class="' + (s.heat >= HEAT_RULES.raidAt ? 'neg' : (s.heat > 0 ? '' : 'neu')) +
                '">' + s.heat + ' / ' + HEAT_RULES.max + '</span>', true],
        ];
        G.setHTML(document.getElementById('panel-stats'),
            '<div class="panel-head"><span class="panel-title">状态</span></div>' +
            '<div class="stat-list">' + rows.map(r =>
                '<div class="stat-row"><span>' + r[0] + '</span><span>' +
                (r[2] ? r[1] : G.esc(r[1])) + '</span></div>').join('') + '</div>');
    }

    window.Panels = { renderHeader, renderResources, renderAlert, renderEvent, renderLog, renderStats };
})();

</script>
<script>
/* ===== js/ui/modals.js ===== */
/* 浮窗：剧情 / 事件 / 羁绊 / 觉醒 / 重生报告，以及欢迎、离线、存档等弹窗 */
(function () {
    const G = window.UI;
    let shownKey = '';
    let resultPage = null;
    let seq = 0;
    let candidate = null;

    function pendingKey(s) {
        const p = s && s.pending;
        if (!p) return '';
        const seq = (p.type === 'encounter' && s.encounter) ? s.encounter.seq + ':' + s.encounter.tries : '';
        return [p.type, p.id || '', p.stage || '', p.reason || '', seq].join('|');
    }

    /* 隐藏物资点：先说清在哪儿、怎么发现的，再让你决定怎么搬 */
    function renderCache(locId) {
        const loc = LOCATIONS_CONFIG.find(l => l.id === locId);
        const c = CacheEngine.of(GameState, locId);
        if (!loc || !c) { G.closeModal(); return; }
        const note = CacheEngine.spaceNote(GameState, c);
        const rows = Object.keys(c.loot).map(r => '<div class="kv-line"><span>' +
            ((RESOURCES_CONFIG[r] || {}).icon || '') + ' ' + r + '</span><span>' + c.loot[r] +
            '（' + Math.round(c.loot[r] * ResourcesManager.spaceOf(r)) + ' 格）</span></div>').join('');
        const allBtn = note.enough
            ? '<button class="choice" data-act="cachetake|all"><b>全搬进空间</b>' +
              '<div class="choice-lack">一次搬完，占 ' + note.need + ' 格</div></button>'
            : '<button class="choice disabled" disabled><b>空间装不下</b>' +
              '<div class="choice-lack">要 ' + note.need + ' 格，你只剩 ' + note.left +
              ' 格 —— 先整理空间，或者升级异能再来</div></button>';
        G.openModal('<h2>' + c.kind.icon + ' 隐藏物资点 · ' + G.esc(c.kind.name) + '</h2>' +
            '<p class="modal-intro">在哪：<b>' + G.esc(loc.name) + '</b>　' +
            '（' + Utils.fmtHours(GameState.hours) + ' 发现的）</p>' +
            '<div class="story-pages"><p>' + G.esc(c.kind.find) + '</p></div>' +
            '<div class="kv-box"><div class="kv-title">里面有什么</div>' + rows +
                '<div class="kv-line"><span>异能结晶</span><span>' + c.crystal + ' 💎</span></div>' +
                '<div class="kv-line"><span>空间</span><span>需要 ' + note.need + ' 格，还剩 ' + note.left + ' 格</span></div>' +
            '</div>' +
            '<div class="choices">' + allBtn +
                '<button class="choice" data-act="cachetake|best"><b>只挑最值钱的</b>' +
                '<div class="choice-lack">拿一半的大件，不拿结晶；搬完这里的提示就消失</div></button>' +
                '<button class="choice" data-act="cachetake|later"><b>先记下来，回头再搬</b>' +
                '<div class="choice-lack">地图上这个地点会留一个 📦 标记，物资点不会自己消失</div></button>' +
            '</div>', { wide: true, closable: false });
    }

    /* 遭遇战：对方几个人、多少战力、打不打得过、跑得掉吗，都摆在明面上 */
    function renderEncounter() {
        const info = EncounterEngine.info(GameState);
        if (!info) { G.closeModal(); return; }
        const k = info.enc.kind;
        const fmt = map => Object.keys(map).map(r => r + ' ' + map[r]).join('、');
        const log = info.enc.log.length
            ? '<div class="kv-box">' + info.enc.log.map(t => '<div class="kv-line">' + G.esc(t) + '</div>').join('') + '</div>'
            : '';
        const fightBtn = info.canFight
            ? '<button class="choice" data-act="encfight"><b>迎战（胜率 ' + Math.round(info.odds * 100) + '%）</b>' +
              '<div class="choice-lack">对方 ' + info.enc.count + ' 只 × 单只 ' + info.enc.unit + ' 战力</div></button>'
            : '<button class="choice disabled" disabled><b>打不过，不能迎战</b>' +
              '<div class="choice-lack">战力差太多（你 ' + info.mine + ' vs 对方 ' + info.enc.power + '），硬拼等于送死</div></button>';
        G.openModal('<h2>' + k.icon + ' 遭遇 · ' + info.enc.count + ' 只' + G.esc(k.name) + '</h2>' +
            '<p class="modal-intro">在' + G.esc(info.enc.locationName) + '。' + G.esc(k.desc) + '</p>' +
            '<div class="vs-box">' +
                '<div class="vs-side"><span class="vs-label">对方</span>' +
                    '<b>' + info.enc.count + ' × ' + G.esc(k.name) + '</b>' +
                    '<span class="vs-power">战力 ' + info.enc.power + '</span>' +
                    '<span class="vs-note">单只 ' + info.enc.unit + ' × ' + info.enc.count + ' 只</span></div>' +
                '<div class="vs-mid">' + (info.verdict === '稳赢' ? '✅' : (info.canFight ? '⚠️' : '💀')) + '</div>' +
                '<div class="vs-side mine"><span class="vs-label">你</span>' +
                    '<b>战力 ' + info.mine + '</b>' +
                    '<span class="vs-power vs-' + (info.canFight ? 'ok' : 'bad') + '">' +
                        (info.mine >= info.enc.power ? '领先 ' : '落后 ') + Math.abs(info.mine - info.enc.power) + '</span>' +
                    '<span class="vs-note">判定：' + info.verdict + '</span></div>' +
            '</div>' +
            log +
            '<div class="choices">' + fightBtn +
                '<button class="choice" data-act="encflee"><b>逃跑（成功率 ' + Math.round(info.flee * 100) + '%）</b>' +
                '<div class="choice-lack">跑不掉会丢一部分物资，然后还得再选一次（第 ' +
                    (info.tries + 1) + ' / ' + info.maxTries + ' 次）</div></button>' +
                (info.tries > 0
                    ? '<button class="choice" data-act="encdump"><b>丢下物资再跑（成功率 ' +
                      Math.round(info.fleeDump * 100) + '%）</b>' +
                      '<div class="choice-lack">放弃：' + G.esc(fmt(info.dumpCost)) + '</div></button>'
                    : '<button class="choice disabled" disabled><b>丢下物资再跑</b>' +
                      '<div class="choice-lack">先自己跑一次，跑不掉才会有这个选择</div></button>') +
            '</div>', { wide: true, closable: false });
    }

    function choiceBtn(ch, act, i, extra) {
        const usable = EventEngine.choiceUsable(GameState, ch);
        const cls = 'choice' + (usable.ok ? '' : ' disabled') + (extra || '');
        const lack = usable.ok ? '' : '<div class="choice-lack">' + usable.lack + '</div>';
        return '<button class="' + cls + '" data-tip="choice|' + act + '|' + i + '"' +
            (usable.ok ? ' data-act="' + act + '|' + i + '"' : ' disabled') + '>' +
            '<b>' + G.esc(ch.text) + '</b>' + lack + '</button>';
    }

    function pagesHtml(pages) {
        return '<div class="story-pages">' + pages.map(t => '<p>' + G.esc(t) + '</p>').join('') + '</div>';
    }

    function renderStory(cfg) {
        if (!cfg) { G.closeModal(); return; }
        G.openModal('<h2>' + cfg.icon + ' ' + G.esc(cfg.title) + '</h2>' +
            (Assets.doom(GameState.doom) ? '<img class="story-art" src="' + Assets.doom(GameState.doom) + '" alt="" loading="lazy">' : '') +
            pagesHtml(cfg.pages || []) +
            '<div class="choices">' + cfg.choices.map((ch, i) => choiceBtn(ch, 'storychoice', i)).join('') + '</div>',
            { wide: true, closable: false });
    }

    function renderBond(p) {
        const cfg = BondEngine.cfg(p.id);
        if (!cfg) { G.closeModal(); return; }
        const block = p.stage === 'meet' ? cfg.meet : cfg.crossroad;
        const st = BondEngine.get(GameState, p.id);
        const head = p.stage === 'meet' ? ('遇见 · ' + cfg.name) : block.title;
        G.openModal('<h2>' + cfg.icon + ' ' + G.esc(head) + '</h2>' +
            '<div class="bond-modal">' +
                '<div class="bond-art">' + Assets.portraitHtml(cfg, 'portrait-pic', 'large') +
                    '<div class="bond-art-name">' + G.esc(cfg.name) + '</div>' +
                    '<div class="bond-art-sub">' + G.esc(cfg.role) + '</div>' +
                    '<div class="bond-art-sub">' + (cfg.ability ? cfg.ability.tier + ' 级 · ' + G.esc(cfg.ability.name) : '普通人') + '</div>' +
                '</div>' +
                '<div class="bond-text">' +
                    '<div class="story-pages"><p>' + G.esc(block.text) + '</p></div>' +
                    '<div class="bond-meta">好感 ' + Math.round(st.value) + ' / 100</div>' +
                    '<div class="choices">' + block.choices.map((ch, i) => choiceBtn(ch, 'bondchoice', i)).join('') + '</div>' +
                '</div>' +
            '</div>',
            { wide: true, closable: false });
    }

    function renderEvent(ev) {
        if (!ev) { G.closeModal(); return; }
        G.openModal('<h2>' + ev.icon + ' ' + G.esc(ev.name) + '</h2>' +
            '<div class="story-pages"><p>' + G.esc(ev.text) + '</p></div>' +
            '<div class="choices">' + ev.choices.map((ch, i) => choiceBtn(ch, 'eventchoice', i)).join('') + '</div>',
            { wide: true, closable: false });
    }

    function renderAwaken() {
        const s = GameState;
        const avail = AbilityEngine.canDraw(s);
        const pity = AbilityEngine.pityInfo(s);
        const table = AbilityEngine.tierChanceTable(pity.ready);
        let body = '';
        if (s.ability.id) {
            const ab = SECOND_ABILITIES[s.ability.id];
            body += '<div class="kv-box"><div class="kv-title">当前的第二异能</div>' +
                '<div class="kv-main">' + ab.icon + ' <b>' + G.esc(ab.name) + '</b>（' +
                ABILITY_TIERS[ab.tier].name + '）</div>' +
                '<div class="kv-line">' + G.esc(ab.desc) + '</div>' +
                '<div class="kv-line">效果：' + G.effectTextInline(ab.effect, '；') + '</div></div>';
        }
        if (candidate) {
            const ab = candidate.ability;
            const tier = ABILITY_TIERS[ab.tier];
            body += '<div class="kv-box highlight"><div class="kv-title">这次的觉醒结果</div>' +
                '<div class="kv-main" style="color:' + tier.color + '">' + ab.icon + ' <b>' + G.esc(ab.name) + '</b>（' + tier.name + '）</div>' +
                '<div class="kv-line">' + G.esc(ab.desc) + '</div>' +
                '<div class="kv-line">效果：' + G.effectTextInline(ab.effect, '；') + '　战力 +' + ab.power + '</div>' +
                '</div><div class="choices">' +
                '<button class="choice" data-act="awakenkeep"><b>保留这个</b><div class="choice-lack">' +
                (s.ability.id ? '替换掉现在的' : '成为你的第二异能') + '</div></button>' +
                '<button class="choice" data-act="awakenagain"><b>再抽一次</b><div class="choice-lack">消耗 ' +
                AbilityEngine.drawCost(s) + ' 💎</div></button>' +
                '</div>';
        } else {
            body += '<div class="kv-line">消耗 ' + avail.cost + ' 💎　距上次 A 级以上：' + pity.count + ' / ' + pity.need +
                (pity.ready ? '（下一次必出 A 级以上）' : '') + '</div>' +
                '<div class="chance-row">' + table.map(t =>
                    '<span style="color:' + ABILITY_TIERS[t.tier].color + '">' + t.tier + ' ' +
                    (t.pct * 100).toFixed(1) + '%</span>').join('') + '</div>' +
                '<div class="choices">' + (avail.ok
                    ? '<button class="choice" data-act="awakenroll"><b>开始觉醒</b><div class="choice-lack">消耗 ' +
                      avail.cost + ' 💎</div></button>'
                    : '<button class="choice disabled" disabled><b>还不能觉醒</b><div class="choice-lack">' +
                      G.esc(avail.reason) + '</div></button>') + '</div>';
        }
        G.openModal('<h2>✨ 异能觉醒</h2>' +
            '<p class="modal-intro">觉醒只能抽一次，之后每次「再抽」都会消耗结晶替换掉现有的第二异能。' +
            '抽到 A 级以上会重置保底计数。</p>' + body, { wide: true, closable: true });
    }

    function renderRebirthReport() {
        const s = GameState;
        const r = s.rebirth.lastReport || {};
        const doom = DOOMS_CONFIG[r.newDoom] || {};
        const old = DOOMS_CONFIG[r.oldDoom] || {};
        const title = r.reason === 'defeat' ? '💀 据点失守 · 于是重来' : '🔁 重生';
        let html = '<h2>' + title + '</h2>';
        if (r.reason === 'defeat' && r.defeat) {
            html += '<p class="modal-intro">「' + G.esc(r.defeat.name) + '」的强度是 <b>' + r.defeat.strength +
                '</b>，而你的防御只有 <b>' + r.defeat.defense + '</b>。据点被攻占的那一刻，这一世就结束了。</p>';
        } else {
            html += '<p class="modal-intro">你闭上眼，再睁开时还是那个早上七点二十。</p>';
        }
        html += '<div class="kv-box"><div class="kv-title">重生点结算</div>' +
            (r.rows || []).map(row => '<div class="kv-line"><span>' + G.esc(row.label) + '</span><span>' +
                Utils.fmtNum(row.value, 1) + '</span></div>').join('') +
            (r.mult && Math.abs(r.mult - 1) > 1e-6 ? '<div class="kv-line"><span>加成</span><span>×' +
                r.mult.toFixed(2) + '</span></div>' : '') +
            '<div class="kv-main">共 <b>' + (r.gain || 0) + '</b> 点（累计 ' + s.rebirth.points + ' 点可用）</div></div>';
        html += '<div class="kv-box"><div class="kv-title">跟着你走的</div>' +
            '<div class="kv-line">空间异能 Lv' + s.space.level + '（技能与 ' + Utils.fmtInt(s.space.crystals) + ' 💎 结晶）</div>' +
            '<div class="kv-line">重生点、成就、统计数据' +
            (r.keepAbility ? '、第二异能（异能记忆）' : '') + '</div>' +
            '<div class="kv-title">留在上一世的</div>' +
            '<div class="kv-line">物资、据点与设施、所有羁绊角色</div>' +
            (r.keepAbility ? '' : '<div class="kv-line">第二异能（可以在重生商店买「异能记忆」保留它）</div>') +
            '</div>';
        html += '<div class="kv-box"><div class="kv-title">这一次的末日</div>' +
            '<div class="kv-main">' + old.icon + ' ' + G.esc(old.name) + ' → <b style="color:' + doom.color + '">' +
            doom.icon + ' ' + G.esc(doom.name) + '</b></div>' +
            (doom.rules || []).map(t => '<div class="kv-line">· ' + G.esc(t) + '</div>').join('') + '</div>';
        html += '<div class="modal-actions"><button class="btn primary" data-act="closemodal">开始这一世</button></div>';
        G.openModal(html, { wide: true });
    }

    function render() {
        const s = GameState;
        const pending = pendingKey(s);
        /* 结果浮窗有自己的生命周期：选项结算完之后 pending 就空了，
           但玩家还得看到「你选了什么、发生了什么」，所以不能跟着 pending 一起关掉。 */
        if (resultPage && !pending) {
            const rkey = 'result#' + resultPage.seq;
            if (rkey !== shownKey) { shownKey = rkey; renderResult(); }
            return;
        }
        /* 有新的剧情 / 事件要弹时，结果页让位（结果已经写进日志了） */
        if (resultPage && pending) resultPage = null;
        const full = pending + (candidate ? '|c' + candidate.id : '');
        if (full === shownKey) return;
        if (!pending) {
            if (shownKey) { G.closeModal(); shownKey = ''; candidate = null; }
            return;
        }
        shownKey = full;
        const p = s.pending;
        if (p.type === 'story') renderStory(STORY_CONFIG[p.id]);
        else if (p.type === 'bond') renderBond(p);
        else if (p.type === 'event') renderEvent(EVENTS_CONFIG.find(e => e.id === p.id));
        else if (p.type === 'encounter') renderEncounter();
        else if (p.type === 'cache') renderCache(p.id);
        else if (p.type === 'awaken') renderAwaken();
        else if (p.type === 'rebirthReport') renderRebirthReport();
    }

    function renderResult() {
        const r = resultPage;
        let html = '<h2>' + G.esc(r.title || '结果') + '</h2>';
        if (r.text) html += '<div class="story-pages"><p>' + G.esc(r.text) + '</p></div>';
        if (r.lines && r.lines.length) {
            html += '<div class="kv-box">' + r.lines.map(t => '<div class="kv-line">' + t + '</div>').join('') + '</div>';
        }
        html += '<div class="modal-actions"><button class="btn primary" data-act="closemodal">继续</button></div>';
        G.openModal(html, { wide: true });
    }

    function showResult(res, title) {
        resultPage = {
            seq: ++seq, title: title || '发生了这些',
            text: res.text || '', lines: res.lines || [], battle: res.battle || null,
        };
        render();
    }

    /* 玩家点「继续」之后才丢掉结果页 */
    function clearResult() { resultPage = null; }

    function refresh() { shownKey = ''; render(); }

    /* ---------------- 欢迎 / 离线 / 存档 ---------------- */
    function welcomeModal() {
        const wrap = G.openModal('<h2>💠 末日回声</h2>' +
            '<div class="story-pages">' +
            '<p>上一世，你在末日里活了三个月，最后被自己最信的两个人关在仓库里。</p>' +
            '<p>再睁开眼，是三天前的早上七点二十。城市还在正常运转，快递还在派送，' +
            '只多了手心里那一片看不见的空间。</p>' +
            '<p>七十二小时后，一切都会开始。这一次，你先动手。</p>' +
            '</div>' +
            '<h3>先做这几件事</h3><ul class="tip-list">' +
            '<li>在「地图」从自家公寓开始搜刮，所有东西都装进空间。</li>' +
            '<li>在「异能」里用异能结晶升级空间等级、解锁技能。</li>' +
            '<li>在「据点」把门窗加固、攒食物与水。</li>' +
            '<li>搜刮会遇到人：有的人这一世还是你的兄弟，有的不是。</li>' +
            '</ul>' +
            '<p class="hint">数字键 1-8 切换页面，空格暂停，进度自动保存在浏览器里。</p>' +
            '<div class="modal-actions"><label class="hint"><input type="checkbox" id="welcome-skip"> 以后不再显示</label>' +
            '<button class="btn primary" data-act="closemodal">开始</button></div>', { wide: true });
        const skip = wrap.querySelector('#welcome-skip');
        wrap.addEventListener('click', e => {
            if (e.target.getAttribute && e.target.getAttribute('data-act') === 'closemodal' && skip && skip.checked) {
                GameState.settings.hideWelcome = true;
                SaveEngine.save(GameState);
            }
        });
    }

    function offlineModal() {
        const r = GameState.offlineReport;
        if (!r) return;
        const lines = Object.keys(r.gains || {}).map(k => '<div class="kv-line"><span>' + k + '</span><span>+' +
            Utils.fmtInt(r.gains[k]) + '</span></div>').join('');
        G.openModal('<h2>🌙 你不在的时候</h2>' +
            '<p class="modal-intro">离线 ' + Utils.fmtHours(r.realSeconds * (window.HOURS_PER_SECOND || 0.05)) +
            '（结算 ' + Utils.fmtHours(r.hours) + '，效率 ' + Math.round(r.factor * 100) + '%）。</p>' +
            '<div class="kv-box">' + (lines || '<div class="kv-line">设施没有产出。</div>') + '</div>' +
            '<p class="hint">离线只算产出、不扣消耗（伙伴会自己找吃的），也不会结算恶性事件。</p>' +
            '<div class="modal-actions"><button class="btn primary" data-act="closemodal">知道了</button></div>');
    }

    function exportModal() {
        const text = SaveEngine.exportSave(GameState);
        G.openModal('<h2>导出存档</h2><p>复制下面这段文本保存起来，换设备时用「导入存档」恢复。</p>' +
            '<textarea id="save-text" readonly>' + G.esc(text) + '</textarea>' +
            '<div class="modal-actions"><button class="btn" data-act="copytext">复制</button>' +
            '<button class="btn primary" data-act="closemodal">关闭</button></div>', { wide: true });
    }

    function importModal() {
        G.openModal('<h2>导入存档</h2><p>把之前导出的文本粘贴进来，会覆盖当前进度。</p>' +
            '<textarea id="save-text" placeholder="粘贴存档文本"></textarea>' +
            '<div class="modal-actions"><button class="btn" data-act="closemodal">取消</button>' +
            '<button class="btn primary" data-act="doimport">导入</button></div>', { wide: true });
    }

    function cleanModal() {
        const s = GameState;
        const rows = RESOURCES_ORDER.filter(k => s.resources[k] && s.resources[k].amount > 0).map(k => {
            const r = s.resources[k];
            const cfg = RESOURCES_CONFIG[k];
            return '<div class="clean-row"><span>' + cfg.icon + ' ' + k + '　' + Utils.fmtInt(r.amount) +
                '（' + Utils.fmtInt(r.amount * cfg.space) + ' 格）</span>' +
                '<span><button class="btn ghost small" data-act="discard|' + k + '">丢一半</button></span></div>';
        }).join('');
        G.openModal('<h2>整理空间</h2>' +
            '<p class="modal-intro">空间满了就没法再装新东西。丢掉暂时用不上的物资，能腾出格子。' +
            '（丢掉会掉一点点士气）</p>' +
            '<div class="kv-box">' + (rows || '<div class="kv-line">空间是空的。</div>') + '</div>' +
            '<div class="modal-actions"><button class="btn primary" data-act="closemodal">关闭</button></div>', { wide: true });
    }

    window.Modals = {
        render, refresh, showResult, clearResult, welcomeModal, offlineModal, exportModal, importModal, cleanModal,
        setCandidate(c) { candidate = c; refresh(); },
        getCandidate() { return candidate; },
        clearCandidate() { candidate = null; },
    };
})();

</script>
<script>
/* ===== js/ui/mapview.js ===== */
/* 城区地图：用 SVG 画出街区、主干道、河道与 15 个可点节点。
   节点状态（可搜 / 掏空 / 淹没 / 浓雾）直接画在地图上，末日类型换一层滤镜。
   选中节点不会立刻出发 —— 先在地图上点，再从下方的抽屉里确认，避免误触。 */
(function () {
    const G = window.UI;
    const W = 1000, H = 660;
    let selectedId = null;

    /* 街区轮廓（逻辑坐标），只为「这是个城市」的观感服务 */
    const REGION_SHAPES = {
        oldtown: '118,58 352,66 356,404 112,414',
        downtown: '404,58 672,72 646,382 402,364',
        civic: '198,436 520,428 530,626 206,636',
        outskirts: '672,74 934,120 944,486 690,542',
    };
    const REGION_LABEL = {
        oldtown: { x: 237, y: 44 },
        downtown: { x: 528, y: 44 },
        civic: { x: 232, y: 522 },
        outskirts: { x: 800, y: 60 },
    };
    /* 主干道：把四个城区连起来的骨架 */
    const ROADS = [
        { d: 'M 118 300 L 460 296 L 700 300 L 930 300', cls: 'road-main' },
        { d: 'M 250 60 L 256 300 L 240 630', cls: 'road-main' },
        { d: 'M 700 80 L 704 300 L 736 500', cls: 'road-main' },
        { d: 'M 148 112 L 262 196 L 264 322 L 148 372', cls: 'road' },
        { d: 'M 452 116 L 582 198 L 470 318', cls: 'road' },
        { d: 'M 252 556 L 330 462 L 452 540', cls: 'road' },
        { d: 'M 704 122 L 836 214 L 862 392 L 736 478', cls: 'road' },
        { d: 'M 356 200 L 402 200 M 646 200 L 700 200', cls: 'road' },
    ];
    /* 河道：洪水末日里它会变成地图上最显眼的东西 */
    const RIVER = 'M 40 470 C 190 430, 300 560, 470 566 C 640 572, 720 460, 980 452';

    function stateOf(id) { return ScavengeEngine.status(GameState, id); }

    function nodeClass(loc, st) {
        const cls = ['mnode'];
        if (!st.unlocked) cls.push('locked');
        else if (st.disabled) cls.push('flooded');
        else if (st.occupied) cls.push('occupied');
        else if (st.left <= 0) cls.push('spent');
        else cls.push('ready');
        /* 这里藏着一批物资：地图上留个标记，搬走就没了 */
        if (CacheEngine.waiting(GameState, loc.id)) cls.push('has-cache');
        if (loc.danger >= 0.4) cls.push('dangerous');
        if (selectedId === loc.id) cls.push('selected');
        return cls.join(' ');
    }

    function subText(st) {
        if (!st.unlocked) return '浓雾';
        if (st.disabled) return '已淹没';
        if (st.occupied) return '被占领';
        if (st.left <= 0) return Utils.fmtCountdown(st.refreshIn);
        return st.left + ' / ' + st.max;
    }

    function nodeSvg(loc, st) {
        const p = LOCATION_MAP[loc.id];
        const icon = st.unlocked ? loc.icon : '？';
        return '<g class="' + nodeClass(loc, st) + '" transform="translate(' + p.x + ',' + p.y + ')" ' +
            'data-act="mapnode|' + loc.id + '" data-tip="loc|' + loc.id + '">' +
            '<circle class="mnode-halo" r="40"/>' +
            (st.unlocked ? '' : '<circle class="mnode-fog" r="54"/>') +
            '<circle class="mnode-dot" r="26"/>' +
            '<text class="mnode-icon" y="9">' + icon + '</text>' +
            '<text class="mnode-name" y="52">' + (st.unlocked ? G.esc(loc.name) : '未探明') + '</text>' +
            '<text class="mnode-sub" y="70">' + G.esc(subText(st)) + '</text>' +
            '</g>';
    }

    /* 末日类型在地图上留下的痕迹 */
    function doomLayer(state) {
        const doom = state.doom;
        if (doom === 'zombie') {
            /* 危险点旁边飘着尸群的影子 */
            return LOCATIONS_CONFIG.filter(l => l.danger >= 0.4).map(l => {
                const p = LOCATION_MAP[l.id];
                return '<g class="doom-mark horde"><circle cx="' + (p.x + 38) + '" cy="' + (p.y - 26) + '" r="7"/>' +
                    '<text x="' + (p.x + 38) + '" y="' + (p.y - 34) + '">🧟</text></g>';
            }).join('');
        }
        if (doom === 'nuclear') {
            const spots = [[300, 250], [520, 470], [800, 330], [200, 520]];
            return spots.map(s => '<circle class="doom-mark radiation" cx="' + s[0] + '" cy="' + s[1] + '" r="56"/>').join('');
        }
        if (doom === 'frost') {
            return '<rect class="doom-mark frost" x="0" y="0" width="' + W + '" height="' + H + '"/>';
        }
        return '';
    }

    function mapSvg(state) {
        const doom = state.doom;
        let regions = '';
        for (const r of REGIONS_CONFIG) {
            regions += '<polygon class="region region-' + r.id + '" points="' + REGION_SHAPES[r.id] + '"/>' +
                '<text class="region-label" text-anchor="middle" x="' + REGION_LABEL[r.id].x + '" y="' +
                REGION_LABEL[r.id].y + '">' + r.name + '</text>';
        }
        const roads = ROADS.map(r => '<path class="' + r.cls + '" d="' + r.d + '"/>').join('') +
            /* 主干道上的虚线：一眼看出哪条路能走车 */
            ROADS.filter(r => r.cls === 'road-main').map(r => '<path class="road-main-dash" d="' + r.d + '"/>').join('');
        const nodes = LOCATIONS_CONFIG.map(l => nodeSvg(l, stateOf(l.id))).join('');
        return '<svg class="citymap ' + (doom === 'flood' ? 'rising' : '') + '" viewBox="0 0 ' + W + ' ' + H + '" ' +
            'preserveAspectRatio="xMidYMid meet" role="img" aria-label="城区地图">' +
            '<defs>' +
                '<pattern id="hatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">' +
                    '<line x1="0" y1="0" x2="0" y2="8" stroke="rgba(255,255,255,.05)" stroke-width="2"/>' +
                '</pattern>' +
                '<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">' +
                    '<path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,.05)" stroke-width="1"/>' +
                '</pattern>' +
                '<radialGradient id="fog">' +
                    '<stop offset="0%" stop-color="rgba(198,208,206,.17)"/>' +
                    '<stop offset="55%" stop-color="rgba(178,190,188,.09)"/>' +
                    '<stop offset="100%" stop-color="rgba(178,190,188,0)"/>' +
                '</radialGradient>' +
            '</defs>' +
            '<rect class="map-base" x="0" y="0" width="' + W + '" height="' + H + '"/>' +
            '<rect class="map-grid" x="0" y="0" width="' + W + '" height="' + H + '" fill="url(#grid)"/>' +
            '<rect class="map-hatch" x="0" y="0" width="' + W + '" height="' + H + '" fill="url(#hatch)"/>' +
            regions + roads +
            '<path class="river" d="' + RIVER + '"/>' +
            doomLayer(state) +
            nodes +
            '</svg>';
    }

    /* 选中地点后的弹窗内容：不用滚到地图下面去点「出发」 */
    function popup(state) {
        if (!selectedId) return '';
        const loc = LOCATIONS_CONFIG.find(l => l.id === selectedId);
        const st = stateOf(selectedId);
        const region = REGIONS_CONFIG.find(r => r.id === LOCATION_MAP[selectedId].region) || {};
        const loot = loc.loot.map(x => '<span class="loot-chip">' +
            ((RESOURCES_CONFIG[x.res] || {}).icon || '') + ' ' + x.res + '</span>').join('');
        const dangerPct = Math.round(loc.danger * 100);
        const enc = Math.round(ScavengeEngine.encounterChance(state, loc) * 100);
        let action;
        const rob = MoneyEngine.robInfo(state, loc);
        if (st.ok) {
            action = '<button class="btn primary big" data-act="scavenge|' + loc.id + '">出发 · 搜刮这里</button>';
        } else if (st.occupied) {
            const mine = PlayerManager.combatPower(state);
            action = '<button class="btn danger big" data-act="reclaim|' + loc.id + '">' +
                '夺回这里（战力 ' + mine + ' vs 对方 ' + st.occupied.power + '）</button>';
        } else {
            action = '<button class="btn big" disabled>' +
                (st.disabled ? '已经被淹了' : (st.unlocked ? '暂时没东西了' : '还没探明')) + '</button>';
        }
        /* 抢钱：靠战力硬拿，钱来得快，但会记仇 */
        const robRow = '<div class="drawer-row' + (rob.ok ? '' : ' warn') + '">' +
            '<span class="drawer-label">抢钱</span><span>' +
                (rob.ok
                    ? '成功率 ' + Math.round(rob.odds * 100) + '%　大概能抢到 ' + Utils.fmtInt(rob.haul) + ' 现金（仇家 +' + ROB_RULES.heatOnSuccess + '）'
                    : G.esc(rob.reason)) +
            '</span></div>';
        const robBtn = rob.ok
            ? '<div class="drawer-actions"><button class="btn big danger" data-act="rob|' + loc.id + '">抢这里的钱</button></div>'
            : '';
        return '<div class="map-pop">' +
            '<div class="drawer-scene">' + Assets.sceneHtml(loc, 'scene-pic') +
                '<span class="scene-name">' + loc.icon + ' ' + G.esc(loc.name) + '</span>' +
                (region.name ? '<span class="scene-region">' + G.esc(region.name) + '</span>' : '') +
                (Assets.scene(loc.id) ? '' : '<span class="scene-missing">背景未归档</span>') +
            '</div>' +
            '<div class="drawer-head">' +
                '<div><div class="drawer-title">' + loc.icon + ' ' + G.esc(loc.name) + '</div>' +
                '<div class="drawer-sub">危险度 ' + dangerPct + '%　遭遇概率 ' + enc + '%　剩余 ' +
                    (st.unlocked ? st.left + '/' + st.max : '—') + '</div></div>' +
                '<button class="btn ghost small drawer-close" data-act="mapclose">✕</button>' +
            '</div>' +
            '<p class="drawer-desc">' + G.esc(loc.desc) + '</p>' +
            (st.occupied ? '<div class="occupy-box"><b>「' + G.esc(st.occupied.name) + '」占着这里</b>' +
                '<span>对方战力 ' + st.occupied.power + '　还有 ' + Utils.fmtCountdown(st.occupied.until - state.hours) +
                ' 他们会自己撤走，也可以现在就打回去。</span></div>' : '') +
            (CacheEngine.waiting(state, loc.id) ? '<div class="cache-box">📦 这里藏着一处「' +
                G.esc(CacheEngine.of(state, loc.id).kind.name) + '」，搬到手就算你的。</div>' : '') +
            '<div class="drawer-row"><span class="drawer-label">可能找到</span><span class="loot-chips">' + loot + '</span></div>' +
            '<div class="drawer-row"><span class="drawer-label">剩余次数</span><span>' +
                (st.unlocked ? (st.left + ' / ' + st.max + (st.left <= 0 ? '（' + Utils.fmtCountdown(st.refreshIn) + '后恢复）' : '')) : '—') +
            '</span></div>' +
            '<div class="drawer-row"><span class="drawer-label">出门耗时</span><span>' +
                (PhaseManager.id(state) === 'pre'
                    ? (loc.danger >= 0.4 ? ACTION_COSTS.scavengeFar : ACTION_COSTS.scavenge) + ' 小时（回合制，倒计时跟着走）'
                    : '时间会自己走，不影响倒计时') +
            '</span></div>' +
            (st.medCost ? '<div class="drawer-row warn"><span class="drawer-label">放射尘</span><span>每次需要药品 ×' + st.medCost + '</span></div>' : '') +
            robRow +
            (st.reason ? '<div class="drawer-row warn"><span class="drawer-label">状态</span><span>' + G.esc(st.reason) + '</span></div>' : '') +
            '<div class="drawer-actions">' + action + '</div>' +
            robBtn +
            (CacheEngine.waiting(state, loc.id)
                ? '<div class="drawer-actions"><button class="btn big" data-act="cacheopen|' + loc.id + '">去搬藏起来的东西</button></div>'
                : '') +
            '</div>';
    }

    /* 把弹窗内容同步到 #map-pop-root；没有选中或不在地图页就隐藏 */
    function syncPopup(state, activeTab) {
        const root = document.getElementById('map-pop-root');
        if (!root) return;
        if (!root.__bound) {
            root.__bound = true;
            /* 点弹窗外面的地方关掉它（和弹窗系统一致：只在点到背景时关） */
            root.addEventListener('click', e => {
                if (e.target === root) { close(); if (window.App) App.render(true); }
            });
        }
        const show = !!selectedId && (!activeTab || activeTab === 'map');
        G.setHTML(root, show ? popup(state) : '');
        if (show) root.classList.add('open');
        else root.classList.remove('open');
    }

    function legend(state) {
        const doom = DOOMS_CONFIG[state.doom] || {};
        return '<div class="map-legend">' +
            '<span class="lg"><i class="dot ready"></i>可搜刮</span>' +
            '<span class="lg"><i class="dot spent"></i>已掏空</span>' +
            '<span class="lg"><i class="dot locked"></i>浓雾未探明</span>' +
            '<span class="lg"><i class="dot dangerous"></i>高危区</span>' +
            (state.doom === 'flood' ? '<span class="lg"><i class="dot flooded"></i>已被淹没</span>' : '') +
            '<span class="lg doom">' + (doom.icon || '') + ' ' + (doom.name || '') + '：' +
                (doom.tagline || '') + '</span>' +
            '<span class="lg pan-hint">← 左右拖动看全城 →</span>' +
            '</div>';
    }

    function select(id) {
        selectedId = (selectedId === id) ? null : id;
        return selectedId;
    }
    function close() { selectedId = null; }
    function selected() { return selectedId; }
    /* 换一轮 / 换地图时把选中清掉 */
    function clearIfGone(state) {
        if (selectedId && !LOCATIONS_CONFIG.some(l => l.id === selectedId)) selectedId = null;
    }

    function render(state) {
        clearIfGone(state);
        return '<div class="map-wrap doom-' + state.doom + '">' +
            legend(state) + '<div class="map-scroll">' + mapSvg(state) + '</div>' +
            '<div class="map-tip-line">点地图上的地点看详情，弹窗里直接出发。</div>' +
            '</div>';
    }

    window.MapView = { render, select, close, selected, syncPopup, popup, WIDTH: W, HEIGHT: H };
})();

</script>

<script>
/* ===== js/ui/tab-base.js ===== */
/* 据点页：设施建设、产出、据点迁移 */
(function () {
    const G = window.UI;

    function basePanel(s) {
        const base = BuildEngine.baseOf(s);
        const counts = BuildEngine.counts(s);
        const next = BASES_CONFIG.find(b => b.tier === base.tier + 1);
        return '<div class="banner" data-tip="def">' +
            '<div class="banner-title">' + base.icon + ' ' + G.esc(base.name) + '　<span class="chip">防御 ' +
                PlayerManager.defense(s) + '</span>　<span class="chip">容纳 ' +
                PlayerManager.companionCount(s) + ' / ' + PlayerManager.residentCap(s) + '</span></div>' +
            '<div class="banner-line">' + G.esc(base.desc) + '</div>' +
            '<div class="banner-line">据点特性：' + G.esc(base.perk) + '　已建设施 ' + counts.built + ' 类</div>' +
            '<div class="panel-actions">' +
                '<button class="btn small" data-act="move">迁移据点</button>' +
                (next ? '' : '') +
            '</div>' +
            '</div>';
    }

    function ratePanel(s) {
        const rows = [];
        for (const k of RESOURCES_ORDER) {
            const r = ProductionEngine.rateOf(s, k);
            const prod = r.prod || 0, use = r.use || 0;
            if (Math.abs(prod) < 1e-9 && Math.abs(use) < 1e-9) continue;
            const net = prod - use;
            rows.push('<div class="stat-row"><span>' + (RESOURCES_CONFIG[k] || {}).icon + ' ' + k + '</span>' +
                '<span class="' + G.rateClass(net) + '">' + Utils.fmtRate(net, 1) + ' /时' +
                '<span class="dim">（产 ' + Utils.fmtNum(prod, 1) + '　耗 ' + Utils.fmtNum(use, 1) + '）</span></span></div>');
        }
        return '<div class="panel-box"><div class="panel-head"><span class="panel-title">每小时收支</span></div>' +
            (rows.length ? '<div class="stat-list">' + rows.join('') + '</div>'
                : '<div class="empty">还没有任何产出，先建几个设施。</div>') + '</div>';
    }

    function facCard(st) {
        const cfg = st.cfg;
        const cls = !st.tierAllowed ? 'locked' : (st.maxed ? 'done' : (st.can ? 'ok' : 'wait'));
        const sub = !st.tierAllowed ? '需要更大的据点（' + cfg.tier + ' 级设施）'
            : (st.maxed ? '已满级' : ('升到 Lv' + (st.level + 1) + '：' + G.costHtml(st.cost || {})));
        return '<div class="card fac-card ' + cls + '" data-tip="fac|' + cfg.id + '"' +
            (st.can ? ' data-act="build|' + cfg.id + '"' : '') + '>' +
            '<div class="card-head">' +
                '<span class="card-icon">' + cfg.icon + '</span>' +
                '<div class="card-titles">' +
                    '<div class="card-title">' + G.esc(cfg.name) + ' <span class="lv">Lv' + st.level + '</span>' +
                        '<span class="dim"> / ' + cfg.maxLevel + '</span></div>' +
                    '<div class="card-sub">' + sub + '</div>' +
                '</div>' +
            '</div>' +
            '<div class="card-foot">' +
                (st.tierAllowed ? (st.maxed ? '<span class="done-chip">已完成</span>'
                    : (st.can ? '<span class="build-go">升级</span>' : '<span class="need-chip">' + G.esc(st.reason) + '</span>'))
                    : '<span class="need-chip">' + G.esc(st.reason) + '</span>') +
            '</div>' +
            '</div>';
    }

    function render() {
        const s = GameState;
        const list = BuildEngine.listFor(s);
        const allowed = list.filter(x => x.tierAllowed);
        const blocked = list.filter(x => !x.tierAllowed);
        let html = basePanel(s) + ratePanel(s);
        html += '<h3 class="sec-title">设施</h3><div class="grid">' + allowed.map(facCard).join('') + '</div>';
        if (blocked.length) {
            html += '<h3 class="sec-title">需要更大的据点（' + blocked.length + ' 项）</h3>' +
                '<div class="grid">' + blocked.map(facCard).join('') + '</div>';
        }
        return html;
    }

    function moveModal() {
        const s = GameState;
        const rows = BASES_CONFIG.map(base => {
            const st = BuildEngine.moveStatus(s, base.id);
            const here = base.id === s.base.id;
            const cost = base.moveCost ? G.costHtml(base.moveCost) : '（起点）';
            return '<div class="card move-card ' + (here ? 'done' : (st.ok ? 'ok' : 'wait')) + '"' +
                (st.ok && !here ? ' data-act="domove|' + base.id + '"' : '') + '>' +
                '<div class="card-head"><span class="card-icon">' + base.icon + '</span>' +
                '<div class="card-titles"><div class="card-title">' + base.name +
                    (here ? ' <span class="chip">当前</span>' : '') + '</div>' +
                '<div class="card-sub">防御基础 ' + base.defense + '　容纳 ' + base.residentCap + '　' + base.perk + '</div></div></div>' +
                '<div class="card-foot">' + (here ? '<span class="done-chip">已经在这里</span>'
                    : (st.ok ? '<span class="build-go">迁移（' + cost + '）</span>'
                        : '<span class="need-chip">' + G.esc(st.reason) + '</span>')) + '</div>' +
                '</div>';
        }).join('');
        G.openModal('<h2>🚚 迁移据点</h2>' +
            '<p class="modal-intro">更大的据点能建更高级的设施、容纳更多人。' +
            '但防御工事（门窗加固、铁栅栏、围墙、哨塔、陷阱区、军械库）搬不走：' +
            '迁移后这些归零，并返还一半材料。其他设施等级保留。</p>' +
            '<div class="grid">' + rows + '</div>' +
            '<div class="modal-actions"><button class="btn primary" data-act="closemodal">关闭</button></div>', { wide: true });
    }

    window.TabBase = { render, moveModal };
})();

</script>

        const defFacs = BuildEngine.DEFENSE_FACILITIES.map(id => BuildEngine.status(s, id));
        html += '<h3 class="sec-title">防御工事</h3><div class="grid">' + defFacs.map(st => {
            const cfg = st.cfg;

            const sub = !st.tierAllowed ? '需要更大的据点（' + cfg.tier + ' 级设施）'
                : (st.maxed ? '已满级' : ('升到 Lv' + (st.level + 1) + '：' + G.costHtml(st.cost || {})));
            return '<div class="card fac-card ' + cls + '" data-tip="fac|' + cfg.id + '"' +
                (st.can ? ' data-act="build|' + cfg.id + '"' : '') + '>' +
                '<div class="card-head"><span class="card-icon">' + cfg.icon + '</span>' +
                '<div class="card-titles"><div class="card-title">' + G.esc(cfg.name) + ' <span class="lv">Lv' + st.level + '</span></div>' +
                '<div class="card-sub">' + sub + '</div></div></div>' +

        const hist = (s.raid.history || []).slice(0, 10);
        html += '<h3 class="sec-title">袭击记录（守住 ' + s.raid.wins + ' 次 / 失守 ' + s.raid.losses + ' 次）</h3>' +

/* 羁绊页：认识的人、好感、送礼、结局 */
(function () {
    const G = window.UI;

    function bondCard(s, cfg) {
        const st = BondEngine.get(s, cfg.id);
        const info = BondEngine.giftInfo(s, cfg.id);
        const loan = MoneyEngine.borrowInfo(s, cfg.id);
        const outcome = { ally: '同伴', partner: '伴侣', enemy: '敌人', dead: '已不在', left: '已离开' }[st.outcome] || '观望';
        const cls = st.outcome === 'enemy' ? 'bad' : (st.outcome === 'dead' ? 'gone' : (st.value >= 60 ? 'ok' : 'wait'));

            '<div class="card-head">' +
                Assets.portraitHtml(cfg, 'bond-pic') +

                '<div class="card-sub">' + G.esc(cfg.role) + (cfg.ability ? '　' + cfg.ability.tier + ' 级·' + cfg.ability.name : '　普通人') + '</div></div></div>' +
            '<div class="bond-bar">' + G.bar(Utils.clamp((st.value + 30) / 130, 0, 1)) +
                '<span class="bond-val">好感 ' + Math.round(st.value) + '</span></div>' +
            '<div class="card-foot">' +
                '<span class="' + (assist ? 'good-chip' : 'need-chip') + '">' +
                    (assist ? '协助中' : (cfg.assist ? '好感 ' + cfg.assist.at + ' 起协助' : '无协助')) + '</span>' +

                    : '<span class="need-chip">' + G.esc(info.reason || '') + '</span>') +

                    ? '<button class="btn small" data-act="borrow|' + cfg.id + '">借钱 ' + Utils.fmtInt(loan.cash) +
                      '（好感 -' + loan.favorCost + '）</button>'
                    : '<span class="need-chip">借钱：' + G.esc(loan.reason) + '</span>') +
            '</div>' +
            '</div>';

    function render() {

        const met = BONDS_CONFIG.filter(c => BondEngine.get(s, c.id).met);

        let html = '<div class="banner"><div class="banner-title">🤝 羁绊 ' + met.length + ' 人</div>' +
            '<div class="banner-line">好感 30 起开始协助你；到关键节点，你的选择会决定他们最终站在哪一边。' +
            '礼物每天最多送 3 次，同一天越送越少。</div></div>';
        html += '<div class="grid">' + (met.length ? met.map(c => bondCard(s, c)).join('')
            : '<div class="empty">你还没有遇到任何人。去地图上搜刮，人都在路上。</div>') + '</div>';
        if (notMet.length) {
            html += '<h3 class="sec-title">还没遇到的人（' + notMet.length + ' 个）</h3>' +
                '<div class="grid">' + notMet.map(c => {
                    const where = c.locate && c.locate.location
                        ? (LOCATIONS_CONFIG.find(l => l.id === c.locate.location) || {}).name
                        : null;
                    return '<div class="card bond-card locked" data-tip="bondhint|' + c.id + '">' +
                        '<div class="card-head"><span class="card-icon">❔</span>' +
                        '<div class="card-titles"><div class="card-title">未相识</div>' +
                        '<div class="card-sub">' + (where ? '可能出现在：' + where : '会在后面的路上遇到') + '</div></div></div>' +
                        '<div class="card-foot"><span class="need-chip">' +
                        (c.locate && c.locate.location ? '去' + where + '搜刮' : '看运气') + '</span></div></div>';
                }).join('') + '</div>';
        }
        return html;
    }

    window.TabBonds = { render };
})();

</script>

            (st.ready && !st.unlocked ? ' data-act="skill|' + id + '"' : '') + '>' +
            '<div class="card-head"><span class="card-icon">' + cfg.icon + '</span>' +
            '<div class="card-titles"><div class="card-title">' + G.esc(cfg.name) + '</div>' +
            '<div class="card-sub">' + Utils.fmtNum(cfg.cost, 0) + ' 💎　' +
                G.effectTextInline(cfg.effect, '、') + '</div></div></div>' +
            '<div class="card-foot">' + (st.unlocked ? '<span class="done-chip">已解锁</span>'
                : (st.ready ? '<span class="build-go">解锁</span>'
                    : '<span class="need-chip">' + G.esc(st.reason) + '</span>')) + '</div></div>';
    }

    function abilityPanel(s) {
        const ab = s.ability.id ? SECOND_ABILITIES[s.ability.id] : null;
        const avail = AbilityEngine.canDraw(s);
        const pity = AbilityEngine.pityInfo(s);
        let html = '<div class="panel-box"><div class="panel-head"><span class="panel-title">✨ 第二异能</span>' +
            (ab ? '<span class="panel-extra" data-tip="ab|' + ab.id + '">详情</span>' : '') + '</div>';
        if (ab) {
            const tier = ABILITY_TIERS[ab.tier];
            html += '<div class="ab-card" style="border-color:' + tier.color + '">' +
                '<div class="ab-name" style="color:' + tier.color + '">' + ab.icon + ' ' + G.esc(ab.name) +
                '　<span class="chip">' + tier.name + '</span></div>' +
                '<div class="ab-desc">' + G.esc(ab.desc) + '</div>' +
                '<div class="ab-eff">' + G.effectTextInline(ab.effect, '；') + '　战力 +' + ab.power + '</div>' +
                '</div>';
        } else {
            html += '<div class="empty">' + (PhaseManager.isAtLeast(s, 'outbreak')
                ? '末日爆发那一夜，你在空间里憋出了第二种力量 —— 还没有觉醒。'
                : '末日爆发之后，才会开始觉醒第二异能。') + '</div>';
        }
        html += '<div class="banner-line">距上次 A 级以上：' + pity.count + ' / ' + pity.need +
            (pity.ready ? '（下一次必出 A 级以上）' : '') + '　共抽过 ' + s.ability.draws + ' 次</div>' +
            '<div class="panel-actions">' +
            (PhaseManager.isAtLeast(s, 'outbreak')
                ? '<button class="btn primary" data-act="awaken"' + (avail.ok ? '' : ' disabled') + '>' +
                  (ab ? '重抽（' : '觉醒（') + avail.cost + ' 💎）</button>'
                : '<span class="need-chip">末日爆发后开启</span>') +
            '</div></div>';
        if (s.ability.history.length) {
            html += '<div class="panel-box"><div class="panel-head"><span class="panel-title">觉醒记录</span></div>' +
                '<div class="stat-list">' + s.ability.history.slice(0, 8).map(h => {
                    const a = SECOND_ABILITIES[h.id] || {};
                    const t = ABILITY_TIERS[h.tier];
                    return '<div class="stat-row"><span style="color:' + (t ? t.color : 'inherit') + '">' +
                        (a.icon || '') + ' ' + G.esc(a.name || h.id) + '（' + h.tier + '）</span>' +
                        '<span>' + Utils.fmtHours(h.hours) + (h.replaced ? '　替换了 ' + G.esc(h.replaced) : '') + '</span></div>';
                }).join('') + '</div></div>';
        }
        return html;
    }

    function render() {
        const s = GameState;
        let html = spacePanel(s) + abilityPanel(s);
        for (const br of SPACE_SKILL_BRANCHES) {
            const ids = SPACE_SKILL_ORDER.filter(id => SPACE_SKILLS[id].branch === br.id);
            const shown = ids.filter(id => {
                const st = AbilityEngine.skillStatus(s, id);
                if (st.unlocked || st.ready) return true;
                const cfg = SPACE_SKILLS[id];
                return (cfg.req || []).some(r => s.space.skills[r]) || (cfg.req || []).length === 0 || s.space.level >= Math.max(1, cfg.reqLevel - 2);
            });
            if (!shown.length) continue;
            html += '<h3 class="sec-title">' + br.icon + ' ' + br.name + '　<span class="dim">' + br.desc + '</span></h3>' +
                '<div class="grid">' + shown.map(id => skillNode(s, id)).join('') + '</div>';
        }
        return html;
    }

    window.TabAbility = { render };
})();

</script>
<script>

        } else {
            html += '<div class="banner"><div class="banner-title">🔁 重生　现在可换 ' + bd.points + ' 点</div>' +
                '<div class="banner-line">重来一次：这一世的物资、据点、设施、羁绊全部留在这一世；' +

            (Math.abs(bd.mult - 1) > 1e-6 ? '<div class="stat-row"><span>重生点加成</span><span>×' + bd.mult.toFixed(2) + '</span></div>' : '') +
            '<div class="stat-row"><span><b>本次可得</b></span><span><b>' + bd.points + '</b></span></div>' +
            '<div class="stat-row"><span>可用重生点</span><span>' + s.rebirth.points + '</span></div>' +

            REBIRTH_SHOP.map(item => {
                const st = RebirthEngine.shopStatus(s, item);
                const cls = st.maxed ? 'done' : (st.can ? 'ok' : 'wait');
                return '<div class="card shop-card ' + cls + '" data-tip="shop|' + item.id + '"' +
                    (st.can ? ' data-act="shopbuy|' + item.id + '"' : '') + '>' +
                    '<div class="card-head"><span class="card-icon">' + item.icon + '</span>' +
                    '<div class="card-titles"><div class="card-title">' + G.esc(item.name) +
                        ' <span class="lv">Lv' + st.level + '/' + st.max + '</span></div>' +
                    '<div class="card-sub">' + G.esc(item.desc) + '</div></div></div>' +
                    '<div class="card-foot">' + (st.maxed ? '<span class="done-chip">已满级</span>'
                        : (st.can ? '<span class="build-go">购买（' + st.cost + ' 点）</span>'
                            : '<span class="need-chip">需要 ' + st.cost + ' 点</span>')) + '</div></div>';
