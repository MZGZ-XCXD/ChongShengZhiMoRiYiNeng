<script>
/* ===== js/ui/tab-settings.js ===== */
/* 设置页：存档、运行、自动化、统计、更新日志、关于
   每一行都写清「这是什么 / 现在什么状态 / 没解锁的话去哪儿解锁」 */
(function () {
    const G = window.UI;

    function switchRow(label, note, on, opts) {
        opts = opts || {};
        const cls = opts.locked ? 'switch locked' : ('switch ' + (on ? 'on' : 'off'));
        const text = opts.locked ? '未解锁' : (on ? '已开启' : '已关闭');
        return '<div class="set-row">' +
            '<div class="set-info">' +
                '<div class="set-label">' + label + '</div>' +
                '<div class="set-note' + (opts.locked ? ' locked' : '') + '">' + note + '</div>' +
            '</div>' +
            '<div class="set-ctl">' +
                '<button class="' + cls + '"' +
                    (opts.locked ? ' disabled' : ' data-act="toggle|' + opts.id + '"') +
                    ' role="switch" aria-checked="' + (on ? 'true' : 'false') + '">' +
                    '<span class="knob"></span><span class="switch-text">' + text + '</span>' +
                '</button>' +
            '</div>' +
            '</div>';
    }

    function segRow(label, note, options, current, act) {
        return '<div class="set-row">' +
            '<div class="set-info"><div class="set-label">' + label + '</div>' +
            '<div class="set-note">' + note + '</div></div>' +
            '<div class="set-ctl"><div class="seg">' + options.map(o =>
                '<button class="seg-btn' + (o.value === current ? ' active' : '') + '" data-act="' +
                act + '|' + o.value + '">' + o.label + '</button>').join('') + '</div></div>' +
            '</div>';
    }

    function saveGroup(s) {
        return '<div class="panel-box set-group">' +
            '<div class="panel-head"><span class="panel-title">存档</span>' +
                '<span class="panel-extra">结构版本 v' + SAVE_VERSION + '</span></div>' +
            switchRow('自动保存', '每 20 秒存一次，离开页面时也会存。关掉它就得手动点「立即保存」。',
                s.settings.autosave, { id: 'autosave' }) +
            '<div class="set-row">' +
                '<div class="set-info"><div class="set-label">手动备份</div>' +
                '<div class="set-note">导出成一段文本存起来；换设备或清浏览器数据之前建议先导一份。</div></div>' +
            '</div>' +
            '<div class="panel-actions">' +
                '<button class="btn small" data-act="save">立即保存</button>' +
                '<button class="btn small" data-act="modal|export">导出存档</button>' +
                '<button class="btn small" data-act="modal|import">导入存档</button>' +
                '<button class="btn small danger" data-act="modal|hardreset">清除存档</button>' +
            '</div>' +
            '<div class="hint">旧存档会自动补齐新加的字段，进度不会丢。</div>' +
            '</div>';
    }

    function runGroup(s) {
        return '<div class="panel-box set-group">' +
            '<div class="panel-head"><span class="panel-title">运行</span></div>' +
            segRow('世界流速', '末日前是按行动推进的回合制（点搜刮一次才走 1 小时），流速只对末日爆发之后的' +
                '时间生效：资源产出、地点刷新、袭击倒计时。当前 ×' + (s.speed || 1) + '。',
                [{ value: 1, label: '×1' }, { value: 2, label: '×2' }, { value: 3, label: '×3' }, { value: 4, label: '×4' }],
                s.speed || 1, 'setspeed') +
            segRow('界面主题', '深色是「废土夜色」，浅色是「灰白晨雾」。',
                [{ value: 'dark', label: '🌙 深色' }, { value: 'light', label: '☀️ 浅色' }],
                s.settings.theme, 'settheme') +
            '</div>';
    }

    function autoGroup(s) {
        const e = EffectsManager.get(s);
        const has = !!e.specials.autoBuild;
        const lockNote = '在重生商店买「自动之手」（22 重生点）之后解锁。';
        return '<div class="panel-box set-group">' +
            '<div class="panel-head"><span class="panel-title">自动化</span>' +
                '<span class="panel-extra">' + (has ? '已解锁' : '未解锁') + '</span></div>' +
            (has ? '' : '<div class="hint">' + lockNote + '</div>') +
            switchRow('自动搜刮', has
                    ? '每隔几小时自己去搜一趟，产出按效率折算（当前 ' + Utils.fmtPct(e.autoScavenge || 0, 0) + '）。'
                    : lockNote,
                s.settings.autoScavenge, { id: 'autoScavenge', locked: !has }) +
            switchRow('自动建设', has ? '按「先修工事、再补产出」的顺序自动升级设施。' : lockNote,
                s.settings.autoBuild, { id: 'autoBuild', locked: !has }) +
            switchRow('自动送礼', has ? '自动给好感最低的同伴送礼物，省得一个个点。' : lockNote,
                s.settings.autoGift, { id: 'autoGift', locked: !has }) +
            '</div>';
    }

    function statsGroup(s) {
        const rows = [
            ['末日类型', (DOOMS_CONFIG[s.doom] || {}).name || '—'],
            ['生存时间', Utils.fmtHours(s.hours)],
            ['重生次数', s.rebirth.count + ' 次'],
            ['累计搜刮', s.stats.scavenges + ' 次'],
            ['累计战斗', s.stats.battles + ' 次（胜 ' + s.stats.battlesWon + '）'],
            ['累计结晶', Utils.fmtInt(s.space.totalCrystals) + ' 💎'],
        ];
        return '<div class="panel-box set-group">' +
            '<div class="panel-head"><span class="panel-title">这一世</span></div>' +
            '<div class="stat-list">' + rows.map(r =>
                '<div class="stat-row"><span>' + r[0] + '</span><span>' + G.esc(r[1]) + '</span></div>').join('') +
            '</div></div>';
    }

    function changelogBox() {
        const data = window.CHANGELOG_DATA || { overview: [], versions: [] };
        let html = '<div class="panel-box set-group"><div class="panel-head">' +
            '<span class="panel-title">更新日志</span>' +
            '<span class="panel-extra">v' + (data.currentVersion || '0.0.0') + '</span></div>';
        if (data.overview && data.overview.length) {
            html += '<div class="cl-list">' + data.overview.map(r =>
                '<div class="cl-row"><span class="cl-ver">' + r.version + '</span>' +
                '<span class="cl-date">' + r.date + '</span>' +
                '<span class="cl-sum">' + r.summary + '</span></div>').join('') + '</div>';
        } else {
            html += '<div class="empty">还没有更新日志。</div>';
        }
        html += '</div>';
        return html;
    }

    function aboutGroup() {
        return '<div class="panel-box set-group">' +
            '<div class="panel-head"><span class="panel-title">关于</span></div>' +
            '<div class="set-row"><div class="set-info">' +
                '<div class="set-label">末日回声 · Echoes of Doom</div>' +
                '<div class="set-note">纯前端单机放置游戏，存档在浏览器本地（localStorage），' +
                '不联网、不安装，双击 HTML 就能玩。</div></div>' +
                '<div class="set-ctl"><button class="btn small" data-act="help">开头引导</button></div>' +
            '</div>' +
            '</div>';
    }

    function render() {
        const s = GameState;
        return saveGroup(s) + runGroup(s) + autoGroup(s) + statsGroup(s) + changelogBox() + aboutGroup();
    }

    window.TabSettings = { render };
})();

</script>
<script>
/* ===== js/ui/app.js ===== */
/* 界面装配：标签页、渲染循环、指针冻结、键盘与主题 */
(function () {
    const G = window.UI;

    const TABS = [
        { id: 'map', name: '地图', icon: '🗺️', render: () => TabMap.render() },
        { id: 'base', name: '据点', icon: '🏢', render: () => TabBase.render() },
        { id: 'defense', name: '防线', icon: '🛡️', render: () => TabDefense.render() },
        { id: 'bonds', name: '羁绊', icon: '🤝', render: () => TabBonds.render() },
        { id: 'ability', name: '异能', icon: '💠', render: () => TabAbility.render() },
        { id: 'rebirth', name: '重生', icon: '🔁', render: () => TabRebirth.render() },
        { id: 'achievements', name: '成就', icon: '🏆', render: () => TabAchievements.render() },
        { id: 'settings', name: '设置', icon: '⚙', render: () => TabSettings.render() },
    ];

    let activeTab = 'map';
    let tabBody = null;
    let pointerDown = false;
    let renderQueued = false;

    function badges() {
        const s = GameState;
        const out = {};
        let ready = 0;
        for (const st of ScavengeEngine.listStatus(s)) if (st.ok) ready++;
        out.map = ready;
        let build = 0;
        for (const st of BuildEngine.listFor(s)) if (st.can) build++;
        out.base = build;
        if (DefenseEngine.info(s).inWarning) out.defense = 1;
        let bond = 0;
        for (const c of BONDS_CONFIG) if (BondEngine.crossroadReady(s, c.id)) bond++;
        out.bonds = bond;
        let skill = 0;
        for (const id of SPACE_SKILL_ORDER) if (AbilityEngine.skillStatus(s, id).ready) skill++;
        if (AbilityEngine.canDraw(s).ok) skill++;
        out.ability = skill;
        out.rebirth = RebirthEngine.available(s) ? 1 : 0;
        return out;
    }

    function renderTabs() {
        const b = badges();
        let html = '';
        for (const t of TABS) {
            const n = b[t.id] || 0;
            html += '<div class="tab' + (activeTab === t.id ? ' active' : '') + '" data-act="tab|' + t.id + '">' +
                '<span>' + t.icon + '</span><span>' + t.name + '</span>' +
                (n ? '<span class="badge' + (t.id === 'rebirth' ? ' gold' : '') + '">' + n + '</span>' : '') + '</div>';
        }
        G.setHTML(document.getElementById('tabs'), html);
    }

    function render(force) {
        /* 按下鼠标期间冻结重绘：否则节点会在 mousedown 与 mouseup 之间被换掉，点击会丢 */
        if (pointerDown && !force) { renderQueued = true; return; }
        renderQueued = false;

        Panels.renderHeader();
        Panels.renderResources();
        Panels.renderAlert();
        Panels.renderEvent();
        Panels.renderLog();
        Panels.renderStats();
        renderTabs();

        const content = document.getElementById('tab-content');
        if (!tabBody || !content.contains(tabBody)) {
            content.innerHTML = '<div id="tab-body"></div>';
            tabBody = document.getElementById('tab-body');
        }
        const tab = TABS.find(t => t.id === activeTab) || TABS[0];
        activeTab = tab.id;
        G.setHTML(tabBody, tab.render());
        /* 地点弹窗单独挂在 body 上：不跟标签内容一起滚，不会被挤到屏幕外 */
        if (window.MapView && MapView.syncPopup) MapView.syncPopup(GameState, activeTab);
        Modals.render();
    }

    window.UI.render = render;

    function beginPointer() { pointerDown = true; }
    function endPointer() {
        if (!pointerDown) return;
        pointerDown = false;
        if (renderQueued) render(true);
    }
    document.addEventListener('pointerdown', e => { if (e.button === 0 || e.pointerType !== 'mouse') beginPointer(); }, true);
    window.addEventListener('pointerup', endPointer, true);
    window.addEventListener('pointercancel', endPointer, true);
    window.addEventListener('blur', endPointer);
    document.addEventListener('mouseleave', endPointer);

    function copyText(text, okMsg) {
        const ok = () => G.toast(okMsg || '已复制。', 'gold');
        const fallback = () => {
            try {
                const ta = document.createElement('textarea');
                ta.value = text;
                ta.style.position = 'fixed';
                ta.style.top = '-1000px';
                document.body.appendChild(ta);
                ta.select();
                document.execCommand('copy');
                document.body.removeChild(ta);
                ok();
            } catch (e) { G.toast('复制失败，请手动选中复制。', 'bad'); }
        };
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, fallback);
        else fallback();
    }

    document.addEventListener('click', e => {
        const node = e.target.closest ? e.target.closest('[data-act]') : null;
        if (!node) return;
        const act = node.getAttribute('data-act');
        if (!act) return;
        if (node.tagName === 'INPUT' && node.type === 'checkbox') return;
        const parts = act.split('|');
        e.preventDefault();
        Acts.handle(parts[0], parts[1], parts[2]);
    });

    document.addEventListener('change', e => {
        const node = e.target;
        if (!node.getAttribute) return;
        if (node.type === 'checkbox' && node.getAttribute('data-act')) {
            Acts.handle(node.getAttribute('data-act'), null, null);
        }
    });

    function applyTheme() {
        /* 主题 class 放在 <html> 上：token 定义在 :root，body 才能正确解析自己用到的每个 token */
        document.documentElement.className = GameState.settings.theme === 'dark' ? 'dark-theme' : 'light-theme';
    }

    document.addEventListener('keydown', e => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
        const idx = Number(e.key);
        if (idx >= 1 && idx <= TABS.length) { activeTab = TABS[idx - 1].id; render(true); }
        if (e.key === ' ') { GameState.paused = !GameState.paused; e.preventDefault(); render(true); }
        if (e.key === 's' && (e.ctrlKey || e.metaKey)) { SaveEngine.save(GameState); G.toast('已保存。'); e.preventDefault(); }
        if (e.key === 'Escape' && !GameState.pending) G.closeModal();
        if (e.key === 'Escape' && window.MapView && MapView.selected()) {
            MapView.close();
            render(true);
        }
    });

    G.setTipProvider(key => {
        if (key.indexOf('choice|') === 0) {
            const parts = key.split('|');
            return Acts.choiceTip(Acts.choiceOf(parts[1], parts[2]));
        }
        return Tips.tipHtml(key);
    });
    G.bindTips(document.body);

    window.App = {
        render, applyTheme, TABS, copyText,
        get activeTab() { return activeTab; },
        set activeTab(v) { activeTab = v; },
    };
})();

</script>
<script>
/* ===== js/ui/acts.js ===== */
/* 所有按钮的行为分发（事件委托都走这里）+ 选项浮窗文案 */
(function () {
    const G = window.UI;

    function handle(act, a1, a2) {
        const s = GameState;
        let res = null;
    /* 只有「选项结算」才弹结果浮窗。建造 / 送礼 / 升级这些本来就用提示条反馈，
       如果也走结果浮窗，就会拿当时的 pending key 生成一个空白的「结果」页。 */
    let asResult = false;
        switch (act) {
            case 'tab': App.activeTab = a1; App.render(true); return;
            case 'pause': s.paused = !s.paused; App.render(true); return;
            case 'speed': {
                const next = (s.speed || 1) >= 4 ? 1 : (s.speed || 1) + 1;
                Actions.setSpeed(s, next);
                G.toast('世界流速 ×' + next);
                App.render(true);
                return;
            }
            case 'setspeed': Actions.setSpeed(s, Number(a1)); App.render(true); return;
            case 'theme':
                s.settings.theme = s.settings.theme === 'dark' ? 'light' : 'dark';
                App.applyTheme();
                App.render(true);
                return;
            case 'settheme':
                s.settings.theme = a1 === 'light' ? 'light' : 'dark';
                App.applyTheme();
                App.render(true);
                return;
            case 'toggle': s.settings[a1] = !s.settings[a1]; App.render(true); return;
            case 'scavenge': {
                const r = ScavengeEngine.scavenge(s, a1);
                G.toast((r.ok ? '🧺 ' : '⚠️ ') + r.msg, r.ok ? '' : 'bad');
                if (!r.ok) return;
                /* 搜刮时打输了：这里被占住了，弹窗要跟着变 */
                if (r.occupied) MapView.select(a1);
                break;
            }
            case 'reclaim': {
                const r = ScavengeEngine.reclaim(s, a1);
                if (!r.ok) { G.toast(r.msg, 'bad'); return; }
                G.toast(r.msg, r.win ? 'gold' : 'bad');
                break;
            }
            case 'borrow': {
                const r = MoneyEngine.borrow(s, a1);
                G.toast(r.msg, r.ok ? 'gold' : 'bad');
                break;
            }
            case 'rob': {
                const r = MoneyEngine.rob(s, a1);
                if (!r.ok) { G.toast(r.msg, 'bad'); return; }
                Modals.showResult(r, r.win ? '💰 抢到了' : '🩸 没抢成');
                App.render(true);
                return;
            }
            /* 遭遇战：迎战 / 逃跑 / 丢物资再跑 */
            case 'cacheopen': {
                s.pending = { type: 'cache', id: a1 };
                App.render(true);
                return;
            }
            case 'cachetake': {
                const p = s.pending;
                if (!p || p.type !== 'cache') return;
                const r = CacheEngine.take(s, p.id, a1);
                if (!r.ok) { G.toast(r.msg, 'bad'); return; }
                if (r.kept) {
                    G.toast('已在地图上记下这个物资点', 'gold');
                    MapView.select(p.id);
                    App.render(true);
                    return;
                }
                Modals.showResult(r, '📦 搬物资');
                App.render(true);
                return;
            }
            case 'encfight': {
                const r = EncounterEngine.fight(s);
                if (!r) return;
                Modals.showResult({
                    text: r.win ? '你把这批东西清干净了。' : '你没打过。他们把你赶了出去，还占住了这个地方。',
                    lines: [r.line],
                }, r.win ? '⚔️ 打赢了' : '💀 打输了');
                App.render(true);
                return;
            }
            case 'encflee': {
                const r = EncounterEngine.flee(s, {});
                if (!r.ok) { G.toast(r.msg, 'bad'); return; }
                if (r.fled) {
                    Modals.showResult({ text: r.text, lines: r.lines }, '🏃 跑掉了');
                    App.render(true);
                    return;
                }
                if (r.scattered) {
                    Modals.showResult({
                        text: r.text,
                        lines: r.lines.concat(['被冲散，又丢了一批：' + EventEngine.gainText(r.extra || {})]),
                    }, '💀 被追上了');
                    App.render(true);
                    return;
                }
                G.toast('没跑掉，物资丢了一部分', 'bad');
                App.render(true);
                return;
            }
            case 'encdump': {
                const r = EncounterEngine.flee(s, { dumping: true });
                if (!r.ok) { G.toast(r.msg, 'bad'); return; }
                if (r.fled) {
                    Modals.showResult({ text: r.text, lines: r.lines }, '🏃 丢下东西跑掉了');
                    App.render(true);
                    return;
                }
                if (r.scattered) {
                    Modals.showResult({
                        text: r.text,
                        lines: r.lines.concat(['被冲散，又丢了一批：' + EventEngine.gainText(r.extra || {})]),
                    }, '💀 被追上了');
                    App.render(true);
                    return;
                }
                G.toast('东西丢了，人还没跑掉', 'bad');
                App.render(true);
                return;
            }
            /* 地图：点节点先选中（抽屉里再确认出发），避免误触 */
            case 'mapnode': {
                const id = MapView.select(a1);
                if (id) {
                    const st = ScavengeEngine.status(s, a1);
                    if (st.occupied) G.toast('⚠️ ' + st.reason, 'bad');
                    else if (!st.ok) G.toast('⚠️ ' + st.reason, 'bad');
                }
                App.render(true);
                return;
            }
            case 'mapclose': MapView.close(); App.render(true); return;
            case 'build': res = BuildEngine.build(s, a1); break;
            case 'spaceup': res = AbilityEngine.levelUp(s); break;
            case 'skill': res = AbilityEngine.unlockSkill(s, a1); break;
            case 'awaken':
                Modals.clearCandidate();
                s.pending = { type: 'awaken' };
                App.render(true);
                return;
            case 'awakenroll':
            case 'awakenagain': {
                const pay = AbilityEngine.payForRoll(s);
                if (!pay.ok) { G.toast(pay.msg, 'bad'); return; }
                Modals.setCandidate(AbilityEngine.roll(s));
                break;
            }
            case 'awakenkeep': {
                const c = Modals.getCandidate();
                if (!c) return;
                const ab = SECOND_ABILITIES[c.id];
                const r = AbilityEngine.commit(s, c.id);
                Modals.clearCandidate();
                s.pending = null;
                Modals.showResult({ text: ab.desc, lines: ['第二异能：' + ab.name + '（' + c.tier + ' 级）'] }, '✨ 觉醒完成');
                if (!r.ok) G.toast(r.msg, 'bad');
                App.render(true);
                return;
            }
            case 'gift': {
                const r = BondEngine.gift(s, a1);
                G.toast(r.ok ? r.msg : (r.reason || '送不出去。'), r.ok ? 'gold' : 'bad');
                break;
            }
            case 'move': TabBase.moveModal(); return;
            case 'domove': {
                const r = BuildEngine.move(s, a1);
                G.toast(r.msg, r.ok ? 'gold' : 'bad');
                if (r.ok) { G.closeModal(); App.render(true); }
                return;
            }
            case 'shopbuy': res = RebirthEngine.buy(s, a1); break;
            case 'rebirth': {
                const bd = RebirthEngine.breakdown(s);
                G.confirmBox('重生', '把这一世折叠起来，带着 <b>' + bd.points + '</b> 点重生点开始新的一世。<br><br>' +
                    '会留在这一世：物资、据点与设施、所有羁绊角色。<br>' +
                    '会跟着你走：空间异能（等级 / 技能 / 结晶）、重生点、成就。<br><br>确定吗？',
                    () => {
                        const r = RebirthEngine.perform(s, 'manual');
                        if (!r.ok) G.toast(r.msg, 'bad');
                        App.activeTab = 'map';
                        App.render(true);
                    }, '确认重生');
                return;
            }
            case 'discard': {
                const half = Math.floor(ResourcesManager.amount(a1) / 2);
                const took = Actions.discard(s, a1, half);
                G.toast('丢掉了 ' + a1 + ' ' + Utils.fmtInt(took));
                Modals.cleanModal();
                return;
            }
            case 'save':
                G.toast(SaveEngine.save(s) ? '已保存。' : '保存失败（浏览器限制了本地存储）。', 'gold');
                return;
            case 'help': Modals.welcomeModal(); return;
            case 'modal':
                if (a1 === 'export') Modals.exportModal();
                else if (a1 === 'import') Modals.importModal();
                else if (a1 === 'clean') Modals.cleanModal();
                else if (a1 === 'hardreset') {
                    G.confirmBox('清除存档', '这会彻底删掉本地存档，包括这一世的物资、据点、羁绊与剧情进度，' +
                        '清完会回到最开始（重新播序章）。无法恢复，确定吗？',
                        () => SaveEngine.hardReset(), '清除存档');
                }
                return;
            case 'doimport': {
                const ta = document.querySelector('#modal-root textarea');
                const r = SaveEngine.importSave(s, ta ? ta.value : '');
                G.toast(r.msg, r.ok ? 'gold' : 'bad');
                if (r.ok) { App.applyTheme(); G.closeModal(); App.render(true); }
                return;
            }
            case 'copytext': {
                const ta = document.querySelector('#modal-root textarea');
                App.copyText(ta ? ta.value : '', '存档文本已复制。');
                return;
            }
            case 'closemodal':
                G.closeModal();
                Modals.clearCandidate();
                Modals.clearResult();
                App.render(true);
                return;
            case 'openpending': Modals.refresh(); return;
            case 'storychoice': res = StoryEngine.resolve(s, Number(a1)); asResult = true; break;
            case 'bondchoice': res = BondEngine.resolve(s, Number(a1)); asResult = true; break;
            case 'eventchoice': res = EventEngine.resolve(s, Number(a1)); asResult = true; break;
            default: return;
        }
        if (res && !res.ok) { G.toast(res.msg, 'bad'); return; }
        if (res && asResult) Modals.showResult(res);
        else if (res && res.msg) G.toast(res.msg, res.ok ? 'gold' : 'bad');
        App.render(true);
    }

    function choiceOf(kind, idx) {
        const p = GameState.pending;
        if (!p) return null;
        if (kind === 'storychoice' && p.type === 'story') {
            const cfg = STORY_CONFIG[p.id];
            return cfg ? cfg.choices[Number(idx)] : null;
        }
        if (kind === 'bondchoice' && p.type === 'bond') {
            const cfg = BondEngine.cfg(p.id);
            if (!cfg) return null;
            const block = p.stage === 'meet' ? cfg.meet : cfg.crossroad;
            return block ? block.choices[Number(idx)] : null;
        }
        if (kind === 'eventchoice' && p.type === 'event') {
            const cfg = EVENTS_CONFIG.find(x => x.id === p.id);
            return cfg ? cfg.choices[Number(idx)] : null;
        }
        return null;
    }

    /* 选项浮窗：写清 做什么 / 扣什么 / 得什么 / 持续效果 */
    function choiceTip(ch) {
        if (!ch) return null;
        let html = '<div class="tip-title">' + G.esc(ch.text) + '</div>';
        if (ch.tip) html += '<p class="tip-desc">' + G.esc(ch.tip) + '</p>';
        if (ch.cost) html += '<div class="tip-li">消耗：' + G.costHtml(ch.cost, { ignoreSpace: true }) + '</div>';
        if (ch.crystal > 0) html += '<div class="tip-li">异能结晶 +' + ch.crystal + '</div>';
        if (ch.crystal < 0) html += '<div class="tip-li">异能结晶 ' + ch.crystal + '</div>';
        if (ch.gain) {
            const parts = Object.keys(ch.gain).map(k => k + ' +' +
                (Array.isArray(ch.gain[k]) ? (ch.gain[k][0] + '~' + ch.gain[k][1]) : ch.gain[k]));
            html += '<div class="tip-li">获得：' + parts.join('、') + '</div>';
        }
        if (ch.morale) html += '<div class="tip-li">士气 ' + (ch.morale > 0 ? '+' : '') + ch.morale + '</div>';
        if (ch.value) html += '<div class="tip-li">好感 ' + (ch.value > 0 ? '+' : '') + ch.value + '</div>';
        if (ch.temp) html += '<div class="tip-li">持续效果「' + G.esc(ch.temp.name) + '」：' +
            G.esc(G.effectTextInline(ch.temp.effect, '；')) + '，' + Utils.fmtHours(ch.temp.hours) + '</div>';
        if (ch.outcome) html += '<div class="tip-li">走向：' +
            ({ ally: '成为同伴', partner: '成为伴侣', enemy: '成为敌人', dead: '死亡', left: '离开' }[ch.outcome] || ch.outcome) + '</div>';
        if (ch.battle) html += '<div class="tip-li">一场战斗（按战力判定）</div>';
        if (ch.unlock) html += '<div class="tip-li">解锁新的搜刮地点</div>';
        if (ch.facility) html += '<div class="tip-li">免费升级设施</div>';
        return html;
    }

    window.Acts = { handle, choiceOf, choiceTip };
})();

</script>

<script>
/* ===== js/main.js ===== */
/* 入口：初始化或读档 → 主题 → 渲染 → 启动主循环 */
(function () {
    /* 1 现实秒 = 0.05 游戏小时（3 游戏分钟）：末日前 72 小时约等于 24 分钟 */
    window.HOURS_PER_SECOND = 0.05;

    const s = GameState;
    initState();

    const hadSave = SaveEngine.hasSave();
    let loaded = false;
    if (hadSave) {
        try { loaded = SaveEngine.load(s); }
        catch (e) { console.error('读档失败', e); loaded = false; }
    }
    if (!loaded) {
        EffectsManager.refreshAllEffects(s);
        ProductionEngine.computeProduction(s);
    }
    s.speed = s.settings.speed || 1;

    App.applyTheme();
    App.render(true);
    GameLoop.start();

    /* 新档：从序章开始（用剧情浮窗当引导，比额外弹一个欢迎窗更连贯） */
    if (!loaded) {
        if (SaveEngine.consumeResetMark()) {
            EventEngine.addLog(s, '🧹 存档已清除，从头开始。');
            setTimeout(() => UI.toast('🧹 存档已清除，从头开始', 'gold'), 500);
        }
        if (!StoryEngine.seen(s, 'prologue')) StoryEngine.startNewGame(s);
        App.render(true);
    } else if (s.offlineReport && s.offlineReport.seconds >= 60) {
        setTimeout(() => Modals.offlineModal(), 350);
    }

    /* 离开页面时保存 */
    window.addEventListener('beforeunload', () => {
        if (s.settings.autosave) SaveEngine.save(s);
    });
    document.addEventListener('visibilitychange', () => {
        if (document.hidden && s.settings.autosave) SaveEngine.save(s);
    });
    window.addEventListener('error', e => {
        console.error('运行时错误', e.error || e.message);
    });
})();

</script>
