<script>
/* ===== js/engine/scavenge.js ===== */
/* 搜刮：地点的次数 / 刷新 / 危险遭遇 / 隐藏物资点 */
(function () {
    function locOf(id) { return LOCATIONS_CONFIG.find(l => l.id === id); }

    function isDisabled(state, loc) {
        const doom = DOOMS_CONFIG[state.doom];
        return !!(doom && doom.disabledLocations && doom.disabledLocations.indexOf(loc.id) >= 0);
    }

    function maxUses(state, loc) {
        return Math.max(1, loc.uses + Math.floor(EffectsManager.additive(state, 'scavengeUses')));
    }

    function refreshHours(state, loc) {
        return loc.refresh / (1 + Math.max(0, EffectsManager.additive(state, 'scavengeRefresh')));
    }

    function unlocked(state, loc) {
        const st = state.locations[loc.id];
        if (st && st.seen) return true;
        const gate = loc.unlock || {};
        if (gate.hours !== undefined && state.hours >= gate.hours) return true;
        return false;
    }

    function lockReason(state, loc) {
        const gate = loc.unlock || {};
        if (gate.hours !== undefined && state.hours < gate.hours) {
            return '还要 ' + Utils.fmtCountdown(gate.hours - state.hours) + ' 才会进入你的活动范围';
        }
        return '还没有发现这个地方';
    }

    function medCost(state) {
        const doom = DOOMS_CONFIG[state.doom];
        return (doom && doom.scavengeMedUse) ? doom.scavengeMedUse : 0;
    }

    /* ---------------- 被敌人占领 ----------------
       搜刮时打输了，对方会占住这里：东西被搬走、正常刷新也填不满，
       想提前拿回来只能在地图上点「夺回」打一场；不管它，到点对方自己会撤。 */
    function occupied(state, id) {
        const rec = state.locations[id];
        if (!rec || !rec.occupied) return null;
        return rec.occupied.until > state.hours ? rec.occupied : null;
    }

    function holdHours(loc) {
        return Math.max(4, Math.round(OCCUPY_HOURS.base + OCCUPY_HOURS.perDanger * loc.danger));
    }

    function occupy(state, loc, enemyName, power) {
        const rec = state.locations[loc.id];
        const hold = holdHours(loc);
        rec.occupied = {
            name: enemyName,
            power: Math.max(1, Math.round(power || 1)),
            at: state.hours,
            until: state.hours + hold,
            times: (rec.occupied && rec.occupied.times ? rec.occupied.times : 0) + 1,
        };
        rec.uses = maxUses(state, loc);
        rec.at = rec.occupied.until;
        EventEngine.addLog(state, '💀 「' + enemyName + '」占了' + loc.name + '，' +
            Utils.fmtHours(hold) + '内搜不了（在地图上点这里可以夺回）。');
        return rec.occupied;
    }

    /* 解除占领：次数归零、按正常节奏重新刷新 */
    function release(state, id, why) {
        const rec = state.locations[id];
        const loc = locOf(id);
        if (!rec || !rec.occupied || !loc) return false;
        const name = rec.occupied.name;
        rec.occupied = null;
        rec.uses = 0;
        rec.at = state.hours + refreshHours(state, loc);
        EventEngine.addLog(state, (why === 'reclaimed' ? '⚔️ 你夺回了' : '🌫️ 「' + name + '」撤了，')
            + loc.name + (why === 'reclaimed' ? '，这里又能搜了。' : '又能去了。'));
        return true;
    }

    /* 夺回：和占着这里的敌人正面打一场 */
    function reclaim(state, id) {
        const st = status(state, id);
        if (!st.unlocked) return { ok: false, msg: st.reason };
        const occ = st.occupied;
        if (!occ) return { ok: false, msg: '这里没有被占。' };
        const loc = st.loc;
        const res = EventEngine.battleSpec(state, {
            name: occ.name, power: occ.power,
            winLoot: { '食物': Utils.rndInt(8, 22), '弹药': Utils.rndInt(2, 8), '零件': Utils.rndInt(2, 6) },
            loseLoot: { '食物': Utils.rndInt(6, 16), '药品': Utils.rndInt(1, 4) },
            crystal: 3, winMorale: 8, loseMorale: -8,
        });
        if (res.win) {
            release(state, id, 'reclaimed');
        } else {
            /* 又输了：他们把东西搬得更干净，也更赖着不走 */
            const rec = state.locations[id];
            rec.uses = maxUses(state, loc);
            rec.occupied.until = state.hours + Math.max(4, Math.round(holdHours(loc) * 0.6));
            rec.at = rec.occupied.until;
            EventEngine.addLog(state, '💀 夺回失败，「' + occ.name + '」还在' + loc.name + '。');
        }
        Actions.spend(state, 'reclaim');
        AchievementEngine.check(state);
        return { ok: true, msg: res.line, battle: res, win: res.win, held: !res.win };
    }

    /* 地点当前状态（界面与判断都走这里，避免两处算法不一致） */
    function status(state, id) {
        const loc = locOf(id);
        const st = state.locations[id];
        const out = {
            id: id, loc: loc, unlocked: unlocked(state, loc), disabled: isDisabled(state, loc),
            max: maxUses(state, loc), uses: st.uses, left: Math.max(0, maxUses(state, loc) - st.uses),
            refreshIn: 0, medCost: medCost(state), ok: false, reason: '',
            occupied: occupied(state, id),
        };
        if (!out.unlocked) { out.reason = lockReason(state, loc); return out; }
        if (out.disabled) { out.reason = '已经被淹了，进不去'; return out; }
        if (out.occupied) {
            out.reason = '被「' + out.occupied.name + '」占着，还有 ' +
                Utils.fmtCountdown(out.occupied.until - state.hours);
            return out;
        }
        if (out.left <= 0) {
            out.refreshIn = Math.max(0, st.at - state.hours);
            out.reason = '要等 ' + Utils.fmtCountdown(out.refreshIn) + ' 才会重新有东西';
            return out;
        }
        const c = medCost(state);
        if (c && ResourcesManager.amount('药品') < c) {
            out.reason = '放射尘太大，需要药品 ' + c + ' 做清创';
            return out;
        }
        out.ok = true;
        return out;
    }

    function yieldMult(state, res, loc) {
        const e = EffectsManager.get(state);
        const doom = DOOMS_CONFIG[state.doom] || {};
        const bias = doom.lootBias && doom.lootBias[res] !== undefined ? doom.lootBias[res] : 1;
        const phaseBonus = PhaseManager.isAtLeast(state, 'apocalypse') ? 1.25 : 1;
        const risk = 1 - Math.min(0.35, loc.danger * 0.35);
        return Math.max(0, (1 + (e.scavengeYield || 0)) * bias * phaseBonus * risk);
    }

    function rollLoot(state, loc, mult) {
        const gains = {};
        mult = mult === undefined ? 1 : mult;
        const picks = 1 + (Math.random() < 0.5 ? 1 : 0) + (Math.random() < 0.18 ? 1 : 0);
        for (let i = 0; i < picks; i++) {
            const entry = Utils.weightedPick(loc.loot, x => x.w);
            if (!entry) break;
            const amt = Utils.rnd(entry.min, entry.max) * yieldMult(state, entry.res, loc) * mult;
            gains[entry.res] = (gains[entry.res] || 0) + Math.max(1, Math.round(amt));
        }
        return gains;
    }

    function rollRare(state, loc, mult) {
        const e = EffectsManager.get(state);
        const out = { crystal: 0 };
        const luck = 1 + (e.lootLuck || 0) * 1.5;
        /* 碎片：任何地点都可能摸到一点结晶，这是成长线的底噪 */
        if (Math.random() < 0.12 * luck) out.crystal += 1;
        if (!loc.rare) return out;
        for (const r of loc.rare) {
            const p = r.w * (window.CRYSTAL_DROP_RATE || 0.025) * luck * mult;
            if (Math.random() < p) out.crystal += Utils.rndInt(r.min, r.max);
        }
        return out;
    }

    function encounterChance(state, loc) {
        if (EffectsManager.hasSpecial(state, 'noAmbush')) return 0;
        const doom = DOOMS_CONFIG[state.doom] || {};
        const crisis = PhaseManager.crisis(state);
        const stage = PhaseManager.isAtLeast(state, 'outbreak') ? 1.15 : (0.45 + crisis * 0.9);
        return Utils.clamp(loc.danger * stage * (doom.scavengeDanger || 1), 0, 0.75);
    }

    function scavenge(state, id, opts) {
        opts = opts || {};
        const st = status(state, id);
        if (!st.unlocked) return { ok: false, msg: st.reason };
        if (st.disabled) return { ok: false, msg: st.reason };
        if (st.left <= 0) return { ok: false, msg: st.reason };
        if (st.medCost && ResourcesManager.amount('药品') < st.medCost) return { ok: false, msg: st.reason };
        if (st.medCost) ResourcesManager.spend({ '药品': st.medCost });

        const loc = st.loc;
        const rec = state.locations[id];
        rec.uses += 1;
        rec.total = (rec.total || 0) + 1;
        if (rec.uses >= st.max) rec.at = state.hours + refreshHours(state, loc);
        state.stats.scavenges += 1;
        state.stats.scavengesByLocation[id] = (state.stats.scavengesByLocation[id] || 0) + 1;

        const mult = opts.mult === undefined ? 1 : opts.mult;
        let gains = rollLoot(state, loc, mult);
        const rare = rollRare(state, loc, mult);

        const added = ResourcesManager.add(gains, state);
        let wasted = false;
        for (const k in gains) if ((added[k] || 0) < gains[k] - 0.5) wasted = true;

        let crystal = rare.crystal;
        if (crystal > 0) {
            crystal = PlayerManager.addCrystal(state, crystal, null);
        }

        const lines = [];
        for (const k in added) if (added[k] > 0) lines.push(k + ' +' + Utils.fmtInt(added[k]));
        if (wasted) lines.push('（空间装不下了，一部分只能留在原地）');
        if (crystal) lines.push('异能结晶 +' + crystal);

        /* 剧情 / 事件 / 羁绊的触发点 */
        const result = {
            ok: true, msg: lines.join('　') || '什么也没找到。',
            gains: added, crystal: crystal, wasted: wasted,
            encounter: null, battle: null, location: loc.name,
        };

        if (!opts.silent) {
            EventEngine.addLog(state, (opts.auto ? '🤖 ' : '🧺 ') + loc.name + '：' + result.msg);
        }

        if (!opts.auto) {
            /* 出门这一趟要花时间（末日前是按行动回合算的）：时间先走，然后才可能碰上事 */
            const timeCost = Actions.spend(state, loc.danger >= 0.4 ? 'scavengeFar' : 'scavenge');
            if (timeCost) result.timeCost = timeCost;
            BondEngine.tryMeet(state, loc);
            if (loc.story) StoryEngine.trigger(state, loc.story);
            if (loc.event && !state.flags['locev_' + loc.id] && Math.random() < 0.4) {
                state.flags['locev_' + loc.id] = true;
                EventEngine.trigger(state, loc.event);
            }
            if (Math.random() < encounterChance(state, loc)) {
                /* 遭遇会弹窗让玩家自己决定打还是跑（自动搜刮时不弹窗，直接结算） */
                const enc = EncounterEngine.start(state, loc, { interactive: !opts.auto });
                result.encounter = enc;
                if (enc && enc.kind === 'battle' && enc.result && enc.result.occupied) result.occupied = true;
            }
            /* 隐藏物资点：不是直接塞给你，而是弹窗告诉你藏在哪儿、怎么发现的 */
            if (!CacheEngine.waiting(state, loc.id) && !state.pending && Math.random() < CacheEngine.chance(state, loc)) {
                const c = CacheEngine.discover(state, loc);
                if (c) result.cacheFound = c.kind.name;
            }
        } else if (!CacheEngine.waiting(state, loc.id) && Math.random() < CacheEngine.chance(state, loc)) {
            /* 自动搜刮不弹窗：直接搬走，日志里提一句 */
            const r = CacheEngine.autoTake(state, loc);
            if (r && r.ok) result.cacheFound = '（自动搬走了藏起来的物资）';
        }
        AchievementEngine.check(state);
        return result;
    }

    /* 每小时：地点刷新 */
    function tick(state) {
        for (const loc of LOCATIONS_CONFIG) {
            const rec = state.locations[loc.id];
            if (!rec) continue;
            /* 占领到期：对方自己撤了 */
            if (rec.occupied && rec.occupied.until <= state.hours) release(state, loc.id, 'left');
            const max = maxUses(state, loc);
            if (rec.uses >= max && state.hours >= rec.at) {
                rec.uses = 0;
                if (rec.seen && !isDisabled(state, loc)) {
                    EventEngine.addLog(state, '🔄 ' + loc.name + '又有新的东西了。');
                }
            }
        }
    }

    function listStatus(state) {
        return LOCATIONS_CONFIG.map(l => status(state, l.id));
    }

    /* 自动搜刮：优先空投到「能搜且产出高」的地点 */
    function autoStep(state, hours) {
        const e = EffectsManager.get(state);
        if (!e.autoScavenge) return 0;
        if (!state.settings.autoScavenge) return 0;
        const interval = 5 / Math.max(0.2, e.autoScavenge);
        if (state.hours < (state.autoAt || 0)) return 0;
        state.autoAt = state.hours + interval;
        const pool = LOCATIONS_CONFIG.filter(l => {
            const st = status(state, l.id);
            return st.ok && !isDisabled(state, l);
        });
        if (!pool.length) return 0;
        const best = pool.reduce((a, b) => {
            const va = a.loot.reduce((s, x) => s + x.w, 0) / a.refresh;
            const vb = b.loot.reduce((s, x) => s + x.w, 0) / b.refresh;
            return va >= vb ? a : b;
        });
        scavenge(state, best.id, { auto: true, silent: false, mult: 0.85 });
        return 1;
    }

    window.ScavengeEngine = {
        locOf, status, listStatus, unlocked, lockReason, maxUses, refreshHours,
        yieldMult, scavenge, tick, autoStep, encounterChance, isDisabled,
        occupied, occupy, release, reclaim, holdHours,
    };
})();

<script>
/* ===== js/engine/eventengine.js ===== */
/* 随机事件、遭遇、战斗，以及「选项」这套通用动作脚本 */
(function () {
    function addLog(state, text) {
        state.logs.unshift({ t: state.hours, text: text });
        if (state.logs.length > 80) state.logs.length = 80;
    }

    function push(state, text) {
        addLog(state, text);
        if (window.UI && UI.toast) UI.toast(text);
    }

    function gainText(map) {
        const parts = [];
        for (const k in map) {
            const v = map[k];
            if (!v) continue;
            parts.push(k + (v > 0 ? ' +' : ' ') + Utils.fmtInt(v));
        }
        return parts.join('　') || '无';
    }

    function rollGain(map) {
        const out = {};
        for (const k in map) {
            const v = map[k];
            out[k] = Array.isArray(v) ? Math.round(Utils.rnd(v[0], v[1])) : v;
        }
        return out;
    }

    function safeCond(state, fn) {
        try { return !!fn(state); }
        catch (e) { console.error('[事件条件] 出错：', e); return false; }
    }

    /* ---------------- 事件池 ---------------- */
    function poolFor(state) {
        const phase = PhaseManager.id(state);
        return EVENTS_CONFIG.filter(ev => {
            if (ev.phases && ev.phases.indexOf(phase) < 0) return false;
            if (ev.dooms && ev.dooms.indexOf(state.doom) < 0) return false;
            if (ev.once && state.flags['ev_seen_' + ev.id]) return false;
            const last = state.flags['ev_at_' + ev.id];
            if (last !== undefined && state.hours - last < 24) return false;
            if (ev.cond && !safeCond(state, ev.cond)) return false;
            return true;
        });
    }

    function pickEvent(state) {
        return Utils.weightedPick(poolFor(state), ev => ev.weight);
    }

    function trigger(state, id) {
        const ev = EVENTS_CONFIG.find(x => x.id === id);
        if (!ev) return false;
        if (ev.once && state.flags['ev_seen_' + id]) return false;
        if (state.pending) return false;
        const phase = PhaseManager.id(state);
        if (ev.phases && ev.phases.indexOf(phase) < 0) return false;
        state.flags['ev_at_' + id] = state.hours;
        if (ev.once) state.flags['ev_seen_' + id] = true;
        state.events.count = (state.events.count || 0) + 1;
        state.pending = { type: 'event', id: id };
        return true;
    }

    function tick(state, hours) {
        /* 临时效果到期 */
        const alive = [];
        for (const t of state.tempEffects) {
            if (t.until <= state.hours) addLog(state, '⌛ 「' + t.name + '」的效果结束了。');
            else alive.push(t);
        }
        state.tempEffects = alive;

        const e = EffectsManager.get(state);
        if (state.hours < (state.events.nextAt || 0)) return;
        const rate = Math.max(-0.6, e.eventRate || 0);
        const interval = Math.max(2, Utils.rnd(5, 9) / (1 + rate));
        state.events.nextAt = state.hours + interval;
        if (state.pending) return;
        const ev = pickEvent(state);
        if (ev) trigger(state, ev.id);
    }

    /* ---------------- 战斗 ---------------- */
    function battleSpec(state, spec) {
        const power = PlayerManager.combatPower(state);
        const win = power * Utils.rnd(0.85, 1.15) >= spec.power;
        state.stats.battles += 1;
        if (win) {
            state.stats.battlesWon += 1;
            const added = spec.winLoot ? ResourcesManager.add(rollGain(spec.winLoot), state) : {};
            let crystal = 0;
            if (spec.crystal) crystal = PlayerManager.addCrystal(state, spec.crystal, null);
            if (spec.winMorale) PlayerManager.addMorale(state, spec.winMorale);
            const line = '⚔️ 赢了：' + (spec.name || '对手') + '。' +
                (Object.keys(added).length ? '缴获 ' + gainText(added) : '') +
                (crystal ? '（结晶 +' + crystal + '）' : '');
            push(state, line);
            return { win: true, line: line, gains: added, crystal: crystal };
        }
        const lost = {};
        if (spec.loseLoot) {
            for (const k in spec.loseLoot) {
                const take = Math.min(ResourcesManager.amount(k), spec.loseLoot[k]);
                if (take > 0) { ResourcesManager.discard(state, k, take); lost[k] = take; }
            }
        }
        if (spec.loseMorale) PlayerManager.addMorale(state, spec.loseMorale);
        const line = '🩸 输了：' + (spec.name || '对手') + '。' +
            (Object.keys(lost).length ? '损失 ' + gainText(lost) : '被打退了');
        push(state, line);
        return { win: false, line: line, lost: lost };
    }

    function resolveBattle(state, key) {
        const cfg = BATTLES_CONFIG[key] || BATTLES_CONFIG.enemy;
        /* 仇家越多，对面越舍得下本钱雇人 */
        const heat = state.heat ? (1 + state.heat * 0.05) : 1;
        return battleSpec(state, {
            name: cfg.name, power: Math.round(cfg.power * heat),
            winLoot: cfg.winLoot, loseLoot: cfg.loseLoot, crystal: cfg.crystal,
            winMorale: cfg.winMorale, loseMorale: cfg.loseMorale,
        });
    }

    /* ---------------- 选项动作脚本 ----------------
       事件 / 羁绊 / 剧情共用这一套：
       cost 扣资源、gain 得资源、crystal 结晶、morale 士气、value 好感、
       temp 限时效果、facility 免费升级、unlock 解锁地点、set 记标记、battle 打一场。 */
    function applyChoice(state, ch, ctx) {
        ctx = ctx || {};
        const res = { ok: true, lines: [] };

        if (ch.crystal && ch.crystal < 0) {
            const need = -ch.crystal;
            if (state.space.crystals < need) return { ok: false, msg: '异能结晶不够（需要 ' + need + ' 颗）。' };
        }
        if (ch.cost && !ResourcesManager.canAfford(ch.cost, state)) {
            const miss = ResourcesManager.missing(ch.cost, state);
            return { ok: false, msg: '物资不够：还差 ' + gainText(miss) };
        }

        if (ch.cost) {
            ResourcesManager.spend(ch.cost, state);
            res.lines.push('消耗 ' + gainText(ch.cost));
        }
        if (ch.crystal < 0) {
            state.space.crystals += ch.crystal;
            res.lines.push('异能结晶 ' + ch.crystal);
        }
        if (ch.gain) {
            const added = ResourcesManager.add(rollGain(ch.gain), state);
            if (Object.keys(added).length) res.lines.push('获得 ' + gainText(added));
        }
        if (ch.crystal > 0) {
            const g = PlayerManager.addCrystal(state, ch.crystal, '事件');
            if (g) res.lines.push('异能结晶 +' + g);
        }
        if (ch.morale) {
            PlayerManager.addMorale(state, ch.morale);
            res.lines.push('士气 ' + (ch.morale > 0 ? '+' : '') + ch.morale);
        }
        if (ctx.bondId) {
            BondEngine.markMet(state, ctx.bondId);
            if (ch.value) BondEngine.addValue(state, ctx.bondId, ch.value, '剧情');
            if (ch.outcome) BondEngine.setOutcome(state, ctx.bondId, ch.outcome);
        }
        if (ch.bonds) {
            for (const id in ch.bonds) {
                BondEngine.markMet(state, id);
                BondEngine.setOutcome(state, id, ch.bonds[id]);
            }
        }
        if (ch.temp) {
            state.tempEffects.push({ name: ch.temp.name, effect: ch.temp.effect, until: state.hours + ch.temp.hours });
            res.lines.push('持续效果「' + ch.temp.name + '」' + Utils.fmtHours(ch.temp.hours));
        }
        if (ch.facility) {
            for (const id in ch.facility) {
                const r = BuildEngine.freeLevel(state, id, ch.facility[id]);
                if (r.ok) res.lines.push('设施「' + r.name + '」+1 级');
            }
        }
        if (ch.unlock) {
            let n = 0;
            for (const lid of ch.unlock) {
                if (state.locations[lid] && !state.locations[lid].seen) {
                    state.locations[lid].seen = true;
                    const lc = LOCATIONS_CONFIG.find(x => x.id === lid);
                    if (lc) res.lines.push('新地点：' + lc.name);
                    n++;
                }
            }
            if (!n) res.lines.push('地图没有变化');
        }
        if (ch.set) {
            for (const k in ch.set) state.flags[k] = ch.set[k];
            if (ch.set.revenge) state.story.revenge = 1;
        }
        if (ch.battle) {
            const b = resolveBattle(state, ch.battle);
            res.battle = b;
            res.lines.push(b.line);
                if (b.win && ch.heatOnWin) MoneyEngine.addHeat(state, ch.heatOnWin, '打退了一波');
                if (!b.win && ch.heatOnLose) MoneyEngine.addHeat(state, ch.heatOnLose, '被人打上门');
            }
            if (ch.heat) {
                if (ch.heat > 0) MoneyEngine.addHeat(state, ch.heat, '你的选择');
                else MoneyEngine.reduceHeat(state, -ch.heat, '你的选择');
                res.lines.push('仇家 ' + (ch.heat > 0 ? '+' : '') + ch.heat);
        }
        if (ch.duel) {
            const b = resolveBattle(state, ch.duel === 'guchangan' ? 'guchangan' : 'enemy');
            res.battle = b;
            if (b.win) {
                BondEngine.setOutcome(state, 'guchangan', 'ally');
                BondEngine.addValue(state, 'guchangan', 30, '决斗');
                res.lines.push('他拍掉身上的灰："行，我跟你走。"');
            } else {
                const take = Math.min(ResourcesManager.amount('食物'), 40);
                ResourcesManager.discard(state, '食物', take);
                res.lines.push('你输了。按约定，你留下了一批物资。');
            }
        }
        if (ch.gamble) {
            const id = ch.gamble;
            const st = BondEngine.get(state, id);
            const trust = st.value >= 60;
            res.lines.push(trust
                ? '他确实把货分了你一半，还多塞给你两卷电线。'
                : '回程时他"不小心"把一箱罐头掉在了路边——你看见了，他就笑。');
            if (trust) {
                BondEngine.addValue(state, id, 10, '同行');
                const added = ResourcesManager.add({ '食物': 30, '弹药': 12 }, state);
                res.lines.push('获得 ' + gainText(added));
            } else {
                BondEngine.addValue(state, id, -5, '同行');
                BondEngine.setOutcome(state, id, 'left');
            }
        }
        if (ch.action === 'awaken') {
            state.pending = { type: 'awaken' };
            res.action = 'awaken';
        }
        state.stats.eventsResolved += 1;
        EffectsManager.refreshAllEffects(state);
        AchievementEngine.check(state);
        res.text = ch.result || '';
        return res;
    }

    /* 结算一个待处理的事件浮窗 */
    function resolve(state, choiceIndex) {
        const p = state.pending;
        if (!p || p.type !== 'event') return { ok: false, msg: '现在没有待处理的事件。' };
        const ev = EVENTS_CONFIG.find(x => x.id === p.id);
        if (!ev) { state.pending = null; return { ok: false, msg: '事件数据丢了。' }; }
        const ch = ev.choices[choiceIndex];
        if (!ch) return { ok: false, msg: '没有这个选项。' };
        const ctx = ev.bond ? { bondId: ev.bond } : {};
        const res = applyChoice(state, ch, ctx);
        if (!res.ok) return res;
        if (res.action === 'awaken') return res;      // 觉醒浮窗接替
        state.pending = null;
        return res;
    }

    /* 选项能不能点（可点性只看当前资源） */
    function choiceUsable(state, ch) {
        if (ch.crystal && ch.crystal < 0 && state.space.crystals < -ch.crystal) {
            return { ok: false, lack: '还差异能结晶 ' + (-ch.crystal - state.space.crystals) + ' 颗' };
        }
        if (ch.cost && !ResourcesManager.canAfford(ch.cost, state)) {
            return { ok: false, lack: '还差 ' + gainText(ResourcesManager.missing(ch.cost, state)) };
        }
        return { ok: true };
    }

    window.EventEngine = {
        addLog, push, gainText, rollGain, trigger, tick, poolFor, pickEvent,
        battleSpec, resolveBattle, applyChoice, resolve, choiceUsable,
    };
})();

</script>
<script>
/* ===== js/engine/encounter.js ===== */
/* 遭遇战：搜刮时撞上敌人不再自动结算，而是弹窗让你决定「打还是跑」。
   战力判定和 battleSpec 用同一条公式（战力 × 0.85~1.15 对撞），所以界面上显示的胜率是准的。 */
(function () {
    function namesOf(doom) {
        const list = ENEMIES_CONFIG[doom] || ENEMIES_CONFIG.zombie;
        return list.map(e => e.name);
    }

    /* 胜率：mine × r ≥ enemy，其中 r 均匀落在 [rollLow, rollHigh] */
    function winOdds(mine, enemy) {
        const R = ENCOUNTER_RULES;
        if (enemy <= 0) return 1;
        const ratio = enemy / Math.max(1, mine);
        return Utils.clamp((R.rollHigh - ratio) / (R.rollHigh - R.rollLow), 0, 1);
    }

    function fleeOdds(state, enc, dumping) {
        const R = ENCOUNTER_RULES;
        const ratio = enc.power / Math.max(1, PlayerManager.combatPower(state));
        const p = R.fleeBase - Math.min(R.fleePenaltyCap, Math.max(0, ratio - 1) * R.fleePenalty) +
            (dumping ? R.dumpFleeBonus : 0);
        return Utils.clamp(p, 0.12, 0.92);
    }

    /* 组一支敌人：种类随机、个数看数量区间、战力随时间和危险度上浮 */
    function roll(state, loc) {
        const R = ENCOUNTER_RULES;
        const list = ENEMIES_CONFIG[state.doom] || ENEMIES_CONFIG.zombie;
        const kind = Utils.pick(list);
        const scale = 1 + state.hours / R.powerOverTime;
        const count = Utils.rndInt(kind.count[0], kind.count[1]) + (loc.danger >= R.extraAtDanger ? 1 : 0);
        const unit = Math.max(1, Math.round(kind.power * scale));
        const power = Math.max(1, Math.round(unit * count * (1 + loc.danger * R.dangerBonus)));
        return {
            kind: kind, unit: unit, count: count, power: power,
            seq: (state.encounter && state.encounter.seq ? state.encounter.seq : 0) + 1,
            location: loc.id, locationName: loc.name,
            tries: 0, dumped: {}, log: [],
        };
    }

    /* 开始一次遭遇：一半是事，一半是打（打的这一半交给玩家决定） */
    function start(state, loc, opts) {
        opts = opts || {};
        if (state.pending) return null;
        if (Math.random() < (1 - ENCOUNTER_RULES.battleChance)) {
            const ev = EventEngine.pickEvent(state);
            if (ev && EventEngine.trigger(state, ev.id)) return { kind: 'event', id: ev.id };
        }
        const enc = roll(state, loc);
        state.encounter = enc;
        if (opts.interactive === false) {
            /* 自动搜刮不弹窗：直接按战力结算，输了照样被占 */
            const res = fight(state, true);
            return { kind: 'battle', result: res, enemy: { name: enc.kind.name, power: enc.power }, auto: true };
        }
        state.pending = { type: 'encounter' };
        EventEngine.addLog(state, '⚠️ 在' + loc.name + '撞上了 ' + enc.count + ' 只「' + enc.kind.name +
            '」（对方战力 ' + enc.power + '）。');
        return { kind: 'encounter', encounter: enc };
    }

    /* 迎战 */
    function fight(state, auto) {
        const enc = state.encounter;
        if (!enc) return null;
        const loc = ScavengeEngine.locOf(enc.location);
        const res = EventEngine.battleSpec(state, {
            name: enc.count + ' 只' + enc.kind.name, power: enc.power,
            winLoot: { '食物': Utils.rndInt(8, 20), '弹药': Utils.rndInt(2, 8) },
            loseLoot: { '食物': Utils.rndInt(8, 18), '药品': Utils.rndInt(1, 5) },
            crystal: 2 + Math.floor(enc.power / 40), winMorale: 5, loseMorale: -8,
        });
        if (!res.win && loc) {
            ScavengeEngine.occupy(state, loc, enc.count + ' 只' + enc.kind.name, enc.power);
            res.occupied = true;
        }
        if (!auto) {
            state.encounter = null;
            state.pending = null;
        }
        return res;
    }

    /* 逃跑：失败就丢一部分物资，然后还得再选一次 */
    function flee(state, opts) {
        opts = opts || {};
        const enc = state.encounter;
        if (!enc) return { ok: false, msg: '没有正在进行的遭遇。' };
        const R = ENCOUNTER_RULES;
        const loc = ScavengeEngine.locOf(enc.location);
        const p = fleeOdds(state, enc, opts.dumping);

        if (opts.dumping) {
            /* 主动放下一些东西，换更高的成功率 */
            const dropped = ResourcesManager.add({}, state) || {};
            const lost = {};
            for (const k in R.dumpCost) {
                const take = Math.min(ResourcesManager.amount(k), R.dumpCost[k]);
                if (take > 0) { ResourcesManager.discard(state, k, take); lost[k] = take; }
            }
            enc.dumped = lost;
            enc.log.push('丢下了 ' + EventEngine.gainText(lost));
        }

        if (Math.random() < p) {
            enc.log.push('甩掉了他们');
            PlayerManager.addMorale(state, -2);
            const text = (opts.dumping ? '你把东西扔在巷子里，趁他们去抢的时候翻过了墙。' : '你转身就跑，一直跑到听不见为止。');
            state.encounter = null;
            state.pending = null;
            EventEngine.addLog(state, '🏃 在' + (loc ? loc.name : '废墟') + '甩掉了' + enc.count + ' 只' + enc.kind.name + '。');
            return { ok: true, fled: true, text: text, lines: enc.log };
        }

        /* 没跑掉 */
        enc.tries += 1;
        const lost = {};
        for (const k in R.fleeLoss) {
            const r = R.fleeLoss[k];
            const take = Math.min(ResourcesManager.amount(k), Utils.rndInt(r[0], r[1]));
            if (take > 0) { ResourcesManager.discard(state, k, take); lost[k] = take; }
        }
        PlayerManager.addMorale(state, -3);
        enc.log.push('第 ' + enc.tries + ' 次没跑掉：' + EventEngine.gainText(lost));

        if (enc.tries >= R.maxFleeTries) {
            /* 被冲散：损失更重，而且这个地方被他们占了 */
            const heavy = {};
            for (const k in R.scatterLoss) {
                const r = R.scatterLoss[k];
                const take = Math.min(ResourcesManager.amount(k), Utils.rndInt(r[0], r[1]));
                if (take > 0) { ResourcesManager.discard(state, k, take); heavy[k] = take; }
            }
            PlayerManager.addMorale(state, -8);
            if (loc) ScavengeEngine.occupy(state, loc, enc.count + ' 只' + enc.kind.name, enc.power);
            state.encounter = null;
            state.pending = null;
            return {
                ok: true, fled: false, scattered: true, lines: enc.log,
                text: '你被追上了。东西散了一地，你只捡回了半条命 —— 他们也记住了这里。',
                extra: heavy,
            };
        }
        EventEngine.addLog(state, '🏃 没跑掉：' + EventEngine.gainText(lost) + '在混乱中丢了。');
        return { ok: true, fled: false, lines: enc.log, odds: p };
    }

    function info(state) {
        const enc = state.encounter;
        if (!enc) return null;
        const mine = PlayerManager.combatPower(state);
        const odds = winOdds(mine, enc.power);
        return {
            enc: enc, mine: mine, odds: odds,
            canFight: odds > 0,
            verdict: odds >= 0.85 ? '稳赢' : (odds >= 0.35 ? '有得打' : (odds > 0 ? '很勉强' : '打不过')),
            flee: fleeOdds(state, enc, false),
            fleeDump: fleeOdds(state, enc, true),
            dumpCost: ENCOUNTER_RULES.dumpCost,
            tries: enc.tries, maxTries: ENCOUNTER_RULES.maxFleeTries,
        };
    }

    window.EncounterEngine = { namesOf, winOdds, fleeOdds, roll, start, fight, flee, info };
})();

</script>
<script>
/* ===== js/engine/cache.js ===== */
/* 隐藏物资点：发现 → 弹窗（剧情 + 地点）→ 搬走 / 只挑值钱的 / 先记下来 */
(function () {
    function of(state, locId) {
        const rec = state.locations[locId];
        return rec && rec.cache ? rec.cache : null;
    }
    function waiting(state, locId) {
        return !!of(state, locId);
    }

    function chance(state, loc) {
        const e = EffectsManager.get(state);
        return Utils.clamp(CACHE_RULES.baseChance * (1 + (e.hiddenFind || 0)), 0, 0.5);
    }

    /* 掷一个物资点：从地点自己的产出表里抓，量比正常搜刮多不少 */
    function roll(state, loc) {
        const kind = Utils.pick(CACHE_KINDS);
        const boost = kind.boost * Utils.rnd(CACHE_RULES.boostMin, CACHE_RULES.boostMax);
        const loot = {};
        const picks = 2 + (Math.random() < 0.5 ? 1 : 0);
        for (let i = 0; i < picks; i++) {
            const entry = Utils.weightedPick(loc.loot, x => x.w);
            if (!entry) break;
            const amt = Math.max(1, Math.round(Utils.rnd(entry.min, entry.max) * boost));
            loot[entry.res] = (loot[entry.res] || 0) + amt;
        }
        return {
            kindId: kind.id, kind: kind,
            loot: loot,
            crystal: Utils.rndInt(kind.crystal[0], kind.crystal[1]),
            at: state.hours,
            location: loc.id, locationName: loc.name,
        };
    }

    /* 发现了：记在地点上，挂一个待处理的浮窗 */
    function discover(state, loc, cache) {
        if (state.pending) return null;
        const c = cache || roll(state, loc);
        state.locations[loc.id].cache = c;
        state.pending = { type: 'cache', id: loc.id };
        EventEngine.addLog(state, '📦 在' + loc.name + '发现了「' + c.kind.name + '」。');
        return c;
    }

    /* 空间还够装多少（提示用） */
    function spaceNote(state, cache) {
        let need = 0;
        for (const r in cache.loot) need += cache.loot[r] * ResourcesManager.spaceOf(r);
        const left = ResourcesManager.spaceLeft(state);
        return { need: Math.round(need), left: Math.round(left), enough: need <= left + 1e-6 };
    }

    /* 最值钱的那一样（按占用格数排序，占得多的通常是大件） */
    function bestRes(cache) {
        let best = null, bestW = -1;
        for (const r in cache.loot) {
            const w = ResourcesManager.spaceOf(r);
            if (w > bestW) { bestW = w; best = r; }
        }
        return best;
    }

    /* 搬走：'all' 全搬 / 'best' 只挑值钱的 / 'later' 先记下来 */
    function take(state, locId, mode) {
        const loc = ScavengeEngine.locOf(locId);
        const cache = of(state, locId);
        if (!loc || !cache) return { ok: false, msg: '这里没有藏起来的物资。' };
        if (mode === 'later') {
            state.pending = null;
            EventEngine.addLog(state, '📝 你记下了' + loc.name + '的「' + cache.kind.name + '」，准备回头再来搬。');
            return { ok: true, kept: true, text: '你记下了位置。地图上那个地点会留一个标记，物资点不会自己消失。' };
        }
        const want = {};
        if (mode === 'best') {
            const keep = bestRes(cache);
            if (keep) want[keep] = Math.max(1, Math.round(cache.loot[keep] / 2));
        } else {
            for (const r in cache.loot) want[r] = cache.loot[r];
        }
        const added = ResourcesManager.add(want, state);
        let crystal = 0;
        if (mode === 'all') crystal = PlayerManager.addCrystal(state, cache.crystal, '隐藏物资点');
        const lines = [];
        const got = EventEngine.gainText(added);
        if (got !== '无') lines.push('搬走：' + got);
        let leftOver = false;
        for (const r in want) if ((added[r] || 0) < want[r] - 0.5) leftOver = true;
        if (leftOver) lines.push('空间装不下，剩下一部分只能留在原地');
        if (crystal) lines.push('异能结晶 +' + crystal);
        if (mode === 'best') lines.push('大件太重，你只挑了最值钱的一批');
        /* 搬过 / 挑过之后，这里的提示就消失了 */
        state.locations[locId].cache = null;
        state.pending = null;
        EventEngine.addLog(state, '📦 ' + loc.name + '的「' + cache.kind.name + '」' +
            (mode === 'all' ? '搬空了。' : '挑走了一部分，剩下的留在了原地。'));
        AchievementEngine.check(state);
        return {
            ok: true, done: true, added: added, crystal: crystal, lines: lines,
            text: cache.kind.find,
        };
    }

    /* 自动搜刮时不弹窗：直接按「全搬」结算 */
    function autoTake(state, loc) {
        const c = roll(state, loc);
        state.locations[loc.id].cache = c;
        const r = take(state, loc.id, 'all');
        return r;
    }

    window.CacheEngine = { of, waiting, chance, roll, discover, take, autoTake, spaceNote, bestRes };
})();

<script>
/* ===== js/engine/cache.js ===== */
/* 隐藏物资点：发现 → 弹窗（剧情 + 地点）→ 搬走 / 只挑值钱的 / 先记下来 */
(function () {
    function of(state, locId) {
        const rec = state.locations[locId];
        return rec && rec.cache ? rec.cache : null;
    }
    function waiting(state, locId) {
        return !!of(state, locId);
    }

    function chance(state, loc) {
        const e = EffectsManager.get(state);
        return Utils.clamp(CACHE_RULES.baseChance * (1 + (e.hiddenFind || 0)), 0, 0.5);
    }

    /* 掷一个物资点：从地点自己的产出表里抓，量比正常搜刮多不少 */
    function roll(state, loc) {
        const kind = Utils.pick(CACHE_KINDS);
        const boost = kind.boost * Utils.rnd(CACHE_RULES.boostMin, CACHE_RULES.boostMax);
        const loot = {};
        const picks = 2 + (Math.random() < 0.5 ? 1 : 0);
        for (let i = 0; i < picks; i++) {
            const entry = Utils.weightedPick(loc.loot, x => x.w);
            if (!entry) break;
            const amt = Math.max(1, Math.round(Utils.rnd(entry.min, entry.max) * boost));
            loot[entry.res] = (loot[entry.res] || 0) + amt;
        }
        return {
            kindId: kind.id, kind: kind,
            loot: loot,
            crystal: Utils.rndInt(kind.crystal[0], kind.crystal[1]),
            at: state.hours,
            location: loc.id, locationName: loc.name,
        };
    }

    /* 发现了：记在地点上，挂一个待处理的浮窗 */
    function discover(state, loc, cache) {
        if (state.pending) return null;
        const c = cache || roll(state, loc);
        state.locations[loc.id].cache = c;
        state.pending = { type: 'cache', id: loc.id };
        EventEngine.addLog(state, '📦 在' + loc.name + '发现了「' + c.kind.name + '」。');
        return c;
    }

    /* 空间还够装多少（提示用） */
    function spaceNote(state, cache) {
        let need = 0;
        for (const r in cache.loot) need += cache.loot[r] * ResourcesManager.spaceOf(r);
        const left = ResourcesManager.spaceLeft(state);
        return { need: Math.round(need), left: Math.round(left), enough: need <= left + 1e-6 };
    }

    /* 最值钱的那一样（按占用格数排序，占得多的通常是大件） */
    function bestRes(cache) {
        let best = null, bestW = -1;
        for (const r in cache.loot) {
            const w = ResourcesManager.spaceOf(r);
            if (w > bestW) { bestW = w; best = r; }
        }
        return best;
    }

    /* 搬走：'all' 全搬 / 'best' 只挑值钱的 / 'later' 先记下来 */
    function take(state, locId, mode) {
        const loc = ScavengeEngine.locOf(locId);
        const cache = of(state, locId);
        if (!loc || !cache) return { ok: false, msg: '这里没有藏起来的物资。' };
        if (mode === 'later') {
            state.pending = null;
            EventEngine.addLog(state, '📝 你记下了' + loc.name + '的「' + cache.kind.name + '」，准备回头再来搬。');
            return { ok: true, kept: true, text: '你记下了位置。地图上那个地点会留一个标记，物资点不会自己消失。' };
        }
        const want = {};
        if (mode === 'best') {
            const keep = bestRes(cache);
            if (keep) want[keep] = Math.max(1, Math.round(cache.loot[keep] / 2));
        } else {
            for (const r in cache.loot) want[r] = cache.loot[r];
        }
        const added = ResourcesManager.add(want, state);
        let crystal = 0;
        if (mode === 'all') crystal = PlayerManager.addCrystal(state, cache.crystal, '隐藏物资点');
        const lines = [];
        const got = EventEngine.gainText(added);
        if (got !== '无') lines.push('搬走：' + got);
        let leftOver = false;
        for (const r in want) if ((added[r] || 0) < want[r] - 0.5) leftOver = true;
        if (leftOver) lines.push('空间装不下，剩下一部分只能留在原地');
        if (crystal) lines.push('异能结晶 +' + crystal);
        if (mode === 'best') lines.push('大件太重，你只挑了最值钱的一批');
        /* 搬过 / 挑过之后，这里的提示就消失了 */
        state.locations[locId].cache = null;
        state.pending = null;
        EventEngine.addLog(state, '📦 ' + loc.name + '的「' + cache.kind.name + '」' +
            (mode === 'all' ? '搬空了。' : '挑走了一部分，剩下的留在了原地。'));
        AchievementEngine.check(state);
        return {
            ok: true, done: true, added: added, crystal: crystal, lines: lines,
            text: cache.kind.find,
        };
    }

    /* 自动搜刮时不弹窗：直接按「全搬」结算 */
    function autoTake(state, loc) {
        const c = roll(state, loc);
        state.locations[loc.id].cache = c;
        const r = take(state, loc.id, 'all');
        return r;
    }

    window.CacheEngine = { of, waiting, chance, roll, discover, take, autoTake, spaceNote, bestRes };
})();
