<script>
/* ===== js/engine/money.js ===== */
/* 钱：借（花好感）与抢（记仇）。
   搜刮不再出钱，所以现金只能从人身上来 —— 借来的要还人情，抢来的要防着仇家。 */
(function () {
    function wealthOf(bondId) {
        const w = BOND_WEALTH[bondId];
        return typeof w === 'number' ? w : BOND_WEALTH.default;
    }

    /* ---------------- 借钱 ---------------- */
    function borrowInfo(state, id) {
        const c = BondEngine.cfg(id);
        const st = BondEngine.get(state, id);
        const R = BORROW_RULES;
        if (!c || !st) return { ok: false, reason: '没有这个人。' };
        if (!st.met) return { ok: false, reason: '还不认识他/她。' };
        if (st.outcome === 'enemy' || st.outcome === 'dead' || st.outcome === 'left') {
            return { ok: false, reason: '现在开不了这个口。' };
        }
        const loans = st.loans || 0;
        if (loans >= R.maxPerBond) return { ok: false, reason: '他已经借过 ' + loans + ' 次了，再开口就伤感情。' };
        const favorCost = R.favorCost + loans * R.favorCostStep;
        const cash = Math.round(wealthOf(id) * (1 - R.cashDecay * loans));
        if (st.value < R.minFavor + favorCost) {
            return { ok: false, reason: '好感不够（要 ' + (R.minFavor + favorCost) + '，现在 ' + Math.round(st.value) + '）',
                favorCost: favorCost, cash: cash };
        }
        return { ok: true, favorCost: favorCost, cash: cash, loans: loans, left: R.maxPerBond - loans };
    }

    function borrow(state, id) {
        const info = borrowInfo(state, id);
        if (!info.ok) return { ok: false, msg: info.reason };
        const c = BondEngine.cfg(id);
        const st = BondEngine.get(state, id);
        st.loans = (st.loans || 0) + 1;
        BondEngine.addValue(state, id, -info.favorCost, '借钱');
        ResourcesManager.add({ '现金': info.cash }, state);
        EventEngine.addLog(state, '💸 向' + c.name + '借了 ' + Utils.fmtInt(info.cash) + ' 现金（好感 -' + info.favorCost + '）。');
        return {
            ok: true, cash: info.cash, favorCost: info.favorCost,
            msg: '向' + c.name + '借到 ' + Utils.fmtInt(info.cash) + ' 现金，欠的是人情（好感 -' + info.favorCost + '）',
        };
    }

    /* ---------------- 抢钱 ---------------- */
    function robPowerNeed(state, loc) {
        return Math.round(ROB_RULES.powerNeed(loc) * (1 + state.hours / 400));
    }

    function robInfo(state, loc) {
        const need = robPowerNeed(state, loc);
        const mine = PlayerManager.combatPower(state);
        return {
            need: need, mine: mine,
            ok: mine >= need,
            odds: ROB_RULES.odds(mine / Math.max(1, need)),
            haul: ROB_RULES.haul(loc, state.hours),
            reason: mine >= need ? '' : '看场子的比你能打（需要战力 ' + need + '，你 ' + mine + '）',
        };
    }

    function rob(state, locId) {
        const loc = ScavengeEngine.locOf(locId);
        if (!loc) return { ok: false, msg: '没有这个地方。' };
        const st = ScavengeEngine.status(state, locId);
        if (!st.unlocked) return { ok: false, msg: st.reason };
        if (st.disabled) return { ok: false, msg: '这里已经被淹了，抢不出东西。' };
        const info = robInfo(state, loc);
        if (!info.ok) return { ok: false, msg: info.reason };

        Actions.spend(state, 'scavenge');            // 抢一趟也要花时间
        if (Math.random() < info.odds) {
            const cash = ROB_RULES.haul(loc, state.hours);
            ResourcesManager.add({ '现金': cash }, state);
            PlayerManager.addMorale(state, -ROB_RULES.moraleCost);
            addHeat(state, ROB_RULES.heatOnSuccess, '在' + loc.name + '抢了一票');
            EventEngine.addLog(state, '💰 在' + loc.name + '抢到 ' + Utils.fmtInt(cash) + ' 现金（仇家 +' +
                ROB_RULES.heatOnSuccess + '）。');
            return {
                ok: true, win: true, cash: cash, msg: '抢到 ' + Utils.fmtInt(cash) + ' 现金',
                text: '你把这地方的人按住，翻走了他们身上和抽屉里的钱。他们记住了你的脸。',
                lines: ['现金 +' + Utils.fmtInt(cash), '士气 -' + ROB_RULES.moraleCost,
                    '仇家 +' + ROB_RULES.heatOnSuccess + '（现在是 ' + state.heat + '）'],
            };
        }
        const lost = {};
        for (const k in ROB_RULES.failLoss) {
            const r = ROB_RULES.failLoss[k];
            const take = Math.min(ResourcesManager.amount(k), Utils.rndInt(r[0], r[1]));
            if (take > 0) { ResourcesManager.discard(state, k, take); lost[k] = take; }
        }
        PlayerManager.addMorale(state, -5);
        addHeat(state, ROB_RULES.heatOnFail, '抢' + loc.name + '没得手');
        EventEngine.addLog(state, '🩸 抢' + loc.name + '没得手，自己挂彩回来（仇家 +' + ROB_RULES.heatOnFail + '）。');
        return {
            ok: true, win: false, msg: '没抢成，还挂了彩',
            text: '对方比你想的硬。你退了出来，衣服上多了两道口子。',
            lines: ['损失 ' + EventEngine.gainText(lost), '士气 -5', '仇家 +' + ROB_RULES.heatOnFail],
        };
    }

    /* ---------------- 仇家 ---------------- */
    function addHeat(state, n, why) {
        if (!n) return state.heat;
        const before = state.heat;
        state.heat = Utils.clamp(state.heat + n, 0, HEAT_RULES.max);
        state.heatCoolAt = state.hours + HEAT_RULES.coolHours;
        if (state.heat > before) {
            EventEngine.addLog(state, '🔥 ' + (why || '有人记账') + '：仇家 ' + before + ' → ' + state.heat +
                (state.heat >= HEAT_RULES.visitAt ? '（已经有人开始打听你了）' : ''));
        }
        return state.heat;
    }

    function reduceHeat(state, n, why) {
        const before = state.heat;
        state.heat = Utils.clamp(state.heat - n, 0, HEAT_RULES.max);
        if (state.heat < before) EventEngine.addLog(state, '🧯 ' + (why || '了结了一桩') + '：仇家 ' + before + ' → ' + state.heat);
        return state.heat;
    }

    /* 每小时：没人来算账，仇家会淡一点 */
    function tick(state) {
        if (state.heat <= 0) return;
        if (state.hours < state.heatCoolAt) return;
        state.heatCoolAt = state.hours + HEAT_RULES.coolHours;
        reduceHeat(state, 1, '时间冲淡');
    }

    function raidMultiplier(state) {
        return 1 + state.heat * HEAT_RULES.raidPowerPerHeat;
    }

    window.MoneyEngine = {
        wealthOf, borrowInfo, borrow, robInfo, rob, robPowerNeed,
        addHeat, reduceHeat, tick, raidMultiplier,
    };
})();

</script>
<script>
/* ===== js/engine/bondengine.js ===== */
/* 羁绊：相遇、好感、送礼、关键节点 */
(function () {
    function cfg(id) { return BONDS_CONFIG.find(b => b.id === id); }
    function get(state, id) { return state.bonds[id]; }

    function markMet(state, id) {
        const st = get(state, id);
        if (!st || st.met) return false;
        const c = cfg(id);
        st.met = true;
        EventEngine.addLog(state, '🤝 你认识了「' + (c ? c.name : id) + '」。');
        return true;
    }

    function setOutcome(state, id, outcome) {
        const st = get(state, id);
        const c = cfg(id);
        if (!st) return;
        st.met = true;
        if (outcome) st.outcome = outcome;
        const label = {
            ally: '成了你的同伴', partner: '和你走到了一起', enemy: '成了你的敌人',
            dead: '死在了这一世', left: '离开了这里', neutral: '保持着距离',
        }[outcome] || outcome;
        if (label && c) EventEngine.push(state, '🤝 ' + c.name + label + '。');
        EffectsManager.refreshAllEffects(state);
    }

    /* 好感：正收益吃「好感获取」加成，负收益不打折 */
    function addValue(state, id, delta, reason) {
        const st = get(state, id);
        const c = cfg(id);
        if (!st || !c || !delta) return 0;
        const e = EffectsManager.get(state);
        const gain = delta > 0 ? delta * (1 + (e.bondGain || 0)) : delta;
        const before = st.value;
        st.value = Utils.clamp(st.value + gain, -30, 100);
        const diff = Math.round(st.value - before);
        if (diff) {
            EventEngine.addLog(state, (diff > 0 ? '💬 ' : '💔 ') + c.name + ' 好感 ' +
                (diff > 0 ? '+' : '') + diff + '（' + (reason || '剧情') + '）' +
                '，现在是 ' + Math.round(st.value));
        }
        return diff;
    }

    function assistActive(state, id) {
        const st = get(state, id);
        const c = cfg(id);
        if (!st || !st.met || !c || !c.assist) return false;
        if (st.outcome === 'enemy' || st.outcome === 'dead' || st.outcome === 'left') return false;
        return st.value >= (c.assist.at || 0);
    }

    /* 在某个地点搜刮时遇到人 */
    function tryMeet(state, loc) {
        if (state.pending) return false;
        /* 地点可以指定一个人（loc.bond），否则按配置顺序找出「住在这个地点、还没认识」的角色 */
        let c = null;
        if (loc.bond) {
            const st = get(state, loc.bond);
            if (st && !st.met) c = cfg(loc.bond);
        }
        if (!c) {
            c = BONDS_CONFIG.find(b => b.locate && b.locate.location === loc.id && !get(state, b.id).met) || null;
        }
        if (!c) return false;
        if (c.phase && !phaseOk(state, c.phase)) return false;
        markMet(state, c.id);
        present(state, c.id, 'meet');
        return true;
    }

    function phaseOk(state, phase) {
        const order = PHASES_CONFIG.map(p => p.id);
        return order.indexOf(PhaseManager.id(state)) >= order.indexOf(phase);
    }

    function present(state, id, stage) {
        state.pending = { type: 'bond', id: id, stage: stage };
    }

    function crossroadReady(state, id) {
        const st = get(state, id);
        const c = cfg(id);
        if (!st || !c || !c.crossroad) return false;
        if (!st.met || st.flag.crossroadDone) return false;
        if (st.outcome === 'dead' || st.outcome === 'left') return false;
        return st.value >= c.crossroad.at;
    }

    function tick(state) {
        /* 关键节点：好感够了就触发（一次只弹一个） */
        if (!state.pending) {
            for (const c of BONDS_CONFIG) {
                if (!crossroadReady(state, c.id)) continue;
                present(state, c.id, 'crossroad');
                break;
            }
        }
        /* 自动送礼 */
        const e = EffectsManager.get(state);
        if (!e.specials.autoGift || !state.settings.autoGift) return;
        if (state.hours < (state.autoGiftAt || 0)) return;
        state.autoGiftAt = state.hours + 8;
        for (const c of BONDS_CONFIG) {
            const info = giftInfo(state, c.id);
            if (info.ok && info.value < 70) { gift(state, c.id); break; }
        }
    }

    /* ---------------- 送礼 ---------------- */
    function giftInfo(state, id) {
        const c = cfg(id);
        const st = get(state, id);
        const e = EffectsManager.get(state);
        if (!c || !st) return { ok: false, reason: '没有这个人。' };
        if (!st.met) return { ok: false, reason: '还没认识他/她。' };
        if (st.outcome === 'dead' || st.outcome === 'left') return { ok: false, reason: '已经不在了。' };
        const day = Math.floor(state.hours / 24);
        const today = st.giftDay === day ? (st.giftsToday || 0) : 0;
        const limit = (c.giftLimit || 3) + Math.floor(e.giftExtra || 0);
        const same = c.giftLike && c.giftLike.res === c.gift.res;
        const base = 6 + (same ? (c.giftLike.bonus || 0) : 0);
        const value = Math.max(1, Math.round(base * Math.pow(0.6, today) * (1 + (e.giftEffect || 0)) * (1 + (e.bondGain || 0))));
        const cost = {}; cost[c.gift.res] = c.gift.amount;
        const liked = c.giftLike && c.giftLike.res !== c.gift.res;
        if (today >= limit) return { ok: false, reason: '今天已经收过 ' + limit + ' 次礼物了。', value: value, cost: cost, left: 0 };
        if (!ResourcesManager.canAfford(cost, state)) {
            return { ok: false, reason: '还差 ' + c.gift.res + ' ' + c.gift.amount, value: value, cost: cost, left: limit - today };
        }
        return { ok: true, value: value, cost: cost, left: limit - today, res: c.gift.res, amount: c.gift.amount, liked: liked };
    }

    function gift(state, id) {
        const info = giftInfo(state, id);
        if (!info.ok) return info;
        ResourcesManager.spend(info.cost, state);
        const c = cfg(id);
        const st = get(state, id);
        const day = Math.floor(state.hours / 24);
        if (st.giftDay !== day) { st.giftDay = day; st.giftsToday = 0; }
        st.giftsToday += 1;
        st.gifts += 1;
        st.lastGiftAt = state.hours;
        const diff = addValue(state, id, info.value, '送礼物');
        PlayerManager.addMorale(state, 1);
        state.stats.gifts += 1;
        Actions.spend(state, 'gift');
        return { ok: true, value: diff, msg: '送出了 ' + c.gift.res + ' ' + c.gift.amount + '，' + c.name + ' 好感 +' + diff };
    }

    /* 结算羁绊浮窗（相遇 / 关键节点） */
    function resolve(state, choiceIndex) {
        const p = state.pending;
        if (!p || p.type !== 'bond') return { ok: false, msg: '现在没有待处理的事。' };
        const c = cfg(p.id);
        if (!c) { state.pending = null; return { ok: false, msg: '数据丢了。' }; }
        const block = p.stage === 'meet' ? c.meet : c.crossroad;
        const ch = block && block.choices ? block.choices[choiceIndex] : null;
        if (!ch) return { ok: false, msg: '没有这个选项。' };
        const st = get(state, p.id);
        if (!st) { state.pending = null; return { ok: false, msg: '数据丢了。' }; }
        if (ch.value === undefined && ch.result === undefined && !ch.cost && !ch.gain) {
            /* 允许只有文案的选项 */
        }
        const res = EventEngine.applyChoice(state, ch, { bondId: p.id });
        if (!res.ok) return res;
        if (p.stage === 'crossroad') st.flag.crossroadDone = true;
        if (res.action === 'awaken') return res;
        state.pending = null;
        return res;
    }

    function listMet(state) {
        return BONDS_CONFIG.filter(c => get(state, c.id).met);
    }

    function assistText(state, id) {
        const c = cfg(id);
        if (!c || !c.assist) return '';
        return c.assist.desc || '';
    }

    window.BondEngine = {
        cfg, get, markMet, setOutcome, addValue, assistActive, tryMeet, present,
        crossroadReady, tick, giftInfo, gift, resolve, listMet, assistText, phaseOk,
    };
})();

</script>
<script>
/* ===== js/engine/build.js ===== */
/* 建设：设施升级与据点迁移 */
(function () {
    /* 迁移时搬不走的设施（防御工事），会按投入返还一半材料 */
    const DEFENSE_FACILITIES = ['doorReinforce', 'fence', 'wall', 'tower', 'traps', 'armory'];

    function baseOf(state) {
        return BASES_CONFIG.find(b => b.id === state.base.id) || BASES_CONFIG[0];
    }

    function tierAllowed(state, id) {
        const cfg = FACILITIES_CONFIG[id];
        const base = baseOf(state);
        return base.tiers.indexOf(cfg.tier) >= 0;
    }

    function reqMet(state, id, targetLevel) {
        for (const r of reqListFor(id, targetLevel)) {
            const cur = state.facilities[r[0]] ? state.facilities[r[0]].level : 0;
            if (cur < r[1]) return false;
        }
        return true;
    }

    function reqText(id) {
        const cfg = FACILITIES_CONFIG[id];
        if (!cfg.req) return '';
        return cfg.req.map(r => (FACILITIES_CONFIG[r[0]] ? FACILITIES_CONFIG[r[0]].name : r[0]) + ' Lv' + r[1]).join('、');
    }

    /* 升到某一级要满足的前置：cfg.req 是一直有效的基础前置，
       cfg.reqAt 是「升到某一级之后追加的前置」—— 越往上越苛刻靠它。 */
    function reqListFor(id, targetLevel) {
        const cfg = FACILITIES_CONFIG[id];
        const need = (cfg.req || []).slice();
        for (const r of (cfg.reqAt || [])) {
            if ((targetLevel || 1) >= r.level) for (const q of r.req) need.push(q);
        }
        return need;
    }

    function reqTextFor(id, targetLevel) {
        const need = reqListFor(id, targetLevel);
        if (!need.length) return '';
        return need.map(r => (FACILITIES_CONFIG[r[0]] ? FACILITIES_CONFIG[r[0]].name : r[0]) + ' Lv' + r[1]).join('、');
    }

    function costFor(state, id, level) {
        const cfg = FACILITIES_CONFIG[id];
        const raw = (cfg.cost && cfg.cost(level)) || {};
        const e = EffectsManager.get(state);
        const k = Math.max(0.3, 1 + (e.buildCost || 0));
        const out = {};
        for (const r in raw) out[r] = Math.max(1, Math.round(raw[r] * k));
        return out;
    }

    function status(state, id) {
        const cfg = FACILITIES_CONFIG[id];
        const rec = state.facilities[id];
        const target = rec.level + 1;
        const out = {
            id: id, cfg: cfg, level: rec.level, max: cfg.maxLevel,
            tierAllowed: tierAllowed(state, id), reqOk: reqMet(state, id, target), target: target,
            cost: null, can: false, reason: '', maxed: rec.level >= cfg.maxLevel,
        };
        if (!out.tierAllowed) {
            out.reason = '这是 ' + cfg.tier + ' 级设施，需要更大的据点';
            return out;
        }
        if (out.maxed) { out.reason = '已经满级'; return out; }
        if (!out.reqOk) { out.reason = '升到 Lv' + target + ' 需要先有：' + reqTextFor(id, target); return out; }
        out.cost = costFor(state, id, target);
        out.can = ResourcesManager.canAfford(out.cost, state);
        if (!out.can) out.reason = '还差 ' + EventEngine.gainText(ResourcesManager.missing(out.cost, state));
        return out;
    }

    function build(state, id) {
        const st = status(state, id);
        if (st.maxed) return { ok: false, msg: '「' + st.cfg.name + '」已经满级了。' };
        if (!st.tierAllowed) return { ok: false, msg: st.reason };
        if (!st.reqOk) return { ok: false, msg: st.reason };
        if (!st.can) return { ok: false, msg: '物资不够，' + st.reason };
        ResourcesManager.spend(st.cost, state);
        state.facilities[id].level += 1;
        state.facilities[id].visible = true;
        EffectsManager.refreshAllEffects(state);
        ProductionEngine.computeProduction(state);
        EventEngine.addLog(state, '🏗️ 「' + st.cfg.name + '」升到 Lv' + state.facilities[id].level + '。');
        Actions.spend(state, 'build');
        AchievementEngine.check(state);
        return { ok: true, msg: '「' + st.cfg.name + '」Lv' + state.facilities[id].level };
    }

    /* 事件 / 剧情赠送的免费升级 */
    function freeLevel(state, id, n) {
        const rec = state.facilities[id];
        const cfg = FACILITIES_CONFIG[id];
        if (!rec || !cfg) return { ok: false, name: '' };
        const before = rec.level;
        rec.level = Math.min(cfg.maxLevel, rec.level + (n || 1));
        rec.visible = true;
        if (rec.level === before) return { ok: false, name: cfg.name };
        EffectsManager.refreshAllEffects(state);
        ProductionEngine.computeProduction(state);
        return { ok: true, name: cfg.name };
    }

    function listFor(state) {
        return FACILITIES_ORDER.map(id => status(state, id));
    }

    function counts(state) {
        let built = 0, defense = 0;
        for (const id in state.facilities) {
            const lv = state.facilities[id].level;
            if (!lv) continue;
            built += 1;
            if (DEFENSE_FACILITIES.indexOf(id) >= 0) defense += lv;
        }
        return { built: built, defenseLevels: defense };
    }

    /* ---------------- 据点迁移 ---------------- */
    function moveStatus(state, id) {
        const cfg = BASES_CONFIG.find(b => b.id === id);
        if (!cfg) return { ok: false, reason: '没有这个据点。', cfg: null };
        if (cfg.id === state.base.id) return { ok: false, reason: '已经在这里了。', cfg: cfg };
        const reasons = [];
        if (cfg.req) {
            if (cfg.req.hours && state.hours < cfg.req.hours) reasons.push('需要存活 ' + Utils.fmtHours(cfg.req.hours));
            if (cfg.req.raidsWon && state.raid.wins < cfg.req.raidsWon) reasons.push('需要守住 ' + cfg.req.raidsWon + ' 次恶性事件');
            if (cfg.req.rebirth && state.rebirth.count < cfg.req.rebirth) reasons.push('需要重生 ' + cfg.req.rebirth + ' 次');
        }
        if (cfg.moveCost && !ResourcesManager.canAfford(cfg.moveCost, state)) {
            reasons.push('还差 ' + EventEngine.gainText(ResourcesManager.missing(cfg.moveCost, state)));
        }
        return { ok: reasons.length === 0, reason: reasons.join('；'), cfg: cfg };
    }

    /* 防御工事的投入（返还一半用） */
    function refundOf(state) {
        const refund = {};
        for (const id of DEFENSE_FACILITIES) {
            const lv = state.facilities[id] ? state.facilities[id].level : 0;
            const cfg = FACILITIES_CONFIG[id];
            for (let l = 1; l <= lv; l++) {
                const c = (cfg.cost && cfg.cost(l)) || {};
                for (const r in c) refund[r] = (refund[r] || 0) + c[r] * 0.5;
            }
        }
        const out = {};
        for (const r in refund) out[r] = Math.round(refund[r]);
        return out;
    }

    function move(state, id) {
        const st = moveStatus(state, id);
        if (!st.ok) return { ok: false, msg: st.reason };
        const cfg = st.cfg;
        if (cfg.moveCost) ResourcesManager.spend(cfg.moveCost, state);
        const refund = refundOf(state);
        const oldBase = baseOf(state);
        state.base.id = cfg.id;
        state.base.moved += 1;
        /* 防御工事搬不走：等级清零，返还一半材料（界面里提前写明，不做突然的永久损失） */
        for (const fid of DEFENSE_FACILITIES) state.facilities[fid].level = 0;
        const added = ResourcesManager.add(refund, state);
        EffectsManager.refreshAllEffects(state);
        ProductionEngine.computeProduction(state);
        EventEngine.addLog(state, '🚚 据点迁往「' + cfg.name + '」（从「' + oldBase.name + '」）。防御工事重建，返还 ' +
            EventEngine.gainText(added));
        AchievementEngine.check(state);
        return { ok: true, msg: '已迁往「' + cfg.name + '」', refund: added };
    }

    window.BuildEngine = {
        DEFENSE_FACILITIES, baseOf, tierAllowed, reqMet, reqText, reqListFor, reqTextFor, costFor, status,
        build, freeLevel, listFor, counts, moveStatus, move, refundOf,
    };
})();

</script>
<script>
/* ===== js/engine/defense.js ===== */
/* 防线：恶性事件的排期、预警、结算（守不住就直接触发重生） */
(function () {
    function warningHours(state) {
        return Math.max(2, 4 + EffectsManager.additive(state, 'warning'));
    }

    function strength(state) {
        const doom = DOOMS_CONFIG[state.doom] || {};
        const apoc = Math.max(0, state.hours - PHASES_CONFIG[1].start);
        /* 乘数型成长一定要递减（避坑清单第 3 节）：用 sqrt。
           apoc / 6 意味着 200 小时之后，只加固门窗的据点已经顶不住了 —— 逼玩家修工事、换大据点。 */
        const timeFactor = 1 + Math.sqrt(apoc / 6);
        const rebirthFactor = 1 + state.rebirth.count * 0.28;
        const base = BuildEngine.baseOf(state);
        let s = 14 * (doom.raidPower || 1) * timeFactor * rebirthFactor * (1 + (base.raidPower || 0));
        s *= (1 + EffectsManager.additive(state, 'raidPower'));
        s *= MoneyEngine.raidMultiplier(state);      // 仇家越多，来的越狠
        return Math.max(5, Math.round(s));
    }

    /* 仇家攒够了，袭击就不再是「末日里的事」，而是有人专门来清算 */
    function raidName(state) {
        const doom = DOOMS_CONFIG[state.doom] || {};
        if (state.heat >= HEAT_RULES.raidAt) return '仇家清算';
        return doom.raidName || '恶性事件';
    }

    function schedule(state) {
        const rate = Math.max(-0.5, EffectsManager.additive(state, 'raidRate'));
        let interval = Math.max(6, 30 - state.hours / 60);
        interval *= (1 + rate);
        /* 第一场袭击不会早于爆发阶段的第 18 小时（重生之后也一样） */
        const earliest = PHASES_CONFIG[1].start + 18;
        state.raid.nextAt = Math.max(state.hours + Math.max(5, interval), earliest);
        state.raid.warned = false;
    }

    function inWarning(state) {
        if (!PhaseManager.isAtLeast(state, 'outbreak')) return false;
        if (!state.raid.nextAt) return false;
        return state.hours >= state.raid.nextAt - warningHours(state);
    }

    function info(state) {
        const def = PlayerManager.defense(state);
        const str = strength(state);
        const doom = DOOMS_CONFIG[state.doom] || {};
        let verdict = '危险';
        if (def >= str * 1.3) verdict = '稳';
        else if (def >= str) verdict = '勉强能守';
        return {
            nextAt: state.raid.nextAt,
            etaHours: Math.max(0, (state.raid.nextAt || 0) - state.hours),
            warning: warningHours(state),
            inWarning: inWarning(state),
            strength: str,
            defense: def,
            ratio: def / Math.max(1, str),
            verdict: verdict,
            doomName: raidName(state),
            heat: state.heat,
            active: PhaseManager.isAtLeast(state, 'outbreak'),
        };
    }

    function tick(state) {
        if (!PhaseManager.isAtLeast(state, 'outbreak')) return;
        if (!state.raid.nextAt) { schedule(state); return; }
        if (!state.raid.warned && inWarning(state)) {
            state.raid.warned = true;
            StoryEngine.trigger(state, 'firstRaid');
            EventEngine.addLog(state, '🚨 预警：「' + info(state).doomName + '」大约还有 ' +
                Utils.fmtCountdown(Math.max(0, state.raid.nextAt - state.hours)) + ' 就到了。');
        }
        if (state.hours < state.raid.nextAt) return;
        resolve(state);
    }

    function resolve(state) {
        const def = PlayerManager.defense(state);
        const str = strength(state);
        const rec = {
            hours: state.hours, name: raidName(state),
            strength: str, defense: def, win: def >= str, doom: state.doom,
        };
        state.raid.count += 1;
        if (def >= str) {
            state.raid.wins += 1;
            state.stats.raidsWon += 1;
            PlayerManager.addMorale(state, 6);
            const crystal = PlayerManager.addCrystal(state, 6 + Math.floor(str / 30), '守住「' + rec.name + '」');
            const loot = ResourcesManager.add({
                '弹药': Math.round(2 + str / 25),
                '食物': Math.round(4 + str / 20),
            }, state);
            rec.crystal = crystal;
            EventEngine.addLog(state, '🛡️ 守住了「' + rec.name + '」（防御 ' + def + ' vs 强度 ' + str + '）' +
                (Object.keys(loot).length ? '，缴获 ' + EventEngine.gainText(loot) : ''));
            if (window.UI && UI.toast) UI.toast('🛡️ 守住了：' + rec.name, 'gold');
        } else {
            state.raid.losses += 1;
            state.stats.raidsLost += 1;
            rec.lost = true;
            EventEngine.addLog(state, '💀 「' + rec.name + '」没能守住（防御 ' + def + ' vs 强度 ' + str + '）。');
            state.raid.history.unshift(rec);
            if (state.raid.history.length > 20) state.raid.history.length = 20;
            RebirthEngine.onDefeat(state, rec);
            schedule(state);
            AchievementEngine.check(state);
            return rec;
        }
        state.raid.history.unshift(rec);
        if (state.raid.history.length > 20) state.raid.history.length = 20;
        schedule(state);
        AchievementEngine.check(state);
        return rec;
    }

    window.DefenseEngine = { strength, schedule, tick, resolve, info, warningHours, inWarning, raidName };
})();

</script>
<script>
/* ===== js/engine/achievements.js ===== */
/* 成就：每达成一个给异能结晶（结晶跨重生保留，所以成就只会拿一次） */
(function () {
    const failed = {};

    function check(state, silent) {
        let got = 0;
        for (const a of ACHIEVEMENTS_CONFIG) {
            if (state.achievements[a.id]) continue;
            let ok = false;
            try { ok = !!a.cond(state); }
            catch (e) {
                if (!failed[a.id]) {
                    failed[a.id] = 1;
                    console.error('[成就条件] ' + a.id + ' 出错：', e);
                }
            }
            if (!ok) continue;
            state.achievements[a.id] = true;
            if (a.effect) EffectsManager.refreshAllEffects(state);
            const g = PlayerManager.addCrystal(state, a.crystal || 0, '成就·' + a.name);
            EventEngine.addLog(state, '🏆 成就达成：' + a.name + (g ? '（异能结晶 +' + g + '）' : ''));
            if (!silent && window.UI && UI.toast) UI.toast('🏆 成就：' + a.name, 'gold');
            got += 1;
        }
        return got;
    }

    function count(state) {
        let n = 0;
        for (const a of ACHIEVEMENTS_CONFIG) if (state.achievements[a.id]) n++;
        return n;
    }

    function list(state) {
        return ACHIEVEMENTS_CONFIG.map(a => ({ cfg: a, done: !!state.achievements[a.id] }));
    }

    window.AchievementEngine = { check, count, list };
})();

</script>
<script>
/* ===== js/engine/story.js ===== */
/* 主线剧情：什么时候弹、选项怎么走 */
(function () {
    function seen(state, id) { return !!state.story.seen[id]; }

    function present(state, id) {
        const cfg = STORY_CONFIG[id];
        if (!cfg) return false;
        if (cfg.once && seen(state, id)) return false;
        if (state.pending) return false;
        state.story.seen[id] = true;
        state.story.current = id;
        state.pending = { type: 'story', id: id };
        return true;
    }

    function trigger(state, id) { return present(state, id); }

    function tick(state) {
        if (state.pending) return;
        for (const id in STORY_CONFIG) {
            const cfg = STORY_CONFIG[id];
            if (cfg.trigger !== 'hours') continue;
            if (cfg.once && seen(state, id)) continue;
            if (cfg.phase && !BondEngine.phaseOk(state, cfg.phase)) continue;
            if (state.hours >= cfg.at) { present(state, id); return; }
        }
        if (PhaseManager.isAtLeast(state, 'apocalypse')) {
            if (present(state, 'apocalypse')) return;
            present(state, 'rebirthIntro');
        }
    }

    function resolve(state, choiceIndex) {
        const p = state.pending;
        if (!p || p.type !== 'story') return { ok: false, msg: '现在没有待处理的剧情。' };
        const cfg = STORY_CONFIG[p.id];
        if (!cfg) { state.pending = null; return { ok: false, msg: '剧情数据丢了。' }; }
        const ch = cfg.choices[choiceIndex];
        if (!ch) return { ok: false, msg: '没有这个选项。' };
        const res = EventEngine.applyChoice(state, ch, {});
        if (!res.ok) return res;
        state.story.current = null;
        if (res.action === 'awaken') return res;
        state.pending = null;
        return res;
    }

    function startNewGame(state) {
        return present(state, 'prologue');
    }

    function cfgText(id) {
        const cfg = STORY_CONFIG[id];
        return cfg ? cfg.title : '';
    }

    window.StoryEngine = { present, trigger, tick, resolve, startNewGame, seen, cfgText };
})();

</script>
<script>
/* ===== js/engine/rebirth.js ===== */
/* 重生：什么时候能重开、能拿多少重生点、保留什么、重生商店 */
(function () {
    function available(state) {
        return PhaseManager.isAtLeast(state, 'apocalypse');
    }

    function breakdown(state) {
        const e = EffectsManager.get(state);
        const days = state.hours / 24;
        let achieved = 0;
        for (const a of ACHIEVEMENTS_CONFIG) if (state.achievements[a.id]) achieved++;
        const base = BuildEngine.baseOf(state);
        const companions = PlayerManager.companionCount(state);
        const rows = [
            { label: '生存时长（' + days.toFixed(1) + ' 天）', value: Math.pow(Math.max(0, days), 0.75) * 1.6 },
            { label: '成就（' + achieved + ' 个）', value: achieved / 4 },
            { label: '据点等级（' + base.name + '）', value: (base.tier - 1) * 3 },
            { label: '羁绊（' + companions + ' 人）', value: companions * 0.8 },
            { label: '守住的袭击（' + state.raid.wins + ' 次）', value: state.raid.wins * 1.2 },
            { label: '空间异能（Lv' + state.space.level + '）', value: state.space.level * 1.2 },
        ];
        let total = 0;
        for (const r of rows) total += r.value;
        const mult = 1 + (e.rebirthGain || 0);
        return { rows: rows, total: total, mult: mult, points: Math.max(1, Math.floor(total * mult)) };
    }

    function pointsGain(state) { return breakdown(state).points; }

    /* ---------------- 商店 ---------------- */
    function shopStatus(state, item) {
        const lv = state.rebirth.shop[item.id] || 0;
        const maxed = lv >= item.maxLevel;
        const cost = maxed ? null : item.cost(lv + 1);
        return {
            id: item.id, item: item, level: lv, max: item.maxLevel, maxed: maxed, cost: cost,
            can: !maxed && state.rebirth.points >= cost,
        };
    }

    function buy(state, id) {
        const item = REBIRTH_SHOP.find(x => x.id === id);
        if (!item) return { ok: false, msg: '没有这一项。' };
        const st = shopStatus(state, item);
        if (st.maxed) return { ok: false, msg: '「' + item.name + '」已经满级了。' };
        if (!st.can) return { ok: false, msg: '重生点不够，还差 ' + Math.ceil(st.cost - state.rebirth.points) + ' 点。' };
        state.rebirth.points -= st.cost;
        state.rebirth.shop[id] = st.level + 1;
        EffectsManager.refreshAllEffects(state);
        ProductionEngine.computeProduction(state);
        EventEngine.addLog(state, '🔁 重生商店：' + item.name + ' Lv' + (st.level + 1));
        return { ok: true, msg: item.name + ' Lv' + (st.level + 1) };
    }

    function newDoom(state, avoid) {
        const ids = Object.keys(DOOMS_CONFIG).filter(d => d !== avoid);
        return ids.length ? Utils.pick(ids) : avoid;
    }

    /* 一轮重来：只有空间异能（等级 / 技能 / 结晶）、重生点与商店、成就、统计、设置跟着走 */
    function resetRun(state, opts) {
        const keep = {
            space: Utils.deepClone(state.space),
            rebirth: state.rebirth,
            achievements: state.achievements,
            stats: state.stats,
            settings: state.settings,
            flags: state.flags,
            storySeen: state.story.seen,
            raidHistory: state.raid.history,
            ability: Utils.deepClone(state.ability),
        };
        const byDoom = Utils.deepClone(state.rebirth.byDoom);

        initState();

        state.space = keep.space;
        state.rebirth = keep.rebirth;
        state.achievements = keep.achievements;
        state.stats = keep.stats;
        state.settings = keep.settings;
        state.flags = keep.flags;
        state.story.seen = keep.storySeen;
        state.raid.history = keep.raidHistory;
        state.rebirth.byDoom = byDoom;
        state.doom = opts.doom;
        state.rebirth.byDoom[opts.doom] = (state.rebirth.byDoom[opts.doom] || 0) + 1;
        state.raid.nextAt = PHASES_CONFIG[1].start + 18;
        state.speed = state.settings.speed || 1;

        if (opts.keepAbility) {
            state.ability = keep.ability;
            state.ability.awakened = true;
        }
        /* 先知准备：开局自带物资 */
        const prepared = state.rebirth.shop.prepared || 0;
        if (prepared) {
            const item = REBIRTH_SHOP.find(x => x.id === 'prepared');
            if (item && item.gift) ResourcesManager.add(item.gift(prepared), state);
        }
        EffectsManager.refreshAllEffects(state);
        ProductionEngine.computeProduction(state);
        return state;
    }

    function perform(state, reason) {
        if (!available(state) && reason !== 'defeat') {
            return { ok: false, msg: '重生要等到末日阶段才会开启。' };
        }
        const report = breakdown(state);
        const oldDoom = state.doom;
        const oldHours = state.hours;
        const oldBase = BuildEngine.baseOf(state).name;
        const keepAbility = (state.rebirth.shop.memoryCore || 0) > 0 && !!state.ability.id;

        state.rebirth.count += 1;
        state.rebirth.points += report.points;
        state.rebirth.total += report.points;
        if (!state.rebirth.byDoom[oldDoom]) state.rebirth.byDoom[oldDoom] = 1;

        const nextDoom = newDoom(state, oldDoom);
        resetRun(state, { doom: nextDoom, keepAbility: keepAbility });
        state.rebirth.lastReport = {
            reason: reason || 'manual',
            gain: report.points,
            rows: report.rows,
            mult: report.mult,
            oldDoom: oldDoom,
            newDoom: nextDoom,
            oldHours: oldHours,
            oldBase: oldBase,
            keepAbility: keepAbility,
        };
        state.pending = { type: 'rebirthReport', reason: reason || 'manual' };
        EventEngine.addLog(state, '🔁 重生：重生点 +' + report.points + '，新的末日是「' +
            DOOMS_CONFIG[nextDoom].name + '」。');
        if (window.UI && UI.toast) UI.toast('🔁 重生成功：重生点 +' + report.points, 'gold');
        AchievementEngine.check(state);
        return { ok: true, msg: '重生完成', report: state.rebirth.lastReport };
    }

    function onDefeat(state, rec) {
        const r = perform(state, 'defeat');
        if (state.rebirth.lastReport) state.rebirth.lastReport.defeat = rec;
        return r;
    }

    window.RebirthEngine = {
        available, breakdown, pointsGain, shopStatus, buy, perform, onDefeat, resetRun, newDoom,
    };
})();

</script>
<script>
/* ===== js/engine/actions.js ===== */
/* 统一动作：自动化推进、丢弃资源、速度设置 */
(function () {
    const AUTO_BUILD_ORDER = [
        'wall', 'tower', 'traps', 'doorReinforce', 'fence', 'farm', 'purifier', 'planter',
        'waterTank', 'generator', 'clinic', 'dorm', 'workshop', 'greenhouse', 'radar',
        'armory', 'powerStation', 'solarPanel', 'storeroom', 'medkit', 'toolbox', 'camera',
    ];

    /* 行动耗时：只在末日前那一阶段花时间（回合制）。
       爆发之后时间本来就在自己走，再额外扣时间就变成双重计时了。 */
    function actionCost(state, kind) {
        if (PhaseManager.id(state) !== 'pre') return 0;
        const c = ACTION_COSTS[kind];
        return typeof c === 'number' ? c : 0;
    }

    /* 花掉这次行动的时间，并让世界跟着走一格 */
    function spend(state, kind) {
        const hours = actionCost(state, kind);
        if (hours > 0) GameLoop.passTime(hours);
        return hours;
    }

    function autoBuild(state) {
        if (state.hours < (state.autoBuildAt || 0)) return 0;
        state.autoBuildAt = state.hours + 1.5;
        for (const id of AUTO_BUILD_ORDER) {
            const st = BuildEngine.status(state, id);
            if (!st.can) continue;
            BuildEngine.build(state, id);
            return 1;
        }
        return 0;
    }

    function autoStep(state) {
        if (state.paused) return;
        const e = EffectsManager.get(state);
        if (e.specials.autoBuild && state.settings.autoBuild) autoBuild(state);
        ScavengeEngine.autoStep(state);
    }

    function discard(state, name, amount) {
        const took = ResourcesManager.discard(state, name, amount);
        if (took > 0) {
            EventEngine.addLog(state, '🗑️ 丢掉了 ' + name + ' ' + Utils.fmtInt(took) + '。');
            PlayerManager.addMorale(state, -0.5);
        }
        return took;
    }

    function discardAll(state, name) {
        return discard(state, name, undefined);
    }

    function setSpeed(state, v) {
        state.speed = Utils.clamp(Number(v) || 1, 1, 4);
        state.settings.speed = state.speed;
        return state.speed;
    }

    window.Actions = { autoStep, autoBuild, discard, discardAll, setSpeed, actionCost, spend };
})();

</script>
<script>
/* ===== js/engine/save.js ===== */
/* 存档：localStorage、导入导出、离线结算、版本迁移（迁移必须幂等） */
(function () {
    const SAVE_KEY = 'echoes-of-doom-save';
    const LEGACY_SAVE_KEYS = [];
    const RESET_MARK = 'echoes-of-doom-just-reset';
    /* 清档之后要立刻重载页面，而重载会触发 beforeunload —— 那里的自动保存
       会把内存里的旧进度又写回来（等于删完就长回来）。这个开关用来按住它。 */
    let suspended = false;

    function readRaw() {
        try {
            const cur = localStorage.getItem(SAVE_KEY);
            if (cur) return { raw: cur, key: SAVE_KEY };
        } catch (e) { /* 忽略 */ }
        for (const k of LEGACY_SAVE_KEYS) {
            try {
                const old = localStorage.getItem(k);
                if (old) return { raw: old, key: k };
            } catch (e) { /* 忽略 */ }
        }
        return null;
    }

    function serialize(state) {
        const data = {};
        for (const k in state) {
            if (k === 'effects') continue;
            data[k] = state[k];
        }
        data.lastSave = Date.now();
        return JSON.stringify(data);
    }

    function save(state) {
        if (suspended && !window.__DOOM_TEST_IGNORE_SUSPEND) return false;
        try {
            localStorage.setItem(SAVE_KEY, serialize(state));
            state.lastSave = Date.now();
            return true;
        } catch (e) {
            console.warn('保存失败', e);
            return false;
        }
    }

    function hasSave() { return !!readRaw(); }

    /* ---------------------------------------------------------
       迁移：把旧结构升到当前 SAVE_VERSION。
       规则（避坑清单 1.3）：
       1) 每个迁移只做一件事，并且必须幂等 —— 连续跑两次结果一致，
          不能重复发奖励、重复扣材料。
       2) 迁移完必须做一次「补齐缺失字段」，新加的配置项对老档自动生效。
       3) 影响老档进度的迁移要写进 CHANGELOG。
       --------------------------------------------------------- */
    const MIGRATIONS = {
        /* 1: 首个公开版本，没有历史结构需要迁移。
              留一个显式的空实现，后续版本往这里加 2、3、…… */
    };

    function runMigrations(data) {
        const from = typeof data.version === 'number' ? data.version : 0;
        const notes = [];
        for (let v = from + 1; v <= SAVE_VERSION; v++) {
            const fn = MIGRATIONS[v];
            if (typeof fn === 'function') {
                fn(data);
                notes.push(v);
            }
        }
        data.version = SAVE_VERSION;
        return notes;
    }

    /* 把配置里新出现的东西补进存档（幂等；漏掉就会变成「界面里没有这一项」） */
    function ensureShape(state) {
        if (!state.space) state.space = freshSpace();
        if (!state.space.skills) state.space.skills = {};
        if (typeof state.space.level !== 'number') state.space.level = 1;
        if (typeof state.space.crystals !== 'number') state.space.crystals = 0;
        if (typeof state.space.totalCrystals !== 'number') state.space.totalCrystals = state.space.crystals;
        if (!state.ability) state.ability = freshAbility();
        if (!Array.isArray(state.ability.history)) state.ability.history = [];
        if (typeof state.ability.draws !== 'number') state.ability.draws = 0;
        if (typeof state.ability.rolls !== 'number') state.ability.rolls = state.ability.draws;
        if (typeof state.ability.pity !== 'number') state.ability.pity = 0;
        if (typeof state.ability.awakened !== 'boolean') state.ability.awakened = !!state.ability.id;
        if (!state.base) state.base = freshBase();
        if (!state.raid) state.raid = freshRaid();
        if (!Array.isArray(state.raid.history)) state.raid.history = [];
        if (!state.story) state.story = freshStory();
        if (!state.story.seen) state.story.seen = {};
        if (!Array.isArray(state.story.queue)) state.story.queue = [];
        if (typeof state.story.revenge !== 'number') state.story.revenge = 0;
        if (!state.rebirth) state.rebirth = freshRebirth();
        if (!state.rebirth.shop) state.rebirth.shop = {};
        if (!state.rebirth.byDoom) state.rebirth.byDoom = {};
        if (typeof state.rebirth.count !== 'number') state.rebirth.count = 0;
        if (typeof state.rebirth.points !== 'number') state.rebirth.points = 0;
        if (typeof state.rebirth.total !== 'number') state.rebirth.total = state.rebirth.points;
        if (!state.events) state.events = { pending: null, nextAt: 6, count: 0, lastAt: 0 };
        if (state.pending === undefined) state.pending = null;
        if (state.encounter === undefined) state.encounter = null;
        if (typeof state.heat !== 'number') state.heat = 0;
        if (typeof state.heatCoolAt !== 'number') state.heatCoolAt = state.hours + 24;
        if (!Array.isArray(state.tempEffects)) state.tempEffects = [];
        if (!Array.isArray(state.logs)) state.logs = [];
        if (!state.flags) state.flags = {};
        if (typeof state.morale !== 'number') state.morale = 60;
        if (typeof state.hours !== 'number') state.hours = 0;
        if (!DOOMS_CONFIG[state.doom]) state.doom = pickDoom();
        if (!state.stats) state.stats = freshStats();
        for (const k in freshStats()) if (state.stats[k] === undefined) state.stats[k] = freshStats()[k];
        if (!state.stats.scavengesByLocation) state.stats.scavengesByLocation = {};
        if (!state.settings) state.settings = freshSettings();
        for (const k in freshSettings()) if (state.settings[k] === undefined) state.settings[k] = freshSettings()[k];

        for (const k in RESOURCES_CONFIG) {
            if (!state.resources[k]) state.resources[k] = { amount: 0, visible: false };
            if (typeof state.resources[k].visible !== 'boolean') {
                state.resources[k].visible = state.resources[k].amount > 0;
            }
        }
        for (const loc of LOCATIONS_CONFIG) {
            if (!state.locations[loc.id]) state.locations[loc.id] = { uses: 0, at: 0, seen: false, total: 0, hidden: false };
            const l = state.locations[loc.id];
            if (typeof l.total !== 'number') l.total = 0;
            if (typeof l.hidden !== 'boolean') l.hidden = false;
        }
        for (const id of FACILITIES_ORDER) {
            if (!state.facilities[id]) state.facilities[id] = { level: 0, visible: false };
            if (typeof state.facilities[id].level !== 'number') state.facilities[id].level = 0;
        }
        for (const b of BONDS_CONFIG) {
            if (!state.bonds[b.id]) state.bonds[b.id] = { met: false, value: 0, outcome: null, gifts: 0, lastGiftAt: -999, stage: 0, flag: {} };
            const st = state.bonds[b.id];
            if (!st.flag) st.flag = {};
            if (typeof st.gifts !== 'number') st.gifts = 0;
            if (typeof st.lastGiftAt !== 'number') st.lastGiftAt = -999;
        }
        for (const a of ACHIEVEMENTS_CONFIG) {
            if (typeof state.achievements[a.id] !== 'boolean') state.achievements[a.id] = false;
        }
        for (const it of REBIRTH_SHOP) {
            if (typeof state.rebirth.shop[it.id] !== 'number') state.rebirth.shop[it.id] = 0;
        }
        return state;
    }

    function applyData(state, data) {
        initState();
        runMigrations(data);
        for (const k in data) {
            if (k === 'effects') continue;
            state[k] = data[k];
        }
        ensureShape(state);
        ProductionEngine.computeProduction(state);
        EffectsManager.refreshAllEffects(state);
        AchievementEngine.check(state, true);
        return state;
    }

    function load(state) {
        const found = readRaw();
        if (!found) return false;
        try {
            const data = JSON.parse(found.raw);
            if (!data || typeof data !== 'object') return false;
            const seconds = data.lastTick ? Math.max(0, (Date.now() - data.lastTick) / 1000) : 0;
            applyData(state, data);
            state.story.current = null;
            state.pending = null;
            state.encounter = null;
            if (seconds > 60) applyOffline(state, seconds);
            state.lastTick = Date.now();
            if (found.key !== SAVE_KEY) {
                save(state);
                try { localStorage.removeItem(found.key); } catch (e) { /* 忽略 */ }
            }
            return true;
        } catch (e) {
            console.error('读档失败', e);
            return false;
        }
    }

    /* 离线结算：设施照常产出（有上限），恶性事件不结算 —— 免得回来就发现据点没了 */
    function applyOffline(state, seconds) {
        /* 末日前是回合制：你不在的时候那三天不会自己往前走，也就没有离线收益 */
        if (PhaseManager.id(state) === 'pre') { state.offlineReport = null; return null; }
        const maxSec = (2 + EffectsManager.additive(state, 'offlineHours')) * 3600;
        const capped = Math.min(seconds, maxSec);
        if (capped < 60) return null;
        const gameHours = capped * (window.HOURS_PER_SECOND || 0.05) * (state.speed || 1);
        const factor = EffectsManager.hasSpecial(state, 'offlinePerfect') ? 1 : 0.6;
        const before = {};
        for (const k in state.resources) before[k] = state.resources[k].amount;
        ProductionEngine.advance(state, gameHours * factor, true);
        const gains = {};
        for (const k in state.resources) {
            const d = state.resources[k].amount - (before[k] || 0);
            if (d > 1e-6) gains[k] = d;
        }
        state.offlineReport = {
            seconds: capped, realSeconds: seconds, hours: gameHours * factor,
            factor: factor, gains: gains,
        };
        EventEngine.addLog(state, '🌙 离线 ' + Utils.fmtHours(gameHours) +
            '（效率 ' + Math.round(factor * 100) + '%）');
        return state.offlineReport;
    }

    function exportSave(state) {
        const json = serialize(state);
        try { return btoa(unescape(encodeURIComponent(json))); }
        catch (e) { return json; }
    }

    function importSave(state, text) {
        text = (text || '').trim();
        if (!text) return { ok: false, msg: '存档内容为空。' };
        let json = text;
        if (text[0] !== '{') {
            try { json = decodeURIComponent(escape(atob(text))); }
            catch (e) { return { ok: false, msg: '无法解析这段存档文本。' }; }
        }
        try {
            const data = JSON.parse(json);
            applyData(state, data);
            state.lastTick = Date.now();
            state.offlineReport = null;
            save(state);
            return { ok: true, msg: '存档导入成功。' };
        } catch (e) {
            return { ok: false, msg: '存档格式错误。' };
        }
    }

    function hardReset() {
        clearStorage();
        location.reload();
    }

    /* 真正把存档抹掉（不发重载，方便自检单独调用）：
       1) 先挂起保存，2) 删键，3) 留一个「刚清过档」的临时标记给刷新后的页面用 */
    function clearStorage() {
        suspended = true;
        try {
            /* __DOOM_TEST_IGNORE_SUSPEND 是给自检留的「拆掉守卫」开关（平时没人设置它）：
               用来验证 tools/check-reset.ps1 真的能抓到这个 bug —— 见 tools/check-reset.ps1 -UrlHash '#prefixbug' */
            if (typeof GameState !== 'undefined' && GameState.settings && !window.__DOOM_TEST_IGNORE_SUSPEND) {
                GameState.settings.autosave = false;
            }
            localStorage.removeItem(SAVE_KEY);
            for (const k of LEGACY_SAVE_KEYS) localStorage.removeItem(k);
        } catch (e) { /* 忽略 */ }
        try { sessionStorage.setItem(RESET_MARK, '1'); } catch (e) { /* 忽略 */ }
    }

    /* 刷新后的第一件事：看看上一页是不是刚清过档（是的话给玩家一句明确的反馈） */
    function consumeResetMark() {
        let hit = false;
        try {
            hit = sessionStorage.getItem(RESET_MARK) === '1';
            if (hit) sessionStorage.removeItem(RESET_MARK);
        } catch (e) { /* 忽略 */ }
        return hit;
    }

    window.SaveEngine = {
        save, load, hasSave, exportSave, importSave, hardReset,
        applyData, applyOffline, ensureShape, runMigrations,
        clearStorage, consumeResetMark,
        isSuspended() { return suspended; },
        SAVE_KEY, LEGACY_SAVE_KEYS, RESET_MARK, MIGRATIONS,
    };
})();

</script>
<script>
/* ===== js/engine/loop.js ===== */
/* 主循环：推进时间、结算产出、驱动各子系统 */
(function () {
    const state = GameState;
    let last = 0, acc = 0, renderAcc = 0, saveAcc = 0, secondAcc = 0, autoAcc = 0;
    let running = false;
    const seenErrors = {};

    /* 任何一步抛错都只跳过这一帧，绝不打断 rAF 链（否则玩家看到的是「卡死要刷新」） */
    function safeCall(tag, fn) {
        try { fn(); }
        catch (err) {
            const key = tag + ':' + (err && err.message ? err.message : String(err));
            if (!seenErrors[key]) {
                seenErrors[key] = 1;
                console.error('[主循环] ' + tag + ' 出错：', err);
                if (window.UI && UI.toast) UI.toast('内部错误，已跳过这一帧（详情见控制台）。', 'bad');
            }
        }
    }

    function gameHoursPerSecond() {
        const e = EffectsManager.get(state);
        return (window.HOURS_PER_SECOND || 0.05) * (state.speed || 1) * (1 + (e.runSpeed || 0));
    }

    function advance(dtReal) {
        if (dtReal <= 0) return;
        /* 末日前的三天是按行动回合算的：没人操作就不会到爆发。
           时间推进交给 GameLoop.passTime（由搜刮 / 施工 / 送礼这些动作触发）。 */
        if (PhaseManager.id(state) === 'pre') return;
        const hours = dtReal * gameHoursPerSecond();
        const before = state.hours;
        state.hours += hours;
        state.stats.playSeconds += dtReal;
        if (state.hours > state.stats.bestHours) state.stats.bestHours = state.hours;

        ProductionEngine.advance(state, hours);

        safeCall('story', () => StoryEngine.tick(state, before, state.hours));
        safeCall('scavenge', () => ScavengeEngine.tick(state, hours));
        safeCall('events', () => EventEngine.tick(state, hours));
        safeCall('bonds', () => BondEngine.tick(state, hours));
        safeCall('defense', () => DefenseEngine.tick(state, before, state.hours));
        safeCall('money', () => MoneyEngine.tick(state));
        safeCall('achievements', () => AchievementEngine.check(state));

        const p = PhaseManager.current(state);
        if (p.id !== state.phase) {
            state.phase = p.id;
            EventEngine.addLog(state, '⏱️ 进入「' + p.name + '」阶段。');
        }
    }

    /* 按「游戏小时」推进（行动回合、离线结算、自检都用它）：
       走同一套子系统，所以时间一到该刷新的刷新、该来的袭击还是会来。 */
    function passTime(hours) {
        if (hours <= 0) return state.hours;
        const before = state.hours;
        state.hours += hours;
        if (state.hours > state.stats.bestHours) state.stats.bestHours = state.hours;
        safeCall('production', () => ProductionEngine.advance(state, hours));
        safeCall('story', () => StoryEngine.tick(state, before, state.hours));
        safeCall('scavenge', () => ScavengeEngine.tick(state));
        safeCall('events', () => EventEngine.tick(state, hours));
        safeCall('bonds', () => BondEngine.tick(state, hours));
        safeCall('defense', () => DefenseEngine.tick(state, before, state.hours));
        safeCall('money', () => MoneyEngine.tick(state));
        safeCall('achievements', () => AchievementEngine.check(state));
        const p = PhaseManager.current(state);
        if (p.id !== state.phase) {
            state.phase = p.id;
            EventEngine.addLog(state, '⏱️ 进入「' + p.name + '」阶段。');
        }
        return state.hours;
    }

    function tick(now) {
        if (!running) return;
        const dtReal = last ? Math.min(1.5, (now - last) / 1000) : 0;
        last = now;

        if (!state.paused) {
            acc += dtReal;
            let guard = 0;
            while (acc > 0.0001 && guard++ < 40) {
                const step = Math.min(0.1, acc);
                safeCall('advance', () => advance(step));
                acc -= step;
            }
            secondAcc += dtReal;
            if (secondAcc >= 1) {
                secondAcc = 0;
                safeCall('effects', () => EffectsManager.refreshAllEffects(state));
                state.stats.peakDefense = Math.max(state.stats.peakDefense || 0, PlayerManager.defense(state));
            }
            autoAcc += dtReal;
            if (autoAcc >= 0.6) {
                autoAcc = 0;
                safeCall('auto', () => Actions.autoStep(state));
            }
            saveAcc += dtReal;
            if (saveAcc >= 20 && state.settings.autosave) {
                saveAcc = 0;
                SaveEngine.save(state);
            }
        }

        renderAcc += dtReal;
        if (renderAcc >= 0.1) {
            renderAcc = 0;
            if (window.UI && UI.render) safeCall('render', () => UI.render());
        }
        requestAnimationFrame(tick);
    }

    function start() {
        if (running) return;
        running = true;
        last = 0;
        requestAnimationFrame(tick);
    }

    window.GameLoop = {
        start, advance, passTime, gameHoursPerSecond,
        actionCost(state, kind) { return Actions.actionCost(state, kind); },
        get running() { return running; },
    };
})();

</script>

<script>
/* ===== js/ui/dom.js ===== */
/* 界面基础件：DOM 构造、浮窗、弹窗、轻量 DOM 补丁、数值文案 */
(function () {
    const U = window.Utils;

    function $(sel, root) { return (root || document).querySelector(sel); }
    function $$(sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); }

    function h(html) {
        const t = document.createElement('template');
        t.innerHTML = html.trim();
        return t.content.firstElementChild;
    }

    function esc(s) {
        return String(s === undefined || s === null ? '' : s)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
    }

    function num(n, digits) { return U.fmtNum(n, digits); }
    function hours(h) { return U.fmtHours(h); }
    function countdown(h) { return U.fmtCountdown(h); }
    function rateClass(n) { return n > 1e-9 ? 'pos' : (n < -1e-9 ? 'neg' : 'neu'); }

    /* ---------------- 浮窗（定位必须夹紧，绝不跑出屏幕） ---------------- */
    const tipEl = document.getElementById('tooltip');
    let tipProvider = null;

    function setTipProvider(fn) { tipProvider = fn; }

    function showTip(html, x, y) {
        if (tipEl.__html !== html) {
            tipEl.__html = html;
            tipEl.innerHTML = html;
        }
        tipEl.classList.add('show');
        const vv = window.visualViewport;
        const vw = Math.round(Math.min(window.innerWidth, vv && vv.width ? vv.width : Infinity));
        const vh = Math.round(Math.min(window.innerHeight, vv && vv.height ? vv.height : Infinity));
        const pad = 8;
        if (vh > 0) tipEl.style.maxHeight = Math.max(140, vh - pad * 2) + 'px';
        const rect = tipEl.getBoundingClientRect();
        let left = x + 16;
        let top = y + 16;
        if (left + rect.width > vw - pad) left = x - rect.width - 12;
        if (top + rect.height > vh - pad) top = y - rect.height - 12;
        left = Math.min(Math.max(pad, left), Math.max(pad, vw - rect.width - pad));
        top = Math.min(Math.max(pad, top), Math.max(pad, vh - rect.height - pad));
        tipEl.style.left = left + 'px';
        tipEl.style.top = top + 'px';
    }

    function hideTip() { tipEl.classList.remove('show'); }

    function bindTips(root) {
        let touchStart = null;
        let touchTip = false;

        root.addEventListener('pointerdown', e => {
            if (e.pointerType === 'touch') touchStart = { x: e.clientX, y: e.clientY };
        }, true);

        root.addEventListener('pointerup', e => {
            if (e.pointerType !== 'touch') return;
            const moved = touchStart && (Math.abs(e.clientX - touchStart.x) + Math.abs(e.clientY - touchStart.y) > 12);
            touchStart = null;
            if (moved) return;
            const target = e.target.closest ? e.target.closest('[data-tip]') : null;
            if (!target || !tipProvider) { hideTip(); tipEl._target = null; touchTip = false; return; }
            const html = tipProvider(target.getAttribute('data-tip'));
            if (!html) return;
            tipEl._target = target;
            touchTip = true;
            showTip(html, e.clientX, e.clientY);
            clearTimeout(tipEl._touchTimer);
            tipEl._touchTimer = setTimeout(() => { hideTip(); tipEl._target = null; touchTip = false; }, 5200);
        }, true);

        root.addEventListener('mouseover', e => {
            if (touchTip) return;
            const target = e.target.closest ? e.target.closest('[data-tip]') : null;
            if (!target || !tipProvider) return;
            const html = tipProvider(target.getAttribute('data-tip'));
            if (!html) return;
            tipEl._target = target;
            showTip(html, e.clientX, e.clientY);
        });
        root.addEventListener('mousemove', e => {
            if (touchTip) return;
            if (!tipEl.classList.contains('show') || !tipEl._target) return;
            const target = e.target.closest ? e.target.closest('[data-tip]') : null;
            if (target !== tipEl._target) { hideTip(); tipEl._target = null; return; }
            showTip(tipEl.__html || '', e.clientX, e.clientY);
        });
        root.addEventListener('mouseout', e => {
            if (touchTip) return;
            const target = e.target.closest ? e.target.closest('[data-tip]') : null;
            if (target && target === tipEl._target) { hideTip(); tipEl._target = null; }
        });
    }

    /* ---------------- 提示条 ---------------- */
    const toastRoot = document.getElementById('toast-root');
    function toast(msg, type) {
        const node = h('<div class="toast ' + (type || '') + '">' + esc(msg) + '</div>');
        toastRoot.appendChild(node);
        setTimeout(() => { node.style.transition = 'opacity .4s'; node.style.opacity = '0'; }, 2600);
        setTimeout(() => node.remove(), 3100);
        while (toastRoot.children.length > 4) toastRoot.firstElementChild.remove();
    }

    /* ---------------- 弹窗 ---------------- */
    const modalRoot = document.getElementById('modal-root');

    function openModal(html, opts) {
        opts = opts || {};
        const wrap = h('<div class="modal' + (opts.wide ? ' wide' : '') + '">' + html + '</div>');
        modalRoot.innerHTML = '';
        modalRoot.appendChild(wrap);
        modalRoot.classList.add('open');
        modalRoot._closable = opts.closable !== false;
        return wrap;
    }

    function closeModal() {
        modalRoot.classList.remove('open');
        modalRoot.innerHTML = '';
    }

    function confirmBox(title, text, onOk, okLabel) {
        const wrap = openModal(
            '<h2>' + esc(title) + '</h2><p>' + text + '</p>' +
            '<div class="modal-actions"><button class="btn" data-modal-act="cancel">取消</button>' +
            '<button class="btn danger" data-modal-act="ok">' + esc(okLabel || '确定') + '</button></div>'
        );
        wrap.addEventListener('click', e => {
            const act = e.target.getAttribute && e.target.getAttribute('data-modal-act');
            if (act === 'cancel') closeModal();
            if (act === 'ok') { closeModal(); onOk(); }
        });
    }

    modalRoot.addEventListener('click', e => {
        if (e.target === modalRoot && modalRoot._closable !== false) closeModal();
    });

    /* ---------------- 进度条 ---------------- */
    function bar(pct, cls) {
        return '<div class="bar ' + (cls || '') + '"><i style="width:' + U.clamp(pct * 100, 0, 100).toFixed(1) + '%"></i></div>';
    }

    /* ---------------------------------------------------------
       轻量 DOM 补丁：只改动变化的部分，复用已有节点。
       这样 hover 不会被打断（按钮不闪）、按下与松开之间节点不被换掉（点击不丢）。
       --------------------------------------------------------- */
    function syncAttrs(oldEl, newEl) {
        const oa = oldEl.attributes;
        for (let i = oa.length - 1; i >= 0; i--) {
            const name = oa[i].name;
            if (!newEl.hasAttribute(name)) oldEl.removeAttribute(name);
        }
        const na = newEl.attributes;
        for (let i = 0; i < na.length; i++) {
            const a = na[i];
            if (oldEl.getAttribute(a.name) !== a.value) oldEl.setAttribute(a.name, a.value);
        }
    }

    function syncChildren(oldParent, newParent) {
        const olds = Array.prototype.slice.call(oldParent.childNodes);
        const news = Array.prototype.slice.call(newParent.childNodes);
        for (let i = 0; i < news.length; i++) {
            const n = news[i];
            const o = olds[i];
            if (!o) { oldParent.appendChild(n.cloneNode(true)); continue; }
            if (o.nodeType !== n.nodeType) { oldParent.replaceChild(n.cloneNode(true), o); continue; }
            if (n.nodeType === 3) {
                if (o.data !== n.data) o.data = n.data;
                continue;
            }
            if (n.nodeType === 8) continue;
            if (o.tagName !== n.tagName) { oldParent.replaceChild(n.cloneNode(true), o); continue; }
            /* 复用的节点要清掉文本缓存，否则补丁过的节点会「数字凭空消失」 */
            o.__lastText = undefined;
            syncAttrs(o, n);
            syncChildren(o, n);
        }
        for (let i = news.length; i < olds.length; i++) {
            if (olds[i].parentNode === oldParent) oldParent.removeChild(olds[i]);
        }
    }

    function patchDOM(node, html) {
        const tpl = document.createElement('template');
        tpl.innerHTML = html;
        syncChildren(node, tpl.content);
    }

    function setHTML(node, html) {
        if (!node) return false;
        if (node.__lastHTML === html) return false;
        const first = !node.__lastHTML;
        node.__lastHTML = html;
        if (first && !node.firstChild) node.innerHTML = html;
        else patchDOM(node, html);
        return true;
    }

    function setText(node, text) {
        if (!node) return false;
        if (node.__lastText === text) return false;
        node.__lastText = text;
        node.textContent = text;
        return true;
    }

    /* ---------------- 造价 / 消耗文本 ---------------- */
    function costHtml(cost, opts) {
        opts = opts || {};
        const parts = [];
        for (const k in cost) {
            const have = ResourcesManager.amount(k);
            const lack = have + 1e-6 < cost[k];
            const cfg = RESOURCES_CONFIG[k] || {};
            const room = ResourcesManager.room(GameState, k);
            const spaceIssue = !opts.ignoreSpace && room !== Infinity && room < cost[k];
            parts.push('<span class="' + (lack ? 'lack' : '') + '" data-tip="res|' + esc(k) + '">' +
                (cfg.icon || '') + ' ' + esc(k) + ' ' + num(cost[k]) + (spaceIssue ? ' ⚠空间' : '') + '</span>');
        }
        return parts.join(' ') || '<span class="free">免费</span>';
    }

    /* ---------------- 效果文本：数值 → 文案只在这里实现 ---------------- */
    function effectValueText(key, v) {
        const meta = EffectsManager.EFFECT_META[key];
        const fmt = meta ? meta.fmt : 'flat';
        if (fmt === 'pct') return U.fmtPct(v, v === Math.round(v) ? 0 : 1).replace('0%', '0%');
        if (fmt === 'hours') return (v > 0 ? '+' : '') + v + ' 小时';
        if (fmt === 'hourly') return (v > 0 ? '+' : '') + v + ' / 小时';
        return (v > 0 ? '+' : '') + U.fmtNum(v);
    }

    function effectLines(eff) {
        const out = [];
        for (const key in eff) {
            const v = eff[key];
            if (key === 'special') {
                out.push(EffectsManager.SPECIAL_LABELS[v] || v);
                continue;
            }
            if (key === 'resourceProd') {
                for (const r in v) out.push(r + ' 产出 ' + U.fmtPct(v[r], 0));
                continue;
            }
            if (FACILITIES_CONFIG[key] && typeof v === 'object') {
                const bits = [];
                if (typeof v.prod === 'number') bits.push('产出 ' + U.fmtPct(v.prod, 0));
                if (typeof v.def === 'number') bits.push('防御 ' + U.fmtPct(v.def, 0));
                if (typeof v.cap === 'number') bits.push('容量 ' + U.fmtPct(v.cap, 0));
                out.push('「' + FACILITIES_CONFIG[key].name + '」' + bits.join('，'));
                continue;
            }
            const meta = EffectsManager.EFFECT_META[key];
            const label = meta ? meta.label : key;
            out.push(label + ' ' + effectValueText(key, v));
        }
        return out;
    }

    function effectTextInline(eff, sep) {
        return effectLines(eff).join(sep || '　');
    }

    window.UI = window.UI || {};
    Object.assign(window.UI, {
        $, $$, h, esc, num, hours, countdown, rateClass, bar,
        setHTML, setText, costHtml, effectLines, effectTextInline, effectValueText,
        setTipProvider, bindTips, showTip, hideTip, toast, openModal, closeModal, confirmBox,
    });
})();

<script>
/* ===== js/ui/tips.js ===== */
/* 软窗（鼠标悬浮 / 手指点按）里显示的内容。数值 → 文案统一走 UI.effectLines */
(function () {
    const G = window.UI;

    function box(title, body) {
        return '<div class="tip-title">' + title + '</div>' + body;
    }
    function kv(k, v) {
        return '<div class="tip-kv"><span>' + k + '</span><span>' + v + '</span></div>';
    }
    function li(t) { return '<div class="tip-li">' + t + '</div>'; }

    function tipHtml(key) {
        if (!key) return null;
        const s = GameState;
        const parts = key.split('|');
        const kind = parts[0], arg = parts[1];

        if (kind === 'res') {
            const cfg = RESOURCES_CONFIG[arg];
            const r = s.resources[arg];
            if (!cfg || !r) return null;
            const rate = ProductionEngine.rateOf(s, arg);
            return box(cfg.icon + ' ' + arg,
                '<p class="tip-desc">' + cfg.desc + '</p>' +
                kv('存量', Utils.fmtInt(r.amount)) +
                kv('每小时产出', Utils.fmtNum(rate.prod || 0, 2)) +
                kv('每小时消耗', Utils.fmtNum(rate.use || 0, 2)) +
                (cfg.space ? kv('占用空间', Utils.fmtInt(r.amount * cfg.space) + ' 格（每单位 ' + cfg.space + '）') : ''));
        }
        if (kind === 'space') {
            const e = EffectsManager.get(s);
            return box('💠 异能空间（S 级）',
                '<p class="tip-desc">主角自带的空间异能。容量靠异能结晶扩容，重生也不会丢。</p>' +
                kv('等级', 'Lv' + s.space.level) +
                kv('容量', Utils.fmtInt(ResourcesManager.spaceCap(s)) + ' 格') +
                kv('已用', Utils.fmtInt(ResourcesManager.spaceUsed(s)) + ' 格') +
                kv('结晶', Utils.fmtInt(s.space.crystals) + ' 💎') +
                '<p class="tip-hint">容量加成 ' + Utils.fmtPct(e.spaceCap || 0, 0) +
                '，固定加成 ' + Utils.fmtInt(e.spaceCapFlat || 0) + ' 格。</p>');
        }
        if (kind === 'phase' || kind === 'clock' || kind === 'countdown') {
            const p = PhaseManager.current(s);
            const remain = Math.max(0, PHASES_CONFIG[1].start - s.hours);
            return box('⏱️ ' + p.name,
                '<p class="tip-desc">' + p.desc + '</p>' +
                kv('已过', Utils.fmtHours(s.hours)) +
                (p.end !== Infinity ? kv('本阶段还有', Utils.fmtCountdown(Math.max(0, p.end - s.hours))) : '') +
                (p.id === 'pre'
                    ? li('这一阶段按行动推进：出门搜一趟 ' + ACTION_COSTS.scavenge + ' 小时（危险区 ' +
                        ACTION_COSTS.scavengeFar + ' 小时）、施工一次 ' + ACTION_COSTS.build + ' 小时、送礼物 ' +
                        ACTION_COSTS.gift + ' 小时。') +
                      li('现在还能出门大约 <b>' + Math.floor(remain / ACTION_COSTS.scavenge) + '</b> 次。') +
                      '<p class="tip-hint">不操作时间不会走，所以没有「等一等」这回事。</p>'
                    : ''));
        }
        if (kind === 'speed') {
            const pre = PhaseManager.id(s) === 'pre';
            return box('⏳ 世界流速',
                pre
                    ? '<p class="tip-desc">末日前那三天是按行动回合算的，点一次搜刮才走一格时间，' +
                      '所以流速现在是禁用的（加速也没用，反而会白吃准备时间）。</p>' +
                      li('末日爆发之后时间会自己走，那时流速才生效：×1 ~ ×4。')
                    : '<p class="tip-desc">时间会自己走：资源产出、地点刷新、袭击倒计时都按这个速度推进。</p>' +
                      kv('当前流速', '×' + (s.speed || 1)));
        }
        if (kind === 'doom') {
            const d = DOOMS_CONFIG[s.doom] || {};
            return box(d.icon + ' ' + d.name,
                '<p class="tip-desc">' + d.desc + '</p>' +
                (d.rules || []).map(t => li(t)).join('') +
                '<p class="tip-hint">末日类型每次重生都会换，只有空间异能一直跟着你。</p>');
        }
        if (kind === 'morale') {
            return box('🔥 士气 ' + Math.round(s.morale) + '%',
                '<p class="tip-desc">士气影响设施产出与据点防御。缺物资、打输、失去同伴都会掉士气。</p>' +
                kv('产出乘数', '×' + ProductionEngine.moraleMult(s).toFixed(2)) +
                kv('防御乘数', '×' + (0.85 + s.morale / 100 * 0.3).toFixed(2)));
        }
        if (kind === 'crystal') {
            return box('💎 异能结晶',
                '<p class="tip-desc">会用光的石头：升级空间异能、解锁空间技能、重抽第二异能都要它。跨重生保留。</p>' +
                kv('当前', Utils.fmtInt(s.space.crystals)) +
                kv('累计获得', Utils.fmtInt(s.space.totalCrystals)));
        }
        if (kind === 'heat') {
            return box('🔥 仇家 ' + s.heat + ' / ' + HEAT_RULES.max,
                '<p class="tip-desc">搜刮搜不出钱：现金只能向人借（花好感）或者抢（记仇）。' +
                '抢了一次，就有人记账。</p>' +
                li('仇家 ≥ ' + HEAT_RULES.visitAt + '：会有人上门来「聊聊那笔账」。') +
                li('仇家 ≥ ' + HEAT_RULES.raidAt + '：袭击直接变成「仇家清算」，强度随仇家上涨。') +
                li('每 ' + HEAT_RULES.coolHours + ' 小时没人来算账，仇家会淡 1 点。') +
                kv('当前影响', '袭击强度 ×' + MoneyEngine.raidMultiplier(s).toFixed(2)));
        }
        if (kind === 'raid') {
            const info = DefenseEngine.info(s);
            return box('🚨 ' + info.doomName,
                '<p class="tip-desc">恶性事件随阶段推进越来越频繁、越来越强。防御不够，据点会被攻占 —— 那一刻直接触发重生。</p>' +
                kv('预计强度', info.strength) +
                kv('我方防御', info.defense) +
                kv('预警时间', info.warning + ' 小时') +
                kv('历史', '守住 ' + s.raid.wins + ' 次 / 失守 ' + s.raid.losses + ' 次'));
        }
        if (kind === 'loc') {
            const loc = LOCATIONS_CONFIG.find(l => l.id === arg);
            if (!loc) return null;
            const st = ScavengeEngine.status(s, arg);
            return box(loc.icon + ' ' + loc.name,
                '<p class="tip-desc">' + loc.desc + '</p>' +
                kv('可能找到', loc.loot.map(x => x.res).join('、')) +
                kv('危险度', Math.round(loc.danger * 100) + '%（遭遇概率 ' +
                    Math.round(ScavengeEngine.encounterChance(s, loc) * 100) + '%）') +
                kv('次数', (st.max - st.uses) + ' / ' + st.max) +
                kv('刷新', '用完 ' + Utils.fmtHours(ScavengeEngine.refreshHours(s, loc)) + ' 后恢复') +
                (st.medCost ? '<p class="tip-hint">放射尘环境下每次搜刮额外消耗药品 ' + st.medCost + '。</p>' : ''));
        }
        if (kind === 'fac') {
            const cfg = FACILITIES_CONFIG[arg];
            if (!cfg) return null;
            const st = BuildEngine.status(s, arg);
            const lv = Math.max(1, st.level);
            const lines = [];
            if (cfg.effect) lines.push('效果：' + G.effectTextInline(cfg.effect(lv), '；'));
            if (cfg.produce) {
                const out = cfg.produce(lv);
                lines.push('产出：' + Object.keys(out).map(k => k + ' ' + Utils.fmtNum(out[k], 1) + '/时').join('、'));
            }
            if (cfg.power) lines.push('耗电：' + Utils.fmtNum(cfg.power(lv), 2) + ' 燃料/时');
            return box(cfg.icon + ' ' + cfg.name + ' Lv' + st.level,
                '<p class="tip-desc">' + cfg.desc + '</p>' +
                lines.map(t => li(t)).join('') +
                kv('等级', st.level + ' / ' + cfg.maxLevel) +
                (st.maxed ? '<p class="tip-hint">已经满级。</p>'
                    : (st.tierAllowed ? kv('升到 Lv' + (st.level + 1), G.costHtml(st.cost || {}))
                        : '<p class="tip-hint">需要更高级的据点才能建。</p>')) +
                (BuildEngine.reqListFor(arg, st.target).length
                    ? '<p class="tip-hint">升到 Lv' + st.target + ' 的前置：' + BuildEngine.reqTextFor(arg, st.target) + '</p>'
                    : '') +
                (!st.tierAllowed ? '<p class="tip-hint">需要更高级的据点（' + cfg.tier + ' 级设施）。</p>' : ''));
        }
        if (kind === 'skill') {
            const cfg = SPACE_SKILLS[arg];
            if (!cfg) return null;
            const st = AbilityEngine.skillStatus(s, arg);
            return box(cfg.icon + ' ' + cfg.name,
                '<p class="tip-desc">' + cfg.desc + '</p>' +
                li('效果：' + G.effectTextInline(cfg.effect, '；')) +
                kv('消耗', cfg.cost + ' 💎') +
                '<p class="tip-hint">' + (st.unlocked ? '已解锁。' : st.reason) + '</p>');
        }
        if (kind === 'ab') {
            const cfg = SECOND_ABILITIES[arg];
            if (!cfg) return null;
            const tier = ABILITY_TIERS[cfg.tier];
            return box(cfg.icon + ' ' + cfg.name,
                '<p class="tip-desc">' + cfg.desc + '</p>' +
                li('等级：<b style="color:' + tier.color + '">' + tier.name + '</b>（' + tier.desc + '）　战力 +' + cfg.power) +
                li('效果：' + G.effectTextInline(cfg.effect, '；')));
        }
        if (kind === 'bond') {
            const cfg = BondEngine.cfg(arg);
            const st = BondEngine.get(s, arg);
            if (!cfg || !st) return null;
            const info = BondEngine.giftInfo(s, arg);
            const outcome = { ally: '同伴', partner: '伴侣', enemy: '敌人', dead: '已不在', left: '已离开' }[st.outcome] || '还在观望';
            return box(cfg.icon + ' ' + cfg.name + '（' + outcome + '）',
                '<p class="tip-desc">' + cfg.desc + '</p>' +
                kv('身份', cfg.role) +
                kv('异能', cfg.ability ? cfg.ability.tier + ' 级 · ' + cfg.ability.name : '普通人') +
                kv('好感', Math.round(st.value) + ' / 100') +
                (cfg.assist ? li('协助（好感 ' + cfg.assist.at + ' 起）：' + cfg.assist.desc) : '') +
                (cfg.fight ? li('并肩作战：战力 +' + cfg.fight.power + '（好感 ' + (cfg.fight.at || 0) + ' 起）') : '') +
                li('礼物偏好：' + cfg.gift.res + ' ×' + cfg.gift.amount +
                    (cfg.giftLike && cfg.giftLike.res !== cfg.gift.res ? '（更喜欢 ' + cfg.giftLike.res + '）' : '')) +
                '<p class="tip-hint">' + (info.ok
                    ? '今天还可以送 ' + info.left + ' 次，这次大约 +' + info.value + ' 好感。'
                    : (info.reason || '')) + '</p>');
        }
        if (kind === 'ach') {
            const cfg = ACHIEVEMENTS_CONFIG.find(a => a.id === arg);
            if (!cfg) return null;
            const done = !!s.achievements[arg];
            return box((done ? '🏆 ' : '🔒 ') + cfg.name,
                '<p class="tip-desc">' + cfg.desc + '</p>' +
                kv('奖励', '异能结晶 +' + cfg.crystal) +
                (cfg.effect ? li('附带：' + G.effectTextInline(cfg.effect, '；')) : '') +
                '<p class="tip-hint">' + (done ? '已完成。' : '还没有完成。') + '</p>');
        }
        if (kind === 'shop') {
            const item = REBIRTH_SHOP.find(x => x.id === arg);
            if (!item) return null;
            const st = RebirthEngine.shopStatus(s, item);
            return box(item.icon + ' ' + item.name + ' Lv' + st.level,
                '<p class="tip-desc">' + item.desc + '</p>' +
                (item.effect ? li('当前：' + G.effectTextInline(item.effect(Math.max(1, st.level)), '；')) : '') +
                (st.maxed ? '<p class="tip-hint">已满级。</p>' : kv('下一级', st.cost + ' 重生点')) +
                '<p class="tip-hint">重生商店的加成永久生效，跨重生保留。</p>');
        }
        if (kind === 'def') {
            const e = EffectsManager.get(s);
            const base = BuildEngine.baseOf(s);
            return box('🛡️ 防御构成',
                kv('据点基础', base.defense) +
                kv('战力贡献', Math.round(PlayerManager.combatPower(s) * 0.8)) +
                kv('固定加成', '+' + Math.round(e.defenseFlat || 0)) +
                kv('百分比加成', Utils.fmtPct(e.defense || 0, 0)) +
                kv('士气乘数', '×' + (0.85 + s.morale / 100 * 0.3).toFixed(2)) +
                kv('合计', '<b>' + PlayerManager.defense(s) + '</b>'));
        }
        return null;
    }

    window.Tips = { tipHtml };
})();
